# Sensitive fields are intentionally omitted. Edit them in Form View.
file:
  sink:
    general:
      adapter_id: fm-file-sink
      auto_create_directory: 1
      dest_file_name_type: 3
      storeBackupStateRemotely: false
      state_backup_path: ./backup_state.cfg
      clear_state_on_eod: 0
      eod_time_sec: -1
      alwaysVerifyData: true
      alwaysMatchCompleteEvent: true
    gcs:
      enabled: 0
      projectId: GCS_PROJECT_ID
      credentialsFilePath: /home/centos/pubsubplus-connector-file-2.2.0/configs/gcs/creds.json
      enableBulkComposeStrategy: true
      retrySettings:
        maxAttempts: 5
        retryDelayMultiplier: 3
        maxDurationMinutes: 2
    sftp_settings:
      enabled: 0
      ip: SFTP_HOST_ADDRESS
      port: 22
      user: SFTP_USER
      strictHostKeyChecking: 'no'
    ftp_settings:
      enabled: 0
      ip: FTP_HOST_ADDRESS
      port: 21
      user: FTP_USER
      secured: true
    file_owner_permissions:
      copy_source_file_mode_permissions: 0
      copy_source_file_owner: 0
      override_username: centos
      override_group: centos
    command_center:
      enabled: 0
      useOutputDestinationSolaceCredentials: true
      solace_base_publish_topic: solace/dd/STORE-MANGEMENT/fa-assembler/cc/se/fa/assembler/Frankfurt
      solace_messaging_mode: PERSISTENT
      heartbeat_enabled: 0
      heartbeat_interval: 3
      solace_base_publish_topic_heartbeat: solace/dd/STORE-MANGEMENT/fa-assembler/cc/se/fa/assembler/Frankfurt
      events:
        fileStart: true
        fileComplete: true
spring:
  cloud:
    stream:
      bindings:
        input-0:
          destination: /home/banala/Music/entityFolders/updated/SOURCE_TEST_V1/file_paths.cfg
          binder: file
        output-0:
          destination: file/test
          binder: solace
