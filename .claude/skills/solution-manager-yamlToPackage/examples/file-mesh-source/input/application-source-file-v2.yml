file:
  source:
    scheduler:
      restart_time_sec: 10
    general:
      adapter_id: fm-file-source
      file_type: 4
      ignoreEmptyFiles: false
      state_backup_path: ""
      copy_file_mode_permissions: 1
      max_file_transfer_size: 999000
      max_files_allowed: 99999
      max_bandwidth_limit: 100000000
      clear_state_on_eod: 1
      eod_time_sec: -1
      multiple_files_flag: 0
    file_to_event:
      enabled: 0
      fileFormat: 4
      eventDelimiter: '|'
      jsonPath: '$.Authors[*].Books[*]'
      xPath: /class/student
    gcs:
      enabled: 0
      projectId: GCS_PROJECT_ID
      credentialsFilePath: /home/centos/pubsubplus-connector-file-2.2.0/configs/gcs/creds.json
      retrySettings:
        maxAttempts: 5
        retryDelayMultiplier: 3
        maxDurationMinutes: 2
    sftp_settings:
      enabled: 0
      ip: SFTP_HOST_ADDRESS
      port: 22
      user: SFTP_USER
      password: SFTP_PASSWORD
      strictHostKeyChecking: no
    ftp_settings:
      enabled: 0
      ip: FTP_HOST_ADDRESS
      port: 21
      user: FTP_USER
      password: FTP_PASSWORD
      secured: true
    directory_wildcard:
      wildcard_type: 0
      config_path: ""
    directory_replication:
      start_time: -1
    solace_out:
      lvq: file.source.lvq
      destination: file/source/lvq
    command_center:
      enabled: 1
      useOutputDestinationSolaceCredentials: true
      heartbeat_enabled: 1
      heartbeat_interval: 20
      solace_base_publish_topic_heartbeat: scm/dd/FIN/source/cc/se/fa/source/findata
      solace_base_publish_topic: scm/dd/FIN/source/cc/se/fa/source/findata
      solace_messaging_mode: PERSISTENT
      events:
        fileStart: true
        fileComplete: true
      useoutputdestinationsolacecredentials: 'true'
solace:
  connector:
    security:
      enabled: false
    error:
      handle: stop_all
    workflows:
      '0':
        enabled: true
        acknowledgment:
          publish-async: true
    management:
      leader-election:
        mode: standalone
        fail-over:
          max-attempts: 3
          back-off-initial-interval: 1000
          back-off-max-interval: 10000
          back-off-multiplier: 2
      queue: fm-file-source-management
      session:
        host: 'tcp://host.docker.internal:55554'
        msg-vpn: default
        client-username: test
        client-password: test
  java:
    host: 'tcp://host.docker.internal:55554'
    msg-vpn: default
    client-username: test
    client-password: test
    connectRetries: -1
    reconnectRetries: -1
logging:  # Logging configuration. For more info: https://docs.spring.io/spring-boot/docs/current/reference/html/features.html#features.logging
  level:
    root: INFO
    com.solace.connector.jms: INFO # Enables TRACE logs for connector
    com.solace.connector.core: INFO # Enables TRACE logs for connector framework
    com.solace.spring.cloud.stream.binder: INFO # Enables TRACE logs for Solace and JMS binders
    com.solacecoe.spring.cloud.stream.binders.file: TRACE # Enables TRACE logs for Solace and JMS binders
  file:
    name: myapp.log  # base log file name
  logback:
    rollingpolicy:  # Logback file rolling policy
      file-name-pattern: "${LOG_FILE}.%d{yyyy-MM-dd}.%i.gz"  # Pattern for rolled-over log file names. Example: Rolls the log file into an archive once every day. `%i` is reset to `0` at the start of the day.
      max-file-size: 100MB  # The maximum size of log file before it is archived. Example: Within a given day, when the log file reaches 100 MB, archive it, and increment `%i`.
      max-history: 7  # The maximum rotation-period's worth of archive log files to keep. Example: Since the `file-name-pattern` is configured to rollover once every day, keep 7 days worth of log archives.
      total-size-cap: 1GB  # Total size of log backups for a given rotation period. Example: Keep up-to 1 GB of log archives for every day.
management:
  security:
    enabled: false
  simple:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: "health,info,metrics"
      cors:
        allowed-origins: "*"
        allowed-methods: "*"
        allowed-headers: "*"
  endpoint:
    logfile:
      external-file: myapp.log
    prometheus:
      enabled: false
    health:
      show-details: ALWAYS
      status:
        # Change default order so that RECONNECTING takes precedence over UP and UNKNOWN
        order:
          - DOWN
          - OUT_OF_SERVICE
          - RECONNECTING
          - UP
          - UNKNOWN

