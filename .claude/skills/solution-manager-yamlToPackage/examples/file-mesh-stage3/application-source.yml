# Rendered by solution-manager-yamlToPackage. Secrets are ${SM_SECRET_*} placeholders resolved from
# the MI's environment at start; no secret value is written here (I6).
file:
  source:
    scheduler:
      restart_time_sec: 10
    general:
      adapter_id: fm-file-source
      file_type: 4
      ignoreEmptyFiles: false
      state_backup_path: ''
      copy_file_mode_permissions: 1
      max_file_transfer_size: 999000
      max_files_allowed: 99999
      max_bandwidth_limit: 100000000
      clear_state_on_eod: 1
      eod_time_sec: -1
      multiple_files_flag: 0
    file_to_event:
      enabled: 0
      fileFormat: 4
      eventDelimiter: '|'
      jsonPath: $.Authors[*].Books[*]
      xPath: /class/student
    gcs:
      enabled: 0
      projectId: GCS_PROJECT_ID
      credentialsFilePath: /home/centos/pubsubplus-connector-file-2.2.0/configs/gcs/creds.json
      retrySettings:
        maxAttempts: 5
        retryDelayMultiplier: 3
        maxDurationMinutes: 2
    sftp_settings:
      enabled: 0
      ip: SFTP_HOST_ADDRESS
      port: 22
      user: SFTP_USER
      password: ${SM_SECRET_FILE_SOURCE_SFTP_SETTINGS_PASSWORD}
      strictHostKeyChecking: 'no'
    ftp_settings:
      enabled: 0
      ip: FTP_HOST_ADDRESS
      port: 21
      user: FTP_USER
      password: ${SM_SECRET_FILE_SOURCE_FTP_SETTINGS_PASSWORD}
      secured: true
    directory_wildcard:
      wildcard_type: 0
      config_path: ''
    directory_replication:
      start_time: -1
    solace_out:
      lvq: file.source.lvq
      destination: file/source/lvq
    command_center:
      enabled: 1
      useOutputDestinationSolaceCredentials: true
      heartbeat_enabled: 1
      heartbeat_interval: 20
      solace_base_publish_topic_heartbeat: scm/dd/FIN/source/cc/se/fa/source/findata
      solace_base_publish_topic: scm/dd/FIN/source/cc/se/fa/source/findata
      solace_messaging_mode: PERSISTENT
      events:
        fileStart: true
        fileComplete: true
cache:
  CACHE_ENABLED: true
  CACHE_PROVIDER: memory
  CACHE_TTL: 5m
  REDIS_URL: null
server:
  port: 8092
  ssl:
    enabled: false
    key-store: file:/home/banala/Music/entityFolders/download_binaries/SOURCE_NOSUBORG_Alice_FF_NWFILE_T3/keystore.p12
    key-store-password: ${SM_SECRET_SERVER_SSL_KEY_STORE_PASSWORD}
    key-store-type: PKCS12
    key-alias: myalias
spring:
  boot:
    admin:
      client:
        instance:
          prefer-ip: true
          management-url: http://localIP:${server.port}/actuator
          service-url: http://localIP:${server.port}/
        enabled: true
        url: http://50.17.36.43:9500/admin
        auto-registration: true
        prefer-ip: true
        username: user
        password: ${SM_SECRET_SPRING_BOOT_ADMIN_CLIENT_PASSWORD}
  cloud:
    stream:
      bindings:
        input-0:
          destination: /app/external/classpath/file_paths.cfg
          binder: file
        output-0:
          destination: SOURCE/DEFAULT/Alice/FF/NWFILE/SEP15/1
          binder: solace
  application:
    name: fm-file-source
solace:
  connector:
    security:
      enabled: false
    error:
      handle: stop_all
    workflows:
      '0':
        enabled: true
        acknowledgment:
          publish-async: true
    management:
      leader-election:
        mode: standalone
        fail-over:
          max-attempts: 3
          back-off-initial-interval: 1000
          back-off-max-interval: 10000
          back-off-multiplier: 2
      queue: fm-file-source-management
      session:
        host: tcp://localhost:55555
        msg-vpn: default
        client-username: test
        client-password: ${SM_SECRET_SOLACE_CONNECTOR_MANAGEMENT_SESSION_CLIENT_PASSWORD}
  java:
    host: tcp://localhost:55555
    msg-vpn: default
    client-username: test
    client-password: ${SM_SECRET_SOLACE_JAVA_CLIENT_PASSWORD}
    connectRetries: -1
    reconnectRetries: -1
logging:
  level:
    root: INFO
    com:
      solace:
        connector:
          jms: INFO
          core: INFO
        spring:
          cloud:
            stream:
              binder: INFO
      solacecoe:
        spring:
          cloud:
            stream:
              binders:
                file: TRACE
  file:
    name: myapp.log
  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_FILE}.%d{yyyy-MM-dd}.%i.gz
      max-file-size: 100MB
      max-history: 7
      total-size-cap: 1GB
management:
  security:
    enabled: false
  simple:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      cors:
        allowed-origins: '*'
        allowed-methods: '*'
        allowed-headers: '*'
  endpoint:
    logfile:
      external-file: myapp.log
    prometheus:
      enabled: false
    health:
      show-details: ALWAYS
      status:
        order: DOWN,OUT_OF_SERVICE,RECONNECTING,UP,UNKNOWN
