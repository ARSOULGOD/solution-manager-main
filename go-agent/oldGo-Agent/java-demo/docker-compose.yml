# Pre-create three independently controllable containers from one image.
# Agent never creates these — only start/stop/restart/status by name.
services:
  java1:
    image: sm-java-demo:local
    container_name: java1
    ports:
      - "8081:8080"
    environment:
      SERVICE_NAME: java1
      SERVER_PORT: "8080"

  java2:
    image: sm-java-demo:local
    container_name: java2
    ports:
      - "8082:8080"
    environment:
      SERVICE_NAME: java2
      SERVER_PORT: "8080"

  java3:
    image: sm-java-demo:local
    container_name: java3
    ports:
      - "8083:8080"
    environment:
      SERVICE_NAME: java3
      SERVER_PORT: "8080"
