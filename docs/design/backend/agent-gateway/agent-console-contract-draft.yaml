#         (drainAgent on an agent with no live session). validate-openapi check 18 pins this enum constant-for-constant to
#         ErrorCode.java, so T3.3/T3.5/T4.3 add each member to both files in the same commit.
#   D-C4  (REFUTED by the review, R-17; kept for the record) the three agent-id routes first read `x-sm-scope: environment`. The
