<a href="#main" class="skip-link">Skip to main content</a>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, createContext, useContext, useCallback } = React;
const LS = { get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}, set:(k,v)=>localStorage.setItem(k,JSON.stringify(v)) };
window.LS = LS;

// ---- Demo state (the "state toggle" the reviewer asked for) ----
const DemoCtx = createContext(null);
window.DemoCtx = DemoCtx;
window.useDemo = () => useContext(DemoCtx);

// ---- tiny hash router so a selection lives in the URL, not local state ----
function useHashRoute() {
  const parse = () => {
    const h = (location.hash || "#/home").replace(/^#/, "");
    const [path, query] = h.split("?");
    const parts = path.split("/").filter(Boolean); // e.g. ["solutions","cache","instances"]
    const params = new URLSearchParams(query || "");
    return { parts, params, path };
  };
  const [route, setRoute] = useState(parse);
  useEffect(() => {
    const on = () => setRoute(parse());
    window.addEventListener("hashchange", on);
    return () => window.removeEventListener("hashchange", on);
  }, []);
  const nav = useCallback((path) => { location.hash = path; }, []);
  return [route, nav];
}

function App() {
  const [authed, setAuthed] = useState(() => LS.get("smv2_authed", false));
  const [demo, setDemo] = useState(() => LS.get("smv2_demo", "populated"));
  const [route, nav] = useHashRoute();
  useEffect(() => LS.set("smv2_authed", authed), [authed]);
  useEffect(() => LS.set("smv2_demo", demo), [demo]);
  useEffect(() => { if (authed && (!location.hash || location.hash === "#/")) location.hash = "/home"; }, [authed]);

  if (!authed) return <LoginScreen onAuthed={() => { setAuthed(true); location.hash = "/home"; }} />;

  const { parts } = route;
  let screen = "home";
  if (parts[0] === "solutions") {
    if (parts[4] === "designer") screen = "designer";
    else if (parts[4] === "governance") screen = "governance";
    else if (parts[4] === "monitoring") screen = parts[5] === "explore" ? "explore" : "monitoring";
    else if (parts[2] === "instances") screen = "instances";
    else screen = "solutions";
  } else if (parts[0] === "targets") screen = "targets";
  else if (parts[0] === "admin") screen = "admin";
  else if (parts[0] === "home") screen = "home";

  let body;
  if (screen === "home") body = <HomeScreen nav={nav} route={route} />;
  else if (screen === "solutions") body = <SolutionsScreen nav={nav} route={route} />;
  else if (screen === "instances") body = <InstancesScreen nav={nav} route={route} />;
  else if (screen === "designer") body = <DesignerScreen nav={nav} route={route} />;
  else if (screen === "governance") body = <GovernanceScreen nav={nav} route={route} />;
  else if (screen === "monitoring") body = <DashboardsScreen nav={nav} route={route} />;
  else if (screen === "explore") body = <ExploreScreen nav={nav} route={route} />;
  else if (screen === "targets") body = <TargetsScreen nav={nav} route={route} />;
  else if (screen === "admin") body = <AdminScreen nav={nav} route={route} />;
  else body = <HomeScreen nav={nav} route={route} />;

  return (
    <DemoCtx.Provider value={{ demo, setDemo }}>
      <AppShell screen={screen} route={route} nav={nav} onSignOut={() => { setAuthed(false); location.hash = ""; }}>
        {body}
      </AppShell>
    </DemoCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
