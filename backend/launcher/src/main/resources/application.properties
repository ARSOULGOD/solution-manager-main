# Boot's default static-resource mapping ("/webjars/**", "/**") registers a real HandlerMapping
# bean (a ResourceHttpRequestHandler-backed mapping) that OperationCoverageValidator's
# HandlerMapping inspection now refuses to start next to — that handler is not a HandlerMethod and
# is not this gateway's NoRouteHandler, so it would be a live, unauthenticated route serving
# classpath content. Disabling it here is what lets NoRouteHandler (registered at
# Ordered.LOWEST_PRECEDENCE) actually be the one serving unknown routes with a 404 Problem body.
spring.web.resources.add-mappings=false

# Forwarded headers (plan 013 review W3C-1). PINNED, not defaulted: left unset, Spring Boot turns on Tomcat's RemoteIpValve whenever
# it detects a cloud platform (Kubernetes, Cloud Foundry, Heroku, Azure App Service, Nomad), and that valve trusts every
# private-range peer's X-Forwarded-Proto and X-Forwarded-For. The gateway applies its OWN exact sm.gateway.trusted-proxies rule to
# both headers (CredentialTransportInterceptor, ClientAddressResolver), so the container must leave the scheme and the peer
# address alone. ForwardedHeadersLockdown refuses to boot if an overlay sets anything but 'none'.
server.forward-headers-strategy=none

# ---- Gateway HTTP boundary (console-gateway) -----------------------------------------------
# Every property below is a deployment choice, not a shared default, so none of them is actually
# set in this file — only documented here, commented out, so this is still where an operator finds
# the full list of knobs this process reads. See GatewayProperties' own javadoc for the full
# contract of each.
#
# sm.gateway.trusted-origins — REQUIRED, no default: at least one exact scheme://host[:port]
# origin (lowercase, no path/query/trailing-slash/default-port/wildcard), compared byte-for-byte
# against a browser's Origin/Referer on every unsafe request. Startup fails if left unset.
#   sm.gateway.trusted-origins[0]=https://console.example.test
#
# sm.gateway.trusted-proxies — default empty. Exact IP literals (IPv4 or IPv6; never a hostname or
# CIDR range) of the reverse proxy/proxies this process sits behind. Set this to the front server's
# own address(es) whenever one proxies /api to this process — the documented topology.
#   sm.gateway.trusted-proxies[0]=10.0.0.1
# A listed proxy MUST set (overwrite) X-Forwarded-Proto to the scheme of its own listener, and append to X-Forwarded-For: a proxy
# that passes a client-sent X-Forwarded-Proto through lets that client assert https over the proxy's plain-HTTP listener, and a
# credential-bearing request (registerTarget) would then pass the INSECURE_TRANSPORT check.
#
# sm.gateway.direct-client-connections — boolean, default false. Set true ONLY when this process
# is exposed directly to clients with no reverse proxy in front, so the socket peer genuinely IS
# the client address.
#
# B1: startup FAILS unless exactly one of sm.gateway.trusted-proxies (non-empty) or
# sm.gateway.direct-client-connections=true is set — both unset, or both set, are refused. Left
# unset, every client's socket peer would resolve to the ONE front-proxy address for every real
# user, collapsing the per-client-address login throttle below into a single shared key. This
# choice belongs to the operator's own environment overlay, which is why it is not made here.
#   sm.gateway.direct-client-connections=true
#
# sm.cp.entitlement.on-first-load.* — OR-148: a package load entitles its organization on first load. Defaulted to
# enabled / 10 instances when absent; max-instances must be at least 1. Set enabled=false to restore the
# 409 ENTITLEMENT_REFUSED for an unentitled solution. An existing entitlement is never changed by a load:
#   sm.cp.entitlement.on-first-load.enabled=true
#   sm.cp.entitlement.on-first-load.max-instances=10
#
# sm.control.login.* — the local-login USERNAME-dimension throttle, defaulted to 5 failures / 15m
# window / 15m lockout when absent (LoginRateLimitPolicy.LOCAL_DEFAULT):
#   sm.control.login.failure-threshold=5
#   sm.control.login.window=15m
#   sm.control.login.lockout=15m
#
# sm.control.login-address.* — the local-login CLIENT-ADDRESS-dimension throttle (OR-20), keyed on
# the address ClientAddressResolver resolves (the socket peer, or the nearest untrusted
# X-Forwarded-For entry behind a trusted proxy). Looser than the username dimension by default
# since one address legitimately carries many usernames (e.g. an office NAT); defaulted to 20
# failures / 15m window / 15m lockout when absent (LoginRateLimitPolicy.ADDRESS_DEFAULT):
#   sm.control.login-address.failure-threshold=20
#   sm.control.login-address.window=15m
#   sm.control.login-address.lockout=15m
#
# ---- Mesh publishing (dp-core meshbridge; plan 010 T3.3) -----------------------------------
# Notices (catalog.package today) are published to the CUSTOMER's event mesh after the owning commit. There is NO
# default broker. sm.mesh.enabled defaults to false: the application boots with the mesh in a declared degraded
# state (publishes are counted drops, one WARN at boot) - never a refusal to boot. Set it true only together with a
# complete connection: with it true, a missing host/vpn/client-username refuses to boot (fail closed on a typo).
# The password is a deployment secret (I6): supply it from the environment (SM_MESH_PASSWORD maps to
# sm.mesh.password) or the secret backend - never commit it to this file.
#   sm.mesh.enabled=true
#   sm.mesh.host=tcps://broker.example.test:55443
#   sm.mesh.vpn=sm-vpn
#   sm.mesh.client-username=sm-backend
#   sm.mesh.password=<from the environment, never committed>

# ---- Monitoring routes (console-gateway, /api/console/v1; plan 011 P11-7.2) --------------------
# Every default below is an owner ruling (M-Q22, M-Q24), none is set here, and none may be raised by a request.
#
# sm.gateway.metrics.query-rate-per-second — default 10 (M-Q24 (5)): queries (range, instant and export requests) one SESSION may
# start per second, a token bucket per process; over it is 429 RATE_LIMITED, reason query-rate, Retry-After 1.
#   sm.gateway.metrics.query-rate-per-second=10
#
# sm.gateway.metrics.export-async-timeout — default 30m (M-Q22 (2)): how long an export may stream before it is cut and audited
# "cut". Set EXPLICITLY on the MVC async support (the servlet container's own default is 30 s, and a 20 M-row stream outlasts it);
# keep it in step with sm.dp.metrics.export.statement-timeout, which bounds the same stream on the database side.
#   sm.gateway.metrics.export-async-timeout=30m
#
# sm.gateway.metrics.export-max-threads — default 8: how many export streams may hold a thread at once (the MVC async executor, no
# queue). The data plane's own caps (sm.dp.metrics.export.global, default 2) are taken ON the streaming thread, so this is what keeps
# a burst of admitted requests from creating a thread each before they are refused. Past it the answer is the same
# 429 RATE_LIMITED, reason export-concurrency. Keep it above sm.dp.metrics.export.global.
#   sm.gateway.metrics.export-max-threads=8
#
# sm.gateway.metrics.raw-min-bucket-seconds — default 30: what GET /api/console/v1/capabilities advertises as the raw tier's
# smallest bucket (the collector's default scrape interval). The gateway cannot read the data plane's declared intervals.
#   sm.gateway.metrics.raw-min-bucket-seconds=30
#
# The capabilities' series cap, points per series, tier thresholds and retentions are read from the data plane's OWN keys
# (sm.dp.metrics.query.series-cap, .max-points-per-series, .raw-max-range, .hourly-max-range, .raw-retention, .hourly-retention),
# so what the console renders is what the data plane enforces. Their defaults are stated in both modules (the gateway may not
# import dp-core); MetricsEndpointsIT.capabilitiesAdvertiseTheLimitsTheDataPlaneEnforces fails the build if they drift.

# ---- Agent-facing gateway (plan 015 T3.2; runtime/compose.yml sets these environment names, plan 015 T2.4) ----------------------
# The gRPC/mTLS listener is composed ONLY when sm.agent.gateway.enabled=true (SM_AGENT_GATEWAY_ENABLED); with it false (the default) a
# dp-remote-only installation opens no agent port and needs none of the material below. There is no SM_DP_AGENT_RUNTIME_ENABLED:
# which transport a placement uses is a property of its target, not a switch (plan 015 Global constraint 5).
# Secrets are files (compose `secrets`): the certificate, key and trust bundle are PATHS. The CA keystore password is the one variable
# sm-launcher fills from SM_AGENT_CA_KEYSTORE_PASSWORD_FILE (I6: it never appears in a file or a log).
sm.agent.gateway.enabled=${SM_AGENT_GATEWAY_ENABLED:false}
sm.agent.gateway.port=${SM_AGENT_GATEWAY_PORT:9443}
sm.agent.gateway.readiness-port=${SM_AGENT_GATEWAY_READINESS_PORT:9444}
sm.agent.gateway.certificate-file=${SM_AGENT_GATEWAY_CERT:}
sm.agent.gateway.private-key-file=${SM_AGENT_GATEWAY_KEY:}
sm.agent.gateway.trust-bundle-file=${SM_AGENT_GATEWAY_TRUST:}
sm.agent.gateway.drain-window=${SM_AGENT_GATEWAY_DRAIN_WINDOW:30s}
# Plan 015 T4.1 (OR-27, OR-128 (11)): at most this many LIVE placements on one agent's target; an agent-discovered container past it is
# refused agent.placement.cap (and audited). Read by dp-core's discovery intake.
sm.dp.agent.max-placements-per-target=${SM_DP_AGENT_MAX_PLACEMENTS_PER_TARGET:16}
# Plan 015 Final (OR-146 (2)): after SM restarts, the startup apply-recovery sweep waits up to this long, per in-flight request on an AGENT
# target, for that agent's session to be live again before resuming the request (it then ends APPLIED); without the session it lands
# APPLY_INDETERMINATE for the reconciler, as before. 30s is three times the longest measured reconnect (about 10s after a kill). 0s disables the
# wait. It never delays startup (its own thread) and never applies to dp-remote requests. Read by dp-core's ApplyWorkerProperties.
sm.dp.apply.worker.agent-session-grace=${SM_DP_APPLY_AGENT_SESSION_GRACE:30s}
# The address enrolled agents are told to connect to (host:port, as the agent will dial it).
sm.control.agent-gateway.ca.connect-endpoint=${SM_AGENT_GATEWAY_ENDPOINT:}
sm.control.agent-gateway.ca.key-store-file=${SM_AGENT_CA_KEYSTORE:}
sm.control.agent-gateway.ca.key-alias=${SM_AGENT_CA_KEY_ALIAS:}
sm.control.agent-gateway.ca.key-store-password=${SM_AGENT_CA_KEYSTORE_PASSWORD:}
sm.control.agent-gateway.ca.maximum-leaf-lifetime=${SM_AGENT_CA_LEAF_TTL:30d}
# Enrolment-token lifetime (OR-136 (1), plan 015 T3.5): the default an issuer gets when it names none, and the longest it may ask
# for. The control plane refuses to start when the default exceeds the maximum or either is not positive.
sm.control.agent-gateway.enrolment.token-default-validity=${SM_AGENT_ENROLMENT_TOKEN_DEFAULT_VALIDITY:24h}
sm.control.agent-gateway.enrolment.token-max-validity=${SM_AGENT_ENROLMENT_TOKEN_MAX_VALIDITY:30d}
# The two scheduled agent jobs (OR-140, plan 015 T4.6; both run under the system actor, V022). They replace the lazy forms that ran inside
# listTargets and getHealth. The sweep retires an interrupted enrolment once its token expired and sm.dp.declare.abandon-after (10m) has
# passed; the staleness job marks a silent agent's placements unreachable once sm.dp.agent.report-staleness (5m) has passed.
sm.gateway.agent-sweep.enabled=${SM_AGENT_SWEEP_ENABLED:true}
sm.gateway.agent-sweep.poll-interval=${SM_AGENT_SWEEP_INTERVAL:PT1M}
sm.dp.agent.staleness-job.enabled=${SM_AGENT_STALENESS_JOB_ENABLED:true}
sm.dp.agent.staleness-job.poll-interval=${SM_AGENT_STALENESS_JOB_INTERVAL:PT30S}
# Fail closed at boot: a composed listener verifies the CA keystore and the lease-nonce key entry at startup (AgentGatewayBootGuard
# refuses an overlay that sets this false while the listener is enabled).
sm.control.agent-gateway.ca.required=${sm.agent.gateway.enabled:false}
# The stop of the gateway drains its sessions (up to the drain window plus the shutdown grace) before the datasource closes; the
# container's stop grace period must exceed this (runtime/README.md, "The shutdown timeout contract").
spring.lifecycle.timeout-per-shutdown-phase=${SM_SHUTDOWN_TIMEOUT:60s}
