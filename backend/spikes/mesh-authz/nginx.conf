events {}
http {
  server {
    listen 9443 ssl;
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    location /mesh {
      proxy_pass http://solace:8008;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      # Task 5 MEASURED this, and Task 1's guess behind it was wrong. An idle SMF-over-ws
      # session exchanges keepalives every 3.0s (12 B client->broker, 20 B broker->client, read
      # off the broker's own per-client rx/txByteCount), matching solclientjs's
      # keepAliveIntervalInMsecs default of 3000 and keepAliveIntervalsLimit of 3. Keepalives
      # are NOT "minutes apart", so nginx's own 60s default would never have killed an idle
      # session: verified by running one idle for 60s with proxy_read_timeout 10s.
      # The generous value is kept for headroom a NODE client cannot exercise: a browser
      # throttles timers in a backgrounded tab, so a real console's keepalives may stretch far
      # past 3s. That headroom is a judgement, not a measurement — the measured floor is ~10s.
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }
}
