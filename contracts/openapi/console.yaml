openapi: 3.1.0

# The authenticated console surface — the normative contract between the
# frontend and the backend.
#
# Authority: docs/design/common/contracts/console-integration.md §5 maps every
# as-built operation to its permission and resource scope; this document is the
# machine-readable half of that map for the subset plans 006/007 build.
#
# Two rules bind every operation below, and check 11 enforces both:
#   1. `x-sm-permission` names a verb from the ratified 38-member catalog
#      (docs/design/D10-G2-APPROVAL-2026-09-15.md §1.1 + §1.7), or one of the
#      three declared non-catalog values. An operation needing an unapproved
#      verb MUST NOT appear here: it answers 501, never 403 (§5.6 rule 5).
#   2. `x-sm-scope` names a level of the FIVE-level grant hierarchy
#      (ruling OR-16), or `self` / `derived` / `install`. ⛔ `placement` is NOT
#      a grant level — a placement-targeted operation authorizes through its
#      owning instance.
#      `named` (plan 013 T1.4) is the scope the request's SUBJECT names: a
#      body field (`ownershipScope`) for scanHostKeys / registerTarget, or the
#      stored resource's own scope, resolved server-side, for the operations on
#      one target. Never client-supplied authority: the organization is the
#      session's (`I5`), and a node outside it is 404.

info:
  title: Solution Manager — console API
  version: 0.1.0
  description: |
    The authenticated surface. Not yet implemented: see
    `contracts/openapi/ENDPOINT-INVENTORY.md` for what exists, what is planned
    and what answers 501.

    **Every response that carries server state carries `stateVersion`.** It is
    the only ordering signal (`BE-D4`); clients refetch when a mesh notice
    reports a higher one, and compare nothing else. Timestamps are not ordering.

    **REST is authoritative** (`BE-D1`, ruling `OR-3`). Events are refetch
    notices and never become state. Polling is a declared degraded mode, not
    the architecture.

servers:
  - url: /api
    description: Same-origin. The browser learns this from `/config.json`'s `apiBasePath`.

tags:
  - name: auth
    description: Session lifecycle. Cookie-based, durable and revocable, CSRF-protected.
  - name: home
    description: Cross-solution overview, filtered to the caller's own scopes (ruling `OR-45`).
  - name: hierarchy
    description: The scope tree the caller can see, pruned to their bindings, and its writes (create, rename).
  - name: entitlements
    description: The solutions an organization may declare instances of, and how many (`OR-48`, changed by `OR-121`).
  - name: admin
    description: Local users and role assignments of the session's organization (`REQ-006`, plan 013 T3.2).
  - name: catalog
    description: Solutions and packages.
  - name: targets
    description: Deployment targets.
  - name: connections
    description: |
      Connection config objects (Solace broker / remote server, D-4) — the cp/dp split of `BE-D66`.
      Never a deployment-trust anchor: no host-key pinning or scanning, unlike `targets`.
  - name: agents
    description: Host agents - enrolment tokens, the agents' state, revocation and drain (plan 015 T4.3, D10 §1.11 rows 48-51; 44-47 before the OR-147 reconciliation).
  - name: instances
    description: Instance inventory and lifecycle.
  - name: designer
    description: Configuration authoring, staging and history.
  - name: apply
    description: The apply path — submission, observation, rollback, stop.
  - name: fleet
    description: Fleet apply — one submit across several instances, own journal per member (`REQ-013`).
  - name: governance
    description: Health, the configuration ladder and logs.
  - name: monitoring
    description: |
      Metrics queries, export and per-instance dashboards (`/api/console/v1`, plan 011, rows 53-66 of
      `console-integration.md` §5.4). Served by plan 011 P11-7.2 (`ENDPOINT-INVENTORY.md` §1).

security:
  - sessionCookie: []

paths:

  # ── auth ──────────────────────────────────────────────────────────────────

  /cp/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Establish a session
      description: |
        Establishes the session, so it requires no verb. A login is
        `(organization, username, credential)` (`OR-125` (4)): a username is unique
        *per organization*, so two organizations may each have an `operator`.
        `organization` is the organization's id (a UUID) or its name, compared
        without regard to case, taken as typed (surrounding whitespace is a `400`,
        never trimmed). The username is compared without regard to case too; the
        case folding is PostgreSQL's `lower()` under the database's locale, so a
        database created with the `C`/`POSIX` locale folds ASCII letters only (a
        UTF-8 locale is required for non-ASCII folding: `docs/runbooks/install-prerequisites.md`).

        **`organization` is OPTIONAL** (`OR-131` Q3). Omitted, it is the install's
        only organization when the install holds exactly one; when it holds several
        an omitted `organization` is `400 BAD_REQUEST` (the owner accepted that
        this reveals that more than one exists), raised before any credential work.
        ⚠️ An organization that is NAMED and does not exist is refused
        **exactly as a wrong credential is** (`401 AUTHENTICATION_FAILED`, the same
        body, the same work, including the same number of database statements, the
        same throttle and audit record), so a login cannot be used to learn which
        organizations exist. An `organization` that is present but empty, over 256 characters or
        padded with whitespace is a malformed request (`400`), which says nothing
        about any organization.
        Throttled and
        lockout-protected — a lockout surfaces as `401 AUTHENTICATION_FAILED`,
        never as a distinguishable `429`. On success the response sets the session cookie and
        returns the CSRF token the client must echo on every mutation.

        ⚠️ **No CSRF token is required** — none can exist before a session
        does, and requiring one would make first login impossible. Login is
        protected instead by `Origin`/`Referer` validation against
        `sm.gateway.trusted-origins`, `SameSite=Strict` cookies, and the durable
        login throttle.

        **Cookies set on success** (ruling `OR-21`): `__Host-SM_SESSION`
        (`HttpOnly`) and `__Host-SM_CSRF` (script-readable, bound to that
        session) — both `Path=/`, `SameSite=Strict`, **always** `Secure`, and
        never a `Domain`, so a sibling domain cannot plant either. Plain-HTTP
        deployment is not supported (`http://localhost` works in current
        browsers).
        The CSRF value is also returned as `csrfToken`.

        ⚠️ **Lockout** (rulings `OR-20`, `OR-23`, `OR-24`): a locked **client
        address** is refused `401`. A locked **username** does NOT refuse a
        correct credential from an unlocked address — other people's failures
        can never lock the credential holder out — and a successful login clears
        the username counter. Before any of this, a per-address pre-auth rate
        gate answers `429 RATE_LIMITED` without doing any credential work. An operator clears a lockout with the audited
        recovery command. ⛔ Behind a reverse proxy, `sm.gateway.trusted-proxies`
        MUST list it, or every user would share the proxy's address — the
        gateway refuses to start until the operator either lists trusted proxies
        or sets `sm.gateway.direct-client-connections=true`.

        ⚠️ A principal whose `mustRotate` is set receives a session that
        authorizes **only** `/cp/auth/identity`, `/cp/auth/logout` and
        `/cp/auth/credential` until the credential is rotated. The returned
        identity's `organizations` is empty in that state (ruling `OR-116`).
      security: []
      x-sm-permission: none.establishesSession
      x-sm-scope: self
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, credential]
              properties:
                organization: { type: string, minLength: 1, maxLength: 256 }
                username: { type: string, minLength: 1, maxLength: 256 }
                credential: { type: string, minLength: 1, format: password }
      responses:
        '200':
          description: Session established.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Identity' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/LoginRefused' }
        '403':
          description: "`ORIGIN_REJECTED` — `Origin`/`Referer` is absent or not trusted."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '429':
          description: "`RATE_LIMITED` — the pre-authentication rate gate for this client address is exhausted. Carries `Retry-After`."
          headers:
            Retry-After:
              schema: { type: integer, minimum: 1 }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /cp/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the current session
      description: Authentication only. Available while `mustRotate` is set.
      x-sm-permission: none.authenticationOnly
      x-sm-scope: self
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      responses:
        '204':
          description: |
            Session revoked, and both cookies expired. ⚠️ Revocation is
            idempotent server-side, but the endpoint is not: a repeated logout
            carries a revoked cookie and is therefore `401 UNAUTHENTICATED`.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfRejected' }

  /cp/auth/identity:
    get:
      tags: [auth]
      operationId: getIdentity
      summary: The current principal and its effective permissions
      description: |
        ⚠️ **Authentication only — no verb** (ruling `OR-15`). Requiring
        `authz.introspect.self` here would make a role created without it
        render an empty permission overlay for a principal who can nonetheless
        act. `authz.introspect.any` still guards reading *another* principal.

        The response also carries `organizations` (ruling `OR-116`): the
        organizations and sub-organizations the caller can see, by exactly the
        rule `listOrganizations` / `listSubOrganizations` apply. It is empty
        while `mustRotate` is true — those lists answer `428` until rotation.
      x-sm-permission: none.authenticationOnly
      x-sm-scope: self
      responses:
        '200':
          description: The caller's identity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Identity' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /cp/auth/credential:
    post:
      tags: [auth]
      operationId: rotateOwnCredential
      summary: Rotate the caller's own credential
      description: |
        ⛔ **Not a catalog verb.** `LocalOperation.ROTATE_OWN_CREDENTIAL` is
        cp-core-local: the catalog has 38 members and none of them is this.
        Verifies the current credential, and clears `mustRotate` on success.

        ⚠️ **v1 scope: forced rotation only.** The operation succeeds only
        while the caller's `mustRotate` is set (the bootstrap administrator,
        or a principal an administrator has flagged). An ordinary self-service
        password change is **not** in v1 and answers
        `400 CREDENTIAL_ROTATION_REFUSED` — the same code as a wrong current
        credential, deliberately, so the response does not reveal which.

        **Throttled.** Wrong current credentials are counted per principal in
        the durable login throttle; once locked, even a correct current
        credential is refused until the lockout expires.
      x-sm-permission: local.rotateOwnCredential
      x-sm-scope: self
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentCredential, newCredential]
              properties:
                currentCredential: { type: string, format: password }
                newCredential: { type: string, format: password, minLength: 12 }
      responses:
        '204': { description: Rotated. `mustRotate` is cleared and every other session for this principal is revoked. }
        '400':
          description: |
            `BAD_REQUEST` (malformed body, `newCredential` shorter than 12) or
            `CREDENTIAL_ROTATION_REFUSED` (wrong current credential, replacement
            equal to the current one, principal not in forced rotation, or
            rotation locked out) — switch on `code`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfRejected' }
        '429':
          description: "`RATE_LIMITED` — the pre-authentication rate gate for this client address is exhausted. Carries `Retry-After`."
          headers:
            Retry-After:
              schema: { type: integer, minimum: 1 }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ── home ──────────────────────────────────────────────────────────────────

  /cp/home/summary:
    get:
      tags: [home]
      operationId: getHomeSummary
      summary: Cross-solution summary, filtered to the caller's scopes
      description: |
        Contracted by ruling `OR-45` and served (one of the five plan-007 operations that
        console-integration.md §5.2 row 4 had left uncontracted). Requires BOTH verbs —
        the summary counts solutions the caller may see and instances within them.

        ⚠️ **`x-sm-scope: reach`** (ruling `OR-51`, `OR-55`): `solution.view` held at ≥ 1 grant
        anywhere in the caller's organization (else `403`) — never `organization`, which would
        `403` an environment-bound Operator before any filtering. **A catalog solution row carries
        no scope path of its own** (`listSolutions`, this file's own line ~355-357): it spans every
        instance under it, so "filtered at the row's own scope" has no defined meaning. Corrected
        (round-3 review, MAJOR): `instanceCount` is counted over that solution's **instances**,
        filtered *per instance* by `instance.view` at each instance's own scope path — the same
        downward-reach filter `listInstances` (point 9) uses. `byHealth` counts only among those
        same instances where `health.view` is *also* held at that instance's own scope path
        (Q-C1(b)). This reading of Q-C1(b) is recorded in
        [`ENDPOINT-INVENTORY.md`](ENDPOINT-INVENTORY.md) §7 and ruled by `OR-61`.
      x-sm-permission: solution.view
      x-sm-permission-also: [instance.view]
      x-sm-scope: reach
      responses:
        '200':
          description: Solution and instance counts, filtered to what the caller can see.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HomeSummary' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /cp/home/attention:
    get:
      tags: [home]
      operationId: getHomeAttention
      summary: Instances needing attention, filtered to the caller's scopes
      description: |
        Contracted by ruling `OR-45` (console-integration.md §5.2 row 5) and served.
        Requires BOTH verbs — health state is not shown for an instance the caller
        cannot also view.

        ⚠️ **`x-sm-scope: reach`** (ruling `OR-51`, `OR-55`): `health.view` held at ≥ 1 grant
        anywhere in the caller's organization (else `403`), then each item filtered by the verb
        that guards its `reason` — `health.view` for `health`, `config.view` for
        `apply-indeterminate`/`config-diverged` — at that item's own scope.
      x-sm-permission: health.view
      x-sm-permission-also: [instance.view]
      x-sm-scope: reach
      responses:
        '200':
          description: Items needing attention (health, apply-indeterminate, config-diverged), each filtered per reason at the item's own scope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HomeAttention' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ── hierarchy ─────────────────────────────────────────────────────────────

  /cp/hierarchy/organizations:
    get:
      tags: [hierarchy]
      operationId: listOrganizations
      summary: The organizations the caller can see
      description: Authentication only; the result is derived from the caller's bindings.
      x-sm-permission: none.authenticationOnly
      x-sm-scope: derived
      responses:
        '200':
          description: Visible organizations.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScopeNodeList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /cp/hierarchy/organizations/{organizationId}:
    parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
    patch:
      tags: [hierarchy]
      operationId: renameOrganization
      summary: Rename the session's organization
      description: |
        Plan 013 T2.3 (D-REG 5.3 H3; `OQ-5` (a): organizations are renamed, never created, in v1). **Install scope only**
        (`OR-125` (3)): `hierarchy.edit` is evaluated at INSTALL scope, like `setEntitlement`, so an organization-bound
        Administrator is refused `403` (`FORBIDDEN`) and cannot rename its organization. The refusal is a verdict on the
        caller's grant, decided before the path id is read: it is the same for the caller's own organization, another
        organization and one that does not exist, so it tells the caller nothing about any organization (`I5`). An
        install-bound caller whose path organization is not its own tenant's gets `404`, whether or not that organization
        exists. A rename to the organization's own name writes nothing and answers `200`; a rename that changes only the
        case is allowed (the node does not clash with itself).

        Organization names are unique across the whole install, compared case-insensitively (`OR-123`; `V015`'s
        `organization_name_ci_uq`), so the `409` is **install-wide, not a sibling clash**. Because only an install-bound
        principal can reach it, that `409` is no cross-tenant existence oracle (it was one while an organization-bound
        Administrator could rename; plan 013 W2D-2, resolved by `OR-125` (3)).

        A path id that is not a UUID is `404`, before authorization, for every caller (as on the other hierarchy writes).

        **Consequence (plan 013 `W5C-2`, ruled `OR-131`):** the only way to rename an organization
        over HTTP is an install-bound principal naming its own organization. No API creates an install-bound binding
        (the assignment service refuses a scope shallower than organization) and the only install-bound principal is the
        bootstrap administrator, who belongs to one organization; so in an install with several organizations the others cannot
        be renamed over HTTP. **Other organizations are renamed by the operator command** (`OR-131`:
        `OrganizationRenameMain`, runbook "Rename an organization (operator command)"), an audited command on the host with the
        same name rules and the same case-insensitive install-wide uniqueness. This is the same limit `setEntitlement` has.
      x-sm-permission: hierarchy.edit
      x-sm-scope: install
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NodeNameRequest' }
      responses:
        '200':
          description: Renamed (or already had exactly this name). The body carries the stored name.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScopeNode' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundOrUnauthorized' }
        '409':
          description: |
            `CONFLICT` — another organization of this install already has this name, compared without regard to
            case (`OR-123`). Not a sibling clash: names are unique install-wide. Reachable only by an install-bound
            principal (`OR-125` (3)), so it discloses nothing across a tenant boundary. The response never echoes the
            requested name.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /cp/hierarchy/organizations/{organizationId}/sub-orgs:
    parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
    get:
      tags: [hierarchy]
      operationId: listSubOrganizations
      summary: Sub-organizations of one organization
      x-sm-permission: none.authenticationOnly
      x-sm-scope: derived
      responses:
        '200':
          description: Visible sub-organizations.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScopeNodeList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFoundOrUnauthorized' }
    post:
      tags: [hierarchy]
      operationId: createSubOrganization
      summary: Create a sub-organization (top-level only)
      description: |
        Plan 013 T2.3 (D-REG 5.3 H1). `hierarchy.edit` at the PARENT (the organization). Sub-organizations are top-level
        only (`SM-D32`/`OR-16` fix the depth). No `scope` row is inserted: scope rows are minted when first used. The
        path organization is an address checked against the session, never authority (`I5`): any other id is `404`.

        **Names are unique among siblings, compared case-insensitively, and the comparison is the database's, never the
        server's** (`OR-123`; `V015`'s `organization_unit_name_ci_uq`). `201` a new node; `200` the identical replay, which
        is the EXACT name (byte for byte, after surrounding whitespace is stripped) that already exists under this
        parent, and writes nothing; `409 CONFLICT` a sibling whose name differs from the request only in case (`Platform`
        when `platform` exists), which is a different request and not a replay.
      x-sm-permission: hierarchy.edit
      x-sm-scope: organization
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NodeNameRequest' }
      responses:
        '200':
          description: The identical replay (the exact name already exists under this parent). Nothing was written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScopeNode' }
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScopeNode' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundOrUnauthorized' }
        '409':
          description: |
            `CONFLICT` — a sibling sub-organization already has a name that differs from this one only in case
            (`OR-123`). The exact same name is the `200` replay, never this. The response never echoes the name.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /cp/hierarchy/organizations/{organizationId}/sub-orgs/{subOrganizationId}:
    parameters:
      - { $ref: '#/components/parameters/OrganizationId' }
      - { $ref: '#/components/parameters/SubOrganizationId' }
    patch:
      tags: [hierarchy]
      operationId: renameSubOrganization
      summary: Rename a sub-organization
      description: |
        Plan 013 T2.3 (D-REG 5.3 H4). `hierarchy.edit` at the node. A rename to the node's own name writes nothing and
        answers `200`; a rename that changes only the case is allowed. `409 CONFLICT` when a sibling already has the name,
        compared without regard to case (`OR-123`; the database's comparison, never the server's).
      x-sm-permission: hierarchy.edit
      x-sm-scope: sub-organization
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NodeNameRequest' }
      responses:
        '200':
          description: Renamed (or already had exactly this name). The body carries the stored name.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScopeNode' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundOrUnauthorized' }
        '409':
          description: |
            `CONFLICT` — a sibling sub-organization of the same organization already has this name, compared without
            regard to case (`OR-123`). The response never echoes the name. **The clash is checked against every sibling,
            including siblings the caller cannot see** (the caller's `hierarchy.edit` is at this node, not at the
            parent), so a `409` tells a caller bound at this node that some sibling it may not be able to list has the
            name. This disclosure is inside one organization and is **accepted** (`OR-125` (3), plan 013 W4D-1): a
            principal bound below the organization already belongs to it. Only an organization rename crosses a tenant
            boundary, and that is install-scoped.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /cp/hierarchy/organizations/{organizationId}/sub-orgs/{subOrganizationId}/environments:
    parameters:
      - { $ref: '#/components/parameters/OrganizationId' }
      - { $ref: '#/components/parameters/SubOrganizationId' }
    get:
      tags: [hierarchy]
      operationId: listEnvironments
      summary: Environments of one sub-organization
      x-sm-permission: none.authenticationOnly
      x-sm-scope: derived
      responses:
        '200':
          description: Visible environments.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScopeNodeList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFoundOrUnauthorized' }
    post:
      tags: [hierarchy]
      operationId: createEnvironment
      summary: Create an environment in a sub-organization
      description: |
        Plan 013 T2.3 (D-REG 5.3 H2). `hierarchy.edit` at the PARENT sub-organization, within the session's organization
        (any other path organization is `404`, `I5`). A new environment can be a target's `ownershipScope` at once; no
        `scope` row is inserted until it is first used.

        **Names are unique among the siblings of one sub-organization, compared case-insensitively, and the comparison is
        the database's, never the server's** (`OR-123`; `V015`'s `environment_name_ci_uq`). `201` a new node; `200` the
        identical replay, which is the EXACT name (byte for byte, after surrounding whitespace is stripped) that already
        exists under this parent, and writes nothing; `409 CONFLICT` a sibling whose name differs from the request only
        in case, which is a different request and not a replay. The same name under two different sub-organizations is
        not a clash.
      x-sm-permission: hierarchy.edit
      x-sm-scope: sub-organization
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NodeNameRequest' }
      responses:
        '200':
          description: The identical replay (the exact name already exists under this parent). Nothing was written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScopeNode' }
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScopeNode' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundOrUnauthorized' }
        '409':
          description: |
            `CONFLICT` — a sibling environment of this sub-organization already has a name that differs from this one
            only in case (`OR-123`). The exact same name is the `200` replay, never this. The response never echoes the name.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /cp/hierarchy/organizations/{organizationId}/sub-orgs/{subOrganizationId}/environments/{environmentId}:
    parameters:
      - { $ref: '#/components/parameters/OrganizationId' }
      - { $ref: '#/components/parameters/SubOrganizationId' }
      - { $ref: '#/components/parameters/EnvironmentId' }
    patch:
      tags: [hierarchy]
      operationId: renameEnvironment
      summary: Rename an environment
      description: |
        Plan 013 T2.3 (D-REG 5.3 H5). `hierarchy.edit` at the node. A rename to the node's own name writes nothing and
        answers `200`; a rename that changes only the case is allowed. `409 CONFLICT` when a sibling already has the name,
        compared without regard to case (`OR-123`; the database's comparison, never the server's).
      x-sm-permission: hierarchy.edit
      x-sm-scope: environment
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NodeNameRequest' }
      responses:
        '200':
          description: Renamed (or already had exactly this name). The body carries the stored name.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScopeNode' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundOrUnauthorized' }
        '409':
          description: |
            `CONFLICT` — a sibling environment of the same sub-organization already has this name, compared without
            regard to case (`OR-123`). The response never echoes the name. **The clash is checked against every sibling,
            including siblings the caller cannot see** (the caller's `hierarchy.edit` is at this node, not at the
            parent), so a `409` tells a caller bound at this node that some sibling it may not be able to list has the
            name. This disclosure is inside one organization and is **accepted** (`OR-125` (3), plan 013 W4D-1): a
            principal bound below the organization already belongs to it. Only an organization rename crosses a tenant
            boundary, and that is install-scoped.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ── entitlements ──────────────────────────────────────────────────────────

  /cp/entitlements:
    get:
      tags: [entitlements]
      operationId: listEntitlements
      summary: The session's organization's entitlements, with how many instances are declared
      description: |
        Plan 013 T2.3 (D-REG 5.2 E1). `declaredInstances` counts the instances not retired by undeclare (plan 012 T4's
        `countInstances`; an abandoned declare counts until it is retired). The organization is the session's: there is no
        way to ask for another's (`I5`).
      x-sm-permission: solution.view
      x-sm-scope: organization
      responses:
        '200':
          description: One item per entitled solution, ordered by solution name.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntitlementList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /cp/entitlements/{solution}:
    parameters:
      - name: solution
        in: path
        required: true
        description: The solution name (`cache`, `file-mesh`, ...), in the catalog's grammar (`catalog_solution_name`).
        schema: { type: string, pattern: '^[a-z][a-z0-9-]{0,63}$' }
    put:
      tags: [entitlements]
      operationId: setEntitlement
      summary: Set how many instances of a solution the organization may declare
      description: |
        Plan 013 T2.3 (D-REG 5.2 E2; `OQ-4` (a); `OR-121` changes `OR-48`'s "operator command only"). `entitlement.set` is
        evaluated at INSTALL scope on the session's own organization: an organization-bound Administrator is refused
        (`403`) and cannot raise its own limit. No request field or path segment names an organization (`I5`).
        `409 ENTITLEMENT_REFUSED` when `maxInstances` is below the number of declared (not retired) instances; lowering
        below use is refused, never silently accepted. Idempotent: the same limit again answers `200` and changes nothing
        (no second audit row). There is no delete: an entitlement is lowered, never removed. The operator command
        `EntitlementMain` remains.
      x-sm-permission: entitlement.set
      x-sm-scope: install
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetEntitlementRequest' }
      responses:
        '200':
          description: The entitlement as it now stands.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entitlement' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundOrUnauthorized' }
        '409':
          description: "`ENTITLEMENT_REFUSED` — `maxInstances` is below the number of declared instances."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ── admin: local users and role assignments (plan 013 T3.2; OR-121, OR-125) ──────────

  /cp/admin/users:
    get:
      tags: [admin]
      operationId: listUsers
      summary: Users of the session's organization
      description: |
        Plan 013 T3.2 (D-REG 5.4 U1). Evaluated at the ORGANIZATION (the code: `ResourceKind.PRINCIPAL`; `OR-125` (6)
        confirms it as built), where `console-integration.md` §5.2 row 21 says `install ↓`. Never carries a credential or a
        credential hash. Ordered by username (byte-wise), then id.
      x-sm-permission: user.view
      x-sm-scope: organization
      responses:
        '200':
          description: The users.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin]
      operationId: createUser
      summary: Create a local user in the session's organization
      description: |
        Plan 013 T3.2 (D-REG 5.4 U2). The user is `local`, `must_rotate = true`: the initial credential is provisional
        and the first sign-in is refused until it is rotated. A username is unique **per organization**, compared
        without regard to case (`OR-125` (4)): `409 CONFLICT` means a user of THIS organization already has it. Another
        organization's user of the same name is no conflict and is never revealed - there is no install-wide namespace to
        probe. The user signs in with `(organization, username, credential)`; see `login`.
        `initialCredential` is write-only, hashed with Argon2id (`OR-7`) and never stored or returned; the 12-character
        floor of `rotateOwnCredential` applies. Subject to the transport rule (`INSECURE_TRANSPORT`).
      x-sm-permission: user.create
      x-sm-scope: organization
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: "`FORBIDDEN`, `CSRF_REJECTED`, `ORIGIN_REJECTED` or `INSECURE_TRANSPORT` — switch on `code`."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: "`CONFLICT` — a user of this organization already has the username (compared without regard to case)."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /cp/admin/users/{userId}/credential:
    parameters: [{ $ref: '#/components/parameters/UserId' }]
    put:
      tags: [admin]
      operationId: resetUserCredential
      summary: Reset another user's credential
      description: |
        Plan 013 T3.2 (D-REG 5.4 U3, second half). Sets a new provisional credential and `must_rotate`; the user's
        live sessions end. `409 CONFLICT` for the caller itself and for any principal holding an Administrator binding.
        `resetCredential` is write-only and never stored or returned. Subject to the transport rule (`INSECURE_TRANSPORT`).
      x-sm-permission: user.edit
      x-sm-scope: organization
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resetCredential]
              properties:
                resetCredential: { type: string, format: password, writeOnly: true, minLength: 12, maxLength: 1024 }
              additionalProperties: false
      responses:
        '200':
          description: Reset.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: "`FORBIDDEN`, `CSRF_REJECTED`, `ORIGIN_REJECTED` or `INSECURE_TRANSPORT` — switch on `code`."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404': { $ref: '#/components/responses/NotFoundOrUnauthorized' }
        '409':
          description: "`CONFLICT` — the caller itself, or a principal holding an Administrator binding."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /cp/admin/roles:
    get:
      tags: [admin]
      operationId: listRoles
      summary: The built-in roles and the verbs each holds
      description: Plan 013 T3.2 (D-REG 5.4 U4). v1 has the three built-in roles only (custom roles need a later migration).
      x-sm-permission: role.view
      x-sm-scope: organization
      responses:
        '200':
          description: The roles.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /cp/admin/assignments:
    get:
      tags: [admin]
      operationId: listAssignments
      summary: Role assignments, filtered by what the caller may see
      description: Plan 013 T3.2 (D-REG 5.4 U5). `role.view` at the organization; each item is returned only where the caller's reach covers its scope.
      x-sm-permission: role.view
      x-sm-scope: organization
      parameters:
        - name: principalId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The assignments.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssignmentList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin]
      operationId: grantAssignment
      summary: Grant a role to a user at a scope
      description: |
        Plan 013 T3.2 (D-REG 5.4 U6; OQ-6 (a)). `role.assign` must be held AT THE GRANTED SCOPE (else a unit
        administrator would escalate to the organization), the scope canonicalized server-side. Granting the
        Administrator role is refused `422` (`OR-12`: bootstrap and emergency only). `201` new; `200` a replay.
      x-sm-permission: role.assign
      x-sm-scope: named
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrantAssignmentRequest' }
      responses:
        '200':
          description: An identical replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Assignment' }
        '201':
          description: Granted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Assignment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundOrUnauthorized' }
        '409':
          description: "`CONFLICT` — the user is deactivated (a deactivated user is never reactivated, so a binding to it would be inert)."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: "`VALIDATION_FAILED` — including a request for the Administrator role."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /cp/admin/assignments/{assignmentId}:
    parameters:
      - name: assignmentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [admin]
      operationId: revokeAssignment
      summary: Revoke a role assignment
      description: |
        Plan 013 T3.2 (D-REG 5.4 U7; OQ-6 (a)). `role.assign` at the assignment's own scope. An Administrator binding is
        never revoked over the API (`409 CONFLICT`), whoever holds it; this mirrors the grant. The revoked user's live
        sessions are re-evaluated on their next request.
      x-sm-permission: role.assign
      x-sm-scope: named
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      responses:
        '204': { description: Revoked. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundOrUnauthorized' }
        '409':
          description: "`CONFLICT` — the assignment is an Administrator binding."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # Deactivation is the LAST admin path on purpose: the generated Postman folder runs in document order, and a user that has
  # been deactivated can no longer be granted a role or have its credential reset (409), so the run ends by deactivating the
  # user it created.
  /cp/admin/users/{userId}/deactivate:
    parameters: [{ $ref: '#/components/parameters/UserId' }]
    post:
      tags: [admin]
      operationId: deactivateUser
      summary: Deactivate a local user
      description: |
        Plan 013 T3.2 (D-REG 5.4 U3, first half; see the split noted at the top of this draft). Ends the user's live
        sessions in the same transaction. Reactivation is not offered. `409 CONFLICT` for the caller itself and for any
        principal holding an Administrator binding (`OR-12`: Administrator standing is made and unmade only outside the
        API, so one administrator cannot lock out another). Deactivating a deactivated user is `200`.
      x-sm-permission: user.deactivate
      x-sm-scope: organization
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      responses:
        '200':
          description: Deactivated (or already).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundOrUnauthorized' }
        '409':
          description: "`CONFLICT` — the caller itself, or a principal holding an Administrator binding."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ── catalog ───────────────────────────────────────────────────────────────

  /cp/solutions:
    get:
      tags: [catalog]
      operationId: listSolutions
      summary: Solutions visible to the caller
      description: |
        ⚠️ **`x-sm-scope: reach`** (owner ruling 2026-09-29 (S0-24), `OR-51`): `solution.view` held
        at ≥ 1 grant anywhere in the caller's organization (else `403`), with **no per-item
        filter** — catalog rows carry no scope path of their own to filter by. S0-24's per-item
        filter applies to `listInstances`, `listTargets`, both home reads and both fleet
        operations (`submitFleetApply`, `observeFleetApply`); `listSolutions` is `reach`'s one
        organization-membership-only case.
      x-sm-permission: solution.view
      x-sm-scope: reach
      responses:
        '200':
          description: >-
            Solutions visible to the caller's organization — no per-item filter (see above).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SolutionList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /cp/solutions/load:
    post:
      tags: [catalog]
      operationId: loadPackage
      summary: Load a solution package
      description: |
        ⚠️ **Organization-scoped** (ruling `OR-14`), not install-scoped. A
        multi-organization install must not need an install-wide grant to load
        a package. High-consequence and audited.

        ⛔ **No `organizationId` in the body** (`I5`; Step 1 check (v)). The tenant is
        `Session.organizationId()`, never a request field — `ResourceResolver` never reads the
        body, so a body naming another organization could never have been honoured, silently or
        otherwise.

        A first load of a solution the organization holds no entitlement for **entitles it** (`OR-148`):
        the same transaction creates the entitlement with the configured default limit
        (`sm.cp.entitlement.on-first-load.max-instances`, default 10) and audits it as `ENTITLEMENT_SET`
        with the loading principal as actor. An existing entitlement is never changed by a load. With
        `sm.cp.entitlement.on-first-load.enabled=false` the old `409 ENTITLEMENT_REFUSED` returns.
      x-sm-permission: package.load
      x-sm-scope: organization
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [package]
              properties:
                package:
                  description: A Solution Package conforming to contracts/solution-package.schema.json.
                  type: object
                  additionalProperties: true
              additionalProperties: false
      responses:
        '200':
          description: >-
            The identical package (same solution, same `packageVersion`, same canonical digest) was already loaded in
            this organization. Nothing was written, audited or published; the body is the existing registration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoadPackageResult' }
        '201':
          description: Registered. The catalog row's own id, not the package's declared `solution`/`packageVersion`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoadPackageResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: "`ENTITLEMENT_REFUSED` — not entitled, or the organization's package quota is exhausted."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: "`VALIDATION_FAILED` — the package failed a load-time gate. The body names the gate."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /cp/solutions/{solutionId}/package:
    get:
      tags: [catalog]
      operationId: getSolutionPackage
      summary: The raw solution package document, as loaded
      description: |
        D-4 (`docs/plans/integration/README.md`'s "needs one consolidated design session" item
        2): the only source for the RAW package document a browser needs to run `project()`
        locally (`FE-D33`) — `getDesigner`'s own response carries only the server's already-
        projected `viewModel`, never the raw package (`OR-34`). Also unblocks the Solutions
        screen's package preview (plan 005).

        ⚠️ **`x-sm-scope: reach`, like `listSolutions`, not `organization` like `loadPackage`**:
        this is a READ of a catalog entry, which carries no scope path of its own
        (`listSolutions`' own note) — the same reason `listSolutions` is `reach` rather than
        `organization`. An environment-bound Operator viewing their own instance's Designer must
        be able to call this; scoping it to `organization` (as the write path `loadPackage`
        correctly is, per `OR-14`) would 403 exactly the caller who needs it most. `solution.view`
        held at ≥ 1 grant anywhere in the caller's organization (else `403`); within the
        organization, `{solutionId}` is checked by `SolutionCatalog`'s own org-bound query (`I5`) —
        a foreign or unknown id is `404` (deliberately indistinguishable from "exists but out of
        your scope").

        `packageVersion` (query, optional): one member of the entry's `packageVersion` array, as
        canonical JSON text (`7` or `"v2"` — `PackageVersionId`'s own two shapes, quoted for a
        string). Omitted picks the entry's `latestPackageVersion`. `404` when no loaded package of
        this entry serves the requested (or, if omitted, the latest) version — the entry having no
        package at all and the version not matching are not distinguished.

        ⛔ Read-only: reuses `solution.view`, never `package.load` (`package.load` is the
        HIGH-consequence write verb for registering a new package; reading one back is the same
        consequence class as `listSolutions`).
      x-sm-permission: solution.view
      x-sm-scope: reach
      parameters:
        - name: solutionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: packageVersion
          in: query
          required: false
          description: Canonical JSON text of a `PackageVersionId` (`7`, `"v2"`). Omitted = latest.
          schema: { type: string }
      responses:
        '200':
          description: The document, as loaded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SolutionPackageDocument' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundOrUnauthorized' }

  # ── targets ───────────────────────────────────────────────────────────────

  /cp/targets:
    get:
      tags: [targets]
      operationId: listTargets
      summary: Deployment targets visible to the caller
      description: |
        ⚠️ Targets are **not** in the ownership tree (`SM-D23`); each carries
        its own `ownershipScope` path.

        ⚠️ **`x-sm-scope: reach`** (ruling `OR-56`): `target.view` held at ≥ 1 grant anywhere in
        the caller's organization (else `403`), then items filtered by `target.view` at each
        target's own `ownershipScope` — the downward rule is kept: a shared VM is registered at
        the environment that uses it, and an organization-owned target needs organization-level
        `target.use`.

        **Agent targets** (plan 015 T3.5) are listed with `transport: agent`. One whose enrolment stopped between the control plane's write and the data plane's has no envelope and is listed degraded, like any target without a connection record; if its agent never retries, the scheduled enrolment sweep (`OR-140`; `sm.gateway.agent-sweep.poll-interval`, one minute by default) retires it once its token's lifetime and `sm.dp.declare.abandon-after` have passed. Listing never runs the sweep.
      x-sm-permission: target.view
      x-sm-scope: reach
      responses:
        '200':
          description: Targets.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TargetList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [targets]
      operationId: registerTarget
      summary: Register a deployment target with its connection record and SSH key
      description: |
        Plan 013 T1.4 (D-REG 5.1 T2, 8; `BE-D54`). ONE call composes both planes, in this order: authorize
        `target.create` at `ownershipScope` (writes nothing); every data-plane pre-check read-only (grammar, the key must
        open as an UNENCRYPTED private key, the address policy, a fresh scan that must offer `hostKeyFingerprint`, and
        no other live target of the organization holding any offered host key); then the control-plane row; then the
        data-plane record with the sealed key. A refusal at any pre-check leaves NOTHING in either plane (target,
        secret, event) except the scan's audit row. The pre-check's scan is a scan: it draws on the SAME per-session
        budget as `scanHostKeys` (default 10 a minute, `429 RATE_LIMITED`, `Retry-After`) and is recorded in the audit
        log the same way (verb, scope, outcome; never the host or the keys); a refusal before any host is contacted
        (the key does not open, a field fails its grammar) is not a scan and is not recorded.
        `201` new; `200` an identical replay (the same record AND the same key, compared by the fingerprint of the
        key's PUBLIC half, so a re-export of one key is a replay); `409` the name is taken by a different record, the
        key differs (rotate instead) or the registered key cannot be opened to compare (rotate it), a host key is held
        by another live target, or the record changed under a concurrent request (retry).
        ⛔ `I6`: `privateKey` is write-only and is never returned, logged, audited or hashed; the only value derived
        from it that any response carries is the PUBLIC key's fingerprint. `allowedConfigRoot` and
        `allowedContainerPrefix` are the envelope (`B2`): immutable once registered (`OR-52`).
        The request is refused `403 INSECURE_TRANSPORT`, before the body is read, unless the connection is secure, a
        trusted proxy reports `https`, or the peer is loopback (OQ-14 (b)).
      x-sm-permission: target.create
      x-sm-scope: named
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterTargetRequest' }
      responses:
        '200':
          description: An identical replay. Nothing was written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TargetDetail' }
        '201':
          description: Registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TargetDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: "`FORBIDDEN`, `CSRF_REJECTED`, `ORIGIN_REJECTED` or `INSECURE_TRANSPORT` — switch on `code`."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404': { $ref: '#/components/responses/NotFoundOrUnauthorized' }
        '409':
          description: "`CONFLICT` — the name is taken by a different record, the key is not the registered one (or the registered key cannot be opened to compare: rotate it), a host key of this machine is registered to another target, or the record changed under a concurrent request (retry)."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: "`VALIDATION_FAILED`, `CREDENTIAL_INVALID`, `HOST_KEY_NOT_OFFERED` or `TARGET_ADDRESS_REFUSED`."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          description: "`RATE_LIMITED` — this session's scan budget (shared with `scanHostKeys`) is spent. Nothing was scanned or written. Retry after `Retry-After` seconds."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: "`SERVICE_UNAVAILABLE` — the host could not be scanned. Nothing was written; retry."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /cp/targets/{targetId}:
    parameters: [{ $ref: '#/components/parameters/TargetId' }]
    patch:
      tags: [targets]
      operationId: editTarget
      summary: Update linked deployment-target metadata
      description: |
        Updates the display name and runtime-specific placement settings of a target created from a remote-server
        Connection. The parent connection and runtime are immutable after declaration; edit the Connection separately
        when SSH access changes. Docker targets accept `containerPrefix`; systemd targets accept `serviceNamePattern`.
        The operation never carries or returns SSH credentials.
      x-sm-permission: target.edit
      x-sm-scope: named
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateDeploymentTargetRequest' }
      responses:
        '200':
          description: Updated target metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TargetDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundOrUnauthorized' }
        '409':
          description: "`CONFLICT` — the name is already used, or the parent connection/runtime would change."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: "`VALIDATION_FAILED` — runtime-specific metadata is invalid."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /dp/host-key-scans:
    post:
      tags: [targets]
      operationId: scanHostKeys
      summary: Ask a host which SSH host keys it offers (writes nothing)
      description: |
        Plan 013 T1 (D-REG 5.1 T1). The DP connects to `host:port` WITHOUT authenticating and reports the keys the
        host presents, each with its algorithm. They are UNTRUSTED: nothing is pinned by this call. The user
        confirms one by sending it as `hostKeyFingerprint` to `registerTarget`, which scans again and refuses a pin
        the host does not offer (`HOST_KEY_NOT_OFFERED`).
        `target.create` is evaluated at the body's `ownershipScope`. Rate-limited per session (default 10 a minute,
        `429 RATE_LIMITED`). Recorded in the audit log (verb, scope, outcome; never the keys).
        The address policy applies (`TARGET_ADDRESS_REFUSED`, OQ-3 (d)).
      x-sm-permission: target.create
      x-sm-scope: named
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HostKeyScanRequest' }
      responses:
        '200':
          description: What the host offers. Never an error for a reachable host that offers keys.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostKeyScan' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundOrUnauthorized' }
        '422':
          description: "`VALIDATION_FAILED` (host or port outside the grammar) or `TARGET_ADDRESS_REFUSED`."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          description: "`RATE_LIMITED` — this session's scan budget is spent. Retry after `Retry-After` seconds."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: "`SERVICE_UNAVAILABLE` — the host could not be reached or presented no key."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /dp/targets/{targetId}/connection:
    parameters: [{ $ref: '#/components/parameters/TargetId' }]
    get:
      tags: [targets]
      operationId: getTargetConnection
      summary: Read a target's connection record (host, user, pin, offered keys, key summary)
      description: |
        Plan 013 T1.4 (D-REG 5.1 T3; OQ-13 (a)). A MANAGEMENT read under `target.edit`, not `target.view`: the
        envelope-only `Target` that `listTargets` returns stays what Viewer and Operator see. `404` when the target is
        not visible at the caller's scope, not live, or retired.
        ⛔ No field carries private-key material, its `credential_ref`, or a hash of the private key.

        **The record is a union on `transport`** (plan 015 T3.5): `ssh-docker` answers the SSH record above; `agent` answers the agent record, which names the agent and the envelope and nothing else.
      x-sm-permission: target.edit
      x-sm-scope: named
      responses:
        '200':
          description: The record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TargetConnection' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundOrUnauthorized' }
    patch:
      tags: [targets]
      operationId: editTargetConnection
      summary: Change a target's host, port, SSH user or pinned host key
      description: |
        Plan 013 T1.5 (D-REG 5.1 T4; OQ-12 (a)). `target.edit` at the target's own scope. Any change of `host`, `port` or
        `hostKeyFingerprint` scans the (new or kept) host afresh, applies the address policy, and requires the pin to be
        among the keys it offers; that scan draws on the SAME per-session budget as `scanHostKeys` and `registerTarget`
        (default 10 a minute, `429 RATE_LIMITED`, `Retry-After`) and is recorded in the audit log (verb `target.edit`, the
        target, the outcome; never the host or the keys). A change of `sshUser` alone is neither scanned nor charged.
        A re-pin retires the target's recorded host keys the fresh scan no longer offers and revives ones it offers again.
        `allowedConfigRoot`, `allowedContainerPrefix` (the envelope, immutable, `OR-52`), a private key (use
        `rotateTargetCredential`), an organization and a target id are not accepted (`400`).
        `409` while work is in flight on a placement of the target (a `REQUESTED`, `RUNNING` or `APPLY_INDETERMINATE`
        apply, or a fleet member that has not settled) when the host, port or pin changes; the same edit succeeds once the
        work has finished. A body that changes nothing writes nothing. Writes a connection event (field names only).

        **Agent targets** (plan 015 T3.5): a target whose `transport` is `agent` has no address, user, pin or credential (`BE-D68`); this answers `409 TARGET_TRANSPORT_UNSUPPORTED` before anything is read or scanned, and no scan is charged.
      x-sm-permission: target.edit
      x-sm-scope: named
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EditTargetConnectionRequest' }
      responses:
        '200':
          description: Changed (or nothing to change). Returns the record as it now stands.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SshDockerTargetConnection' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundOrUnauthorized' }
        '409':
          description: "`CONFLICT` — work is in flight on a placement of this target, an offered host key (or the new pin) is held by another live target, or the record changed under the edit (retry). Or `TARGET_TRANSPORT_UNSUPPORTED` — the target's transport is `agent`: it has no SSH connection record to change, and nothing was read, written or connected to."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: "`VALIDATION_FAILED` (a field outside its grammar), `HOST_KEY_NOT_OFFERED` or `TARGET_ADDRESS_REFUSED`."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          description: "`RATE_LIMITED` — this session's scan budget (shared with `scanHostKeys` and `registerTarget`) is spent. Nothing was scanned or written. Retry after `Retry-After` seconds."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: "`SERVICE_UNAVAILABLE` — the new host could not be reached or presented no key. Nothing was written; retry."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /dp/targets/{targetId}/credential:
    parameters: [{ $ref: '#/components/parameters/TargetId' }]
    put:
      tags: [targets]
      operationId: rotateTargetCredential
      summary: Replace a target's SSH private key
      description: |
        Plan 013 T1.5 (D-REG 5.1 T5, 6.4; `OR-85`). `target.edit` at the target's own scope. The same key again (compared
        by the fingerprint of the PUBLIC key, so a re-export is the same key) is `200` and writes nothing. A different key
        is stored as a new secret and the record is repointed in one transaction with its `credential_rotated` event; the
        old secret row stays (the runtime cannot delete one). NOT refused while work is in flight: a leaked key must be
        replaceable at once. Sessions already open keep the key they resolved; the next lease opens with the new one.
        ⚠️ SM stopping use of the old key does not revoke it: the old public key must be removed from each host's
        `authorized_keys`, after the new one has been added and confirmed with `testTargetConnection` (runbook).
        `CredentialSummary.publicKeyFingerprint` says which key is stored.
        ⛔ `I6`: `privateKey` is write-only and is never returned, logged, audited or hashed.
        The request is refused `403 INSECURE_TRANSPORT`, before the body is read, unless the connection is secure, a
        trusted proxy reports `https`, or the peer is loopback (OQ-14 (b)).

        **Agent targets** (plan 015 T3.5): a target whose `transport` is `agent` has no key to rotate; this answers `409 TARGET_TRANSPORT_UNSUPPORTED` before the supplied key is opened, and nothing is stored.
      x-sm-permission: target.edit
      x-sm-scope: named
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RotateTargetCredentialRequest' }
      responses:
        '200':
          description: The stored key's summary, after the call.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RotatedCredential' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: "`FORBIDDEN`, `CSRF_REJECTED`, `ORIGIN_REJECTED` or `INSECURE_TRANSPORT` — switch on `code`."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404': { $ref: '#/components/responses/NotFoundOrUnauthorized' }
        '409':
          description: "`CONFLICT` — the record changed under the rotation (retry). Or `TARGET_TRANSPORT_UNSUPPORTED` — the target's transport is `agent`: it has no SSH connection record to change, and nothing was read, written or connected to."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: "`VALIDATION_FAILED` or `CREDENTIAL_INVALID` — the key is not an unencrypted private key the data plane can open."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /dp/targets/{targetId}/connection/test:
    parameters: [{ $ref: '#/components/parameters/TargetId' }]
    post:
      tags: [targets]
      operationId: testTargetConnection
      summary: Check that a target can be reached, authenticated to, and used for Docker
      description: |
        Plan 013 T1.5 (D-REG 5.1 T6; OQ-9 (a)). `target.use` at the target's own scope. Connects with the pinned host key
        (the address policy first), authenticates with the stored key, and runs ONE fixed command
        (`docker version --format '{{.Server.Version}}'`; no input reaches it). An unreachable host, a host that presents
        another key than the pin, a key the host refuses, a stopped Docker daemon and a user outside the `docker` group are
        each a RESULT with the steps not reached set `false`, never a `5xx`. Writes nothing; recorded in the audit log
        (verb `target.use`, the target, the furthest step reached; never the host, the version or any message).
        `404` when the target has no live connection record.

        It is a probe, so it is bounded like one (review W4C-4): it draws on the SAME per-session budget as `scanHostKeys`,
        `registerTarget` and `editTargetConnection` (default 10 a minute), and only one test of a target runs at a time.
        Either refusal is `429 RATE_LIMITED` with `Retry-After`, makes no connection, and is recorded as a `DENY` row of
        `target.use` with the reason `rate_limited`. Whether tests should have a budget of their own is an open owner
        question (W3C-2, W4C-4).

        **Agent targets** (plan 015 T3.5): a target whose `transport` is `agent` has no address to connect to; this answers `409 TARGET_TRANSPORT_UNSUPPORTED`, no SSH connection is made, and the per-session probe budget is not drawn.
      x-sm-permission: target.use
      x-sm-scope: named
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      responses:
        '200':
          description: The result of each step.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TargetConnectionTest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundOrUnauthorized' }
        '409':
          description: "`TARGET_TRANSPORT_UNSUPPORTED` — the target's transport is `agent`: there is no SSH connection to test. No connection was made and no budget was drawn."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          description: "`RATE_LIMITED` — this session's probe budget (shared with `scanHostKeys`, `registerTarget` and `editTargetConnection`) is spent, or a test of this target is already running. No connection was made. Retry after `Retry-After` seconds."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /cp/targets/{targetId}/retire:
    parameters: [{ $ref: '#/components/parameters/TargetId' }]
    post:
      tags: [targets]
      operationId: retireTarget
      summary: Retire a target that has no live placement
      description: |
        Plan 013 T1.5 (D-REG 5.1 T7; OQ-11 (b)). `target.edit` at the target's own scope. Data plane first (a retired
        connection is unusable at once, and its host keys are freed), then the control-plane row (`TARGET_RETIRED`). A
        failure between the two leaves a listed target that cannot be used, and the same call again completes it.
        `409 CONFLICT` while any live placement names the target (V007's guard, mapped; it names no instance). Retiring a
        retired target is `200` and returns the original `retiredAt`. A control-plane row with no connection record (a
        registration that never reached the data plane) retires on its own. A retired target's name is free for a new
        registration.

        **Agent targets** (plan 015 T3.5): an agent target is retired only after its agent has been revoked (`revokeAgent`); until then this answers `409 AGENT_STILL_ENROLLED` and changes nothing. After revocation it retires as any target does (the data plane's connection first, the governance row second).
      x-sm-permission: target.edit
      x-sm-scope: named
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      responses:
        '200':
          description: Retired (or already retired). `retiredAt` is set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Target' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundOrUnauthorized' }
        '409':
          description: "`CONFLICT` — a live placement names this target. Or `AGENT_STILL_ENROLLED` — the target is an agent target whose agent is not revoked."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ── connections ───────────────────────────────────────────────────────────
  #
  # Plan 013 T1 (`BE-D66`, `OR-130`). Connection config objects (Solace broker / remote server, D-4) get the
  # same cp/dp split Targets already has, but are never a deployment-trust anchor: no host-key pinning or
  # scanning. `createConnection`/`updateConnection` take `testBeforeSave` — the single flag backing both
  # "Save" and "Test & Save"; there is no separate test-then-save round trip, unlike the Target flow's
  # `scanHostKeys`/`testTargetConnection`.

  /cp/connections:
    get:
      tags: [connections]
      operationId: listConnections
      summary: Connections visible to the caller
      description: |
        ⚠️ **`x-sm-scope: reach`** (shaped exactly like `listTargets`, ruling `OR-130`): `connection.view`
        held at ≥ 1 grant anywhere in the caller's organization (else `403`), then items filtered by
        `connection.view` at each connection's own `ownershipScope`.
      x-sm-permission: connection.view
      x-sm-scope: reach
      responses:
        '200':
          description: Connections.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [connections]
      operationId: createConnection
      summary: Create a connection config object
      description: |
        `connection.create` at the body's `ownershipScope` (ruling `OR-130`, shaped like `registerTarget`'s
        `target.create` at `ownershipScope`). `testBeforeSave: true` runs the connectivity test (`BE-D66`:
        JCSMP or SSH auth-only, no host-key pinning) **before** anything is written; a failed test is
        `422 CONNECTION_TEST_FAILED` with the rejection reason and the non-secret fields of the request
        echoed back — secret-typed attributes are stripped from the echo (`I6`) — and **nothing is
        written**. `testBeforeSave` omitted or `false` writes without testing. No `organizationId` in the
        body (`I5`): the organization is the session's.
        The connectivity test draws on its own per-session rate budget (default 10 a minute,
        `429 RATE_LIMITED`, `Retry-After`) — the same mechanism as the Target scan budget, but a **separate
        counter** (`BE-D66`).
      x-sm-permission: connection.create
      x-sm-scope: named
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateConnectionRequest' }
      responses:
        '201':
          description: Created. Not tested, or tested and passed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Connection' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: "`FORBIDDEN`, `CSRF_REJECTED` or `ORIGIN_REJECTED` — switch on `code`."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404': { $ref: '#/components/responses/NotFoundOrUnauthorized' }
        '409':
          description: "`CONFLICT` — the name is taken by a different record in this scope."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: "`VALIDATION_FAILED` (a field outside its connection type's descriptor) or, when `testBeforeSave: true` and the test fails, `CONNECTION_TEST_FAILED` with the rejection reason. Nothing is written either way."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          description: "`RATE_LIMITED` — this session's connection-test budget is spent. Nothing was tested or written. Retry after `Retry-After` seconds."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: "`SERVICE_UNAVAILABLE` — `testBeforeSave: true` could not reach the target to test it. Nothing was written; retry."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /cp/connection-types:
    get:
      tags: [connections]
      operationId: getConnectionTypes
      summary: The connection type catalog (SM-owned, never package-supplied)
      description: |
        **Authentication only, at install scope** (shaped like `getCapabilities`) — any authenticated
        principal of any organization reads it; the catalog is identical for every caller. Mirrors
        `contracts/connection-types/*.json` (`UI-D27`) exactly — one descriptor per `connectionType`,
        shared by the catalog form and the Designer's renderer.
      x-sm-permission: none.authenticationOnly
      x-sm-scope: install
      responses:
        '200':
          description: The connection type descriptors.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConnectionType' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /cp/connections/{connectionId}:
    parameters: [{ $ref: '#/components/parameters/ConnectionId' }]
    patch:
      tags: [connections]
      operationId: updateConnection
      summary: Change a connection's attributes
      description: |
        `connection.edit` at the connection's own scope (ruling `OR-130`, shaped like `editTargetConnection`'s
        `target.edit`). `testBeforeSave: true` runs the connectivity test with the merged (new-over-existing)
        attributes **before** writing; a failed test is `422 CONNECTION_TEST_FAILED`, non-secret fields
        echoed back (secrets stripped, `I6`), and **nothing is written**. `testBeforeSave` omitted or
        `false` writes without testing. `connectionType` and an organization or connection id are not
        accepted (`400`) — the type is fixed at creation. A body that changes nothing writes nothing.
        Draws on the same per-session connection-test budget as `createConnection` (default 10 a minute,
        `429 RATE_LIMITED`, `Retry-After`).
      x-sm-permission: connection.edit
      x-sm-scope: named
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateConnectionRequest' }
      responses:
        '200':
          description: Changed (or nothing to change). Returns the record as it now stands.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Connection' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundOrUnauthorized' }
        '409':
          description: "`CONFLICT` — the name is taken by a different record in this scope, or the record changed under the edit (retry)."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: "`VALIDATION_FAILED`, or `CONNECTION_TEST_FAILED` when `testBeforeSave: true` and the test fails. Nothing is written either way."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          description: "`RATE_LIMITED` — this session's connection-test budget is spent. Nothing was tested or written. Retry after `Retry-After` seconds."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: "`SERVICE_UNAVAILABLE` — `testBeforeSave: true` could not reach the target to test it. Nothing was written; retry."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [connections]
      operationId: deleteConnection
      summary: Delete a connection with no remaining users
      description: |
        `connection.delete` at the connection's own scope (ruling `OR-130`). `409 CONFLICT` while
        `usedByCount > 0` — the same "refuse while referenced" shape as `retireTarget`'s live-placement
        guard, except a deleted connection leaves no row (there is no retire/undo for a connection; a
        Target stays listed as retired, a Connection does not).
      x-sm-permission: connection.delete
      x-sm-scope: named
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      responses:
        '204':
          description: Deleted.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: "`FORBIDDEN`, `CSRF_REJECTED` or `ORIGIN_REJECTED` — switch on `code`."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404': { $ref: '#/components/responses/NotFoundOrUnauthorized' }
        '409':
          description: "`CONFLICT` — `usedByCount > 0`; this connection is still referenced."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /cp/connections/{connectionId}/deactivate:
    parameters: [{ $ref: '#/components/parameters/ConnectionId' }]
    post:
      tags: [connections]
      operationId: deactivateConnection
      summary: Deactivate a connection without deleting it
      description: |
        `connection.edit` at the connection's own scope (ruling `OR-130`). Marks the connection inactive;
        it stays listed (`active: false`) and still counts toward `usedByCount` for whatever references it.
        Deactivating an already-inactive connection is `200` and writes nothing.
      x-sm-permission: connection.edit
      x-sm-scope: named
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      responses:
        '200':
          description: Deactivated (or already inactive).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Connection' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundOrUnauthorized' }

  # ── instances ─────────────────────────────────────────────────────────────

  /dp/solutions/{solutionId}/instances:
    parameters: [{ $ref: '#/components/parameters/SolutionId' }]
    get:
      tags: [instances]
      operationId: listInstances
      summary: Instances of one solution
      description: |
        `{solutionId}` is the **catalog** id (`OR-41`).

        ⚠️ **`x-sm-scope: reach`** (ruling `OR-51`, `OR-55`): `instance.view` held at ≥ 1 grant
        anywhere in the caller's organization (else `403`), then items filtered by
        `instance.view` at each instance's own scope — never `organization` or `solution`, which
        would `403` an environment-bound Operator before any filtering
        (`ScopeEvaluatingAuthorizationService.java:41-50`; `ScopeVisibility.java:6`).
      x-sm-permission: instance.view
      x-sm-scope: reach
      responses:
        '200':
          description: Instances, filtered to the caller's scopes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstanceList' }
        '400':
          description: "`BAD_REQUEST` — `{solutionId}` is not a UUID."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundOrUnauthorized' }

  /dp/environments/{environmentId}/instances:
    parameters: [{ $ref: '#/components/parameters/EnvironmentId' }]
    post:
      tags: [instances]
      operationId: declareInstance
      summary: Declare an instance
      description: |
        Requires `instance.create` at the environment **and** `instance.bindTarget`
        plus `target.use` for the target being bound — `D10`'s two-sided rule.

        ⚠️ **Path moved to the environment** (owner ruling 2026-09-29 (S0-8), `OR-52`):
        `instance.create` is checked at the environment (`OR-27`) and the resource is resolved
        **before the body is read** (`ResourceResolver.java` javadoc), so the environment cannot
        come from the body.

        **The body names a host path and a container only inside the target's own envelope**
        (Global Constraints, B2) — `containerName` inside `allowedContainerPrefix` and
        `configDirectory` inside `allowedConfigRoot`, both fixed at target registration (T2.7).
        Anything else is `422 VALIDATION_FAILED` naming the field, never echoing the value —
        enforced by the service, a database trigger, and the adapter's canonical-path preflight.

        **`acquisition` is the per-instance acquisition mode** (owner rulings M-Q2 and M-Q2b,
        2026-09-29; the address question ruled by `OR-82`, 2026-10-05): the operator **chooses**
        the mode here — `direct-http` (the DP polls the **target's registered address**, fixed
        when an operator registered the target (T2.7), at the placement's `healthPort` and the
        package-declared health path, over HTTP; offered first) or `via-ssh` (the DP curls the
        host's loopback over the target's SSH session) — and the DP persists the **mode** at
        **instance** level, so it survives a re-target's new placement. **The body carries no
        host and no address of any kind** (`OR-82`): nothing about where the DP connects comes
        from the browser, so an `instance.create` holder cannot point the DP at an arbitrary
        address, and a re-target polls the new target's own address with no carried-forward value.
        **No automatic fallback**: a failing path reads `unreachable`, it never switches. One
        setting governs both health polling (M-Q2b, amending `OR-39`) and metrics collection.
        Changing it later is a future operation, not part of v1.

        `healthPort` is the host-side port the engine reaches over the chosen mode (M12). The
        probe's `kind`, `path` and `strength` come from the package's **declared** `health.probe`
        (`contracts/solution-package.schema.json`, `T0.1a`), resolved by the gateway at declare —
        never from this body.

        **The host binding: exactly one of `targetId` and `connectionId`** (integration plan 014).
        New declarations select `deploymentMode: dp-remote` (the default when absent) and bind a
        **remote-server Connection** by `connectionId`; `targetId` remains for older clients and
        existing instances. Neither is in `required`, because "exactly one of" cannot be said beside
        `additionalProperties: false` without restructuring the body into a `oneOf`: a body naming
        **both or neither** is `422 VALIDATION_FAILED` naming `connectionId`. A `connectionId` that is
        not an **active `remote-server`** Connection of the organization, or whose data-plane runtime
        projection is not live, is `422` naming `connectionId` (fail closed: no fallback to a Target,
        and the browser never supplies a host). `host-local` and `federated` are reserved and refused
        `422` naming `deploymentMode`. For a connection-backed declare, `instance.bindTarget` is asked
        at the environment and `target.use` at the **Connection's** ownership scope (plan 014: the
        same checks, mapped to the Connection resource). ⚠️ A connection-backed placement records no
        metrics endpoints and is neither applied, probed nor collected until plan 014 step 3 resolves
        the host through the Connection: until then it fails closed (`unreachable`, target unavailable).
        **Agent targets** (plan 015 T3.5): a declare that names an agent target answers `409 TARGET_IS_AGENT_MANAGED`: an agent's instances register themselves from discovery (`OR-27`). Nothing was written.
      x-sm-permission: instance.create
      x-sm-permission-also: [instance.bindTarget, target.use]
      x-sm-scope: environment
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [solutionId, name, declaredPackageVersion, placement, acquisition]
              properties:
                solutionId:
                  type: string
                  format: uuid
                  description: The **catalog** id (`OR-41`), never the package's declared `solution` string.
                name: { type: string, minLength: 1, maxLength: 128 }
                targetId:
                  type: string
                  format: uuid
                  description: Legacy Target binding. Exactly one of `targetId` and `connectionId` (see above).
                connectionId:
                  type: string
                  format: uuid
                  description: |
                    A remote-server Connection (plan 013) the `dp-remote` instance is bound to (plan 014).
                    Exactly one of `targetId` and `connectionId` (see above).
                role:
                  type: string
                  minLength: 1
                  description: Package-defined instance role; omitted when the package has no roles.
                deploymentMode:
                  allOf:
                    - $ref: '#/components/schemas/DeploymentMode'
                  description: Absent means `dp-remote`. Only `dp-remote` is accepted today.
                declaredPackageVersion:
                  allOf:
                    - $ref: '#/components/schemas/PackageVersionId'
                  description: One member of the solution's own `packageVersions`.
                placement:
                  type: object
                  required: [containerName, configDirectory, containerConfigPath, fileName, healthPort]
                  properties:
                    containerName: { type: string, minLength: 1 }
                    configDirectory: { type: string, minLength: 1 }
                    containerConfigPath: { type: string, minLength: 1 }
                    fileName: { type: string, minLength: 1 }
                    healthPort: { type: integer, minimum: 1, maximum: 65535 }
                    metricsPorts:
                      type: object
                      description: |
                        M-Q14 (`OR-74`): the host port each package metrics source port is published on, as
                        `{"<sourcePort>": <hostPort>}`; each is 1-65535. A source port **absent** from the map
                        defaults to itself. It mirrors `healthPort` and sits beside it: a port on the target's
                        registered address (`direct-http`) or on the host loopback (`via-ssh`), with no host
                        in the body (`OR-82`). Two source ports mapped to one host port is `409
                        METRICS_PORT_CONFLICT`. Accepted at declare and not yet acted on until plan 011 P11-4.1.
                      propertyNames:
                        pattern: '^([1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$'
                      additionalProperties: { type: integer, minimum: 1, maximum: 65535 }
                  additionalProperties: false
                acquisition: { $ref: '#/components/schemas/Acquisition' }
              additionalProperties: false
      responses:
        '201':
          description: Declared.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Instance' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundOrUnauthorized' }
        '409':
          description: |
            `CONFLICT` — a placement collision (`OR-29`) — `ENTITLEMENT_REFUSED` — the
            organization's instance quota is exhausted (`OR-40`) — `PACKAGE_VERSION_MISMATCH` — the
            declared package version's content differs from the recorded one — or
            `METRICS_PORT_CONFLICT` — two source ports mapped to one host port. Switch on `code`.
            `TARGET_IS_AGENT_MANAGED` — the target is an agent target: its instances come only from discovery (`OR-27`). Nothing was written.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            `VALIDATION_FAILED` — names the field. Never echoes the value. An `acquisition`
            carrying any property other than `mode` (a host, in particular — `OR-82`) is refused.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /dp/instances/{instanceId}:
    parameters: [{ $ref: '#/components/parameters/InstanceId' }]
    get:
      tags: [instances]
      operationId: getInstance
      summary: One instance
      x-sm-permission: instance.view
      x-sm-scope: instance
      responses:
        '200':
          description: The instance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Instance' }
        '400':
          description: "`BAD_REQUEST` — `{instanceId}` is not a UUID."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundOrUnauthorized' }
    delete:
      tags: [instances]
      operationId: undeclareInstance
      summary: Undeclare an instance
      description: |
        Releases the instance from SM's inventory and management (`BE-D49`; ruled in `OR-121`, `OPS-Q2` **U-C**): afterwards it
        is not listed or readable, SM polls nothing on it, collects no metrics from it, admits no apply to it, and it no longer
        counts against the organization's quota (`OR-40`). **Nothing is deleted** — every row moves to a terminal state and
        stays — and ids are never reused.

        ⛔ **It never touches the host.** The container keeps running — now **unmanaged by SM** — together with its config file
        and the `.sm-preimage-*` and `.sm-fp-*` files SM wrote beside it (the file holds the secrets the container uses; the
        pre-images may hold older ones). Cleaning them is the operator's, and `docs/runbooks/operations.md` gives the exact
        commands. The request must say so: `?workload=leave-running` is **required**, and any other value or none is `400`,
        so a caller who expected the container to be stopped or removed is told before anything happens. To stop it first, call
        `stopInstance` (`instance.stop`) and wait for it to land.

        Requires `instance.undeclare` at the instance (`HIGH`; Administrator and Operator). Authorization is at the owning
        instance (`OR-16`); placements are not a grant level.

        **Refused `409`** while anything is in flight on the instance: a `REQUESTED` or `RUNNING` apply or stop, an
        unresolved `APPLY_INDETERMINATE` request (there is no API to resolve one by hand — `OPS-Q5`, a known gap), or a
        `RUNNING` fleet that still reserves one of its placements, **or while a `PENDING` apply schedule names the instance**
        (`OR-131`): cancel the instance's pending schedules first (`cancelApplySchedule`), then undeclare. The check is made
        holding the instance's admission lock, which `submitApply` and `rollbackApply` (with a `schedule`) also take before it inserts, so an undeclare and an
        admission, or an undeclare and a schedule created at the same moment, cannot both win. `detail` names which kind, never
        another request's id.

        **Two planes, three steps** (`ops-501.md` §4.4): the data plane records the intent and takes the instance out of every
        read (`retiring`), the control plane releases the governance node (audited `INSTANCE_UNDECLARED`, naming the
        requesting session), and the data plane finishes (`retired`; its placements retired). A crash between the steps is
        finished by **retrying this call** (an authorized retry resumes and answers `200`; the control-plane audit row names
        the retrying principal, the data-plane record keeps the original requester) or by a lazy sweep that runs inside
        `declareInstance`, `listInstances` and `getInstance` for the requesting organization only: it completes an undeclare
        whose control-plane step is done, and **rolls back** one that is not once `sm.dp.undeclare.rollback-after` (default
        ten minutes) has passed — the instance then simply reappears. A request that finds its own record older than **half**
        that window answers `503` and the control plane is not written, so a roll-back can never race a slow control-plane step.
        Retry once the whole window has passed: a retry that finds its own record older than the **whole** window runs the same
        sweep for the requesting organization (rolling the stale record back), then begins again on the clean record and
        proceeds; it does not wait for another request to run the sweep. Between half the window and the whole window every
        retry is `503` by design.

        **A repeated call is `404`**, as for an unknown id: a retired instance, one whose control-plane node is already
        released, and one that never was this organization's are indistinguishable.

        ⚠️ **Residues, accepted** (`OPS-Q4` (a)): the instance's role bindings stay but grant and reveal nothing; metric history
        stays until partition retention and is unreachable through the API; an `APPLY_INDETERMINATE` request blocks undeclare
        until the reconciler resolves it.
      x-sm-permission: instance.undeclare
      x-sm-scope: instance
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - name: workload
          in: query
          required: true
          description: "Must be `leave-running`; undeclare never stops or removes the container."
          schema: { type: string, enum: [leave-running] }
      responses:
        '200':
          description: |
            Undeclared. The workload was left running; each placement is listed with the last health state SM had persisted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstanceRetirement' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundOrUnauthorized' }
        '409':
          description: |
            `CONFLICT` — something is in flight on the instance (a request, a fleet reservation or a `PENDING` apply schedule). Switch on the problem's
            `detail`; it names the kind, never the request, the fleet or another instance.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: |
            `SERVICE_UNAVAILABLE` — this request's own data-plane record is older than half the roll-back window, so the
            control plane was **not** written; retry. The instance may read as released and reappear once the window passes.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ── placements of an existing instance (plan 008 S3: BE-D47, BE-D53) ───────

  /dp/instances/{instanceId}/placements:
    parameters: [{ $ref: '#/components/parameters/InstanceId' }]
    post:
      tags: [instances]
      operationId: addPlacement
      summary: Add a placement to an instance
      description: |
        Gives an **active** instance another placement — a second container on another target (or a second one on the same
        target, with its own container name, config directory and ports) — in one data-plane transaction that locks the
        instance row and re-checks `active` (`BE-D47`). Writes **no host and deploys nothing**: the customer's CI/CD deploys
        the container and the operator names it here (`OR-29`, `I1`).

        Requires `instance.bindTarget` **at the instance** (`OR-16`; ruled in `OR-121`, OQ-8.3s (i)) **and** `target.use` at
        the target named in the body — `D10`'s two-sided rule. A binding scoped to one instance can add placements to that
        instance only. Does **not** count against the organization's instance quota: a placement is not an instance
        (`OR-121`, OQ-8.8 (a)).

        **The body is `declareInstance`'s `placement` object plus the `targetId`**, with the same envelope: `containerName`
        inside the target's `allowedContainerPrefix` and `configDirectory` inside its `allowedConfigRoot` (`B2`; anything
        else is `422 VALIDATION_FAILED` naming the field, never the value). **The probe's `kind`, `path` and `strength` and
        the metrics definitions come from the instance's DECLARED package version — never from this body.** `healthPort` and
        `metricsPorts` are host-side ports on the **new** target, as at declare; the body carries no host or address
        (`OR-82`) and `acquisition` is the instance's own, not repeated here.

        ⚠️ **What the new placement starts as** (`OR-121`, OQ-8.10 (a)): unconverged, and said so. Until a fleet rolls the
        instance's current generation to it, the configuration ladder reads `rendered` (the lowest rung across live
        placements), `instance.config-state` is announced if the stored rung moved, `getHealth` reports it unpolled and then
        — if the container is not deployed yet — `unreachable`, which is true. **Next:** roll the current generation to the
        new placement with `submitFleetApply` (one member) or `submitApply`.

        ⚠️ **A package that declares push metrics (`solace_event` sources) is refused `409`** (OQ-8.9 (a)): a push reading
        is attributed to a placement by the instance key in its payload, which names no placement and, with two, would be
        dropped as ambiguous — and `I1` forbids a placement field in the MI's event. Pull-path metrics are per placement and
        unaffected. Only an `active` instance takes a placement: a pending, abandoned, unknown or another organization's
        instance is the same `404`.

        ⚠️ **Refused `409` while an instance-wide request is in flight** (`REQUESTED`, `RUNNING` or `APPLY_INDETERMINATE`;
        in practice an instance-wide stop): an instance-wide stop reads the live placements **once, when it starts running**,
        so a placement added under it would be left running by a stop that then reports the instance stopped. The check is
        made holding the instance's admission lock, as `retirePlacement`'s is. Add after it lands.

        ⚠️ **The add stamps the instance** (it changes what the instance reads as), so a designer session that staged
        against the earlier `stateVersion` is refused `409` (a stale `baseStateVersion`) on its next `stageConfig` and must re-read.

        The acting principal is recorded on the placement row as `created_by` (`OR-125` (1), `sm_data` V026). A placement
        that pre-dates V026 has no recorded actor.

        **Agent targets** (plan 015 T3.5): placements on an agent target come only from `OR-27` discovery in v1; naming one answers `409 TARGET_IS_AGENT_MANAGED` and writes nothing.
      x-sm-permission: instance.bindTarget
      x-sm-permission-also: [target.use]
      x-sm-scope: instance
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetId, placement]
              properties:
                targetId: { type: string, format: uuid }
                placement:
                  type: object
                  required: [containerName, configDirectory, containerConfigPath, fileName, healthPort]
                  properties:
                    containerName: { type: string, minLength: 1 }
                    configDirectory: { type: string, minLength: 1 }
                    containerConfigPath: { type: string, minLength: 1 }
                    fileName: { type: string, minLength: 1 }
                    healthPort: { type: integer, minimum: 1, maximum: 65535 }
                    metricsPorts:
                      type: object
                      description: |
                        As `declareInstance`'s `placement.metricsPorts` (M-Q14, `OR-74`): the host port each package metrics
                        source port is published on, as `{"<sourcePort>": <hostPort>}`; each is 1-65535, and a source port
                        **absent** from the map defaults to itself. A port on the new target's registered address
                        (`direct-http`) or on the host loopback (`via-ssh`), with no host in the body (`OR-82`). Two source
                        ports mapped to one host port, or a host port another live placement on this target already maps or
                        probes, is `409 METRICS_PORT_CONFLICT`.
                      propertyNames:
                        pattern: '^([1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$'
                      additionalProperties: { type: integer, minimum: 1, maximum: 65535 }
                  additionalProperties: false
              additionalProperties: false
      responses:
        '201':
          description: |
            Added. The instance as it reads now: every live placement, and a fresh `stateVersion` (the add stamped the
            instance).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Instance' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundOrUnauthorized' }
        '409':
          description: |
            `CONFLICT` — a placement collision (`OR-29`: this target already has a live placement with that container name,
            config directory or health port), the instance's package declares push metrics (`OR-121`, OQ-8.9 (a)) or an
            instance-wide request is in flight on the instance (a stop reads the live set once, when it starts) —
            `METRICS_PORT_CONFLICT` — `PACKAGE_VERSION_MISMATCH` — the declared package version's content differs from the
            recorded one. Switch on `code`.
            `TARGET_IS_AGENT_MANAGED` — the target is an agent target: its placements come only from discovery (`OR-27`). Nothing was written.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            `VALIDATION_FAILED` — names the field (`targetId` not a live target of this organization, or a `placement` field
            outside the target's envelope or its grammar). Never echoes the value.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /dp/instances/{instanceId}/placements/{placementId}:
    parameters:
      - { $ref: '#/components/parameters/InstanceId' }
      - { $ref: '#/components/parameters/PlacementId' }
    delete:
      tags: [instances]
      operationId: retirePlacement
      summary: Retire one placement of an instance
      description: |
        Retires **one** live placement (`BE-D53`; ruled in `OR-121`, plan 012 `OPS-Q12` R-1): the row is kept forever, marked
        retired, and its container name, config directory and ports become free for `addPlacement` again.

        ⛔ **It never touches the host.** The container keeps running — now **unmanaged by SM** — and the response says so
        (`workload: left-running`). The request must say so too: `?workload=leave-running` is **required**, and any other
        value or none is `400`, so a caller who expected the container to be removed is told before anything happens.

        Requires `instance.bindTarget` at the instance — the verb that adds a placement also removes one; `target.use` is not
        asked, because removal touches no target.

        **Refused `409`** for the instance's **last** live placement (that is releasing the instance from management,
        undeclare) and while work is in flight that names it: a `REQUESTED`, `RUNNING` or `APPLY_INDETERMINATE` request on it
        **or on the whole instance** (an instance-wide stop addresses every live placement), or a fleet that still reserves it,
        **or a `PENDING` scheduled apply that names the placement** (a distinct `409` detail that names no schedule: cancel the
        placement's pending schedules, then retire it; Fable F-3, `OR-131` Q2 by analogy).
        The in-flight check is made holding the instance's admission lock, so no request can be admitted between the check and
        the retirement. An instance-wide stop issued afterwards addresses only the **remaining** live placements (`BE-D46`).

        ⚠️ **A window this does not close** (W2 review W2A-3): a `submitApply` or a `submitFleetApply` validates that its
        placement is live **before** admission, and admission does not re-check it. One that validated the placement a moment
        before it was retired is then admitted for a retired placement, and **fails visibly** at its preflight (a failed
        request, or a fleet that ends `COMPLETED_WITH_FAILURES` or halts) rather than being refused up front. Nothing is
        applied to the host. Retire a placement when nothing of yours is being submitted for it.

        ⚠️ **The retirement stamps the instance**, so a designer session that staged against the earlier `stateVersion`
        is refused `409` (a stale `baseStateVersion`) on its next `stageConfig` and must re-read.

        The acting principal is recorded on the placement row as `retired_by`, with `retired_at` (`OR-125` (1), `sm_data`
        V026).
        Plan 012 T5 (`OPS-Q12` R-1) also writes, in the same data-plane transaction, a placement-scoped `instance_retirement`
        row — the session principal, the request's correlation id, the disposition `leave-running` and the placement's last
        persisted health state — already closed `retired`. A refused retirement writes neither record.

        Afterwards the configuration ladder is re-settled: retiring the placement that lagged raises the instance's rung, and
        `instance.config-state` is announced if the stored rung moved.
      x-sm-permission: instance.bindTarget
      x-sm-scope: instance
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - name: workload
          in: query
          required: true
          description: "Must be `leave-running`; retiring a placement never stops or removes its container."
          schema: { type: string, enum: [leave-running] }
      responses:
        '200':
          description: Retired. The workload was left running, and the instance reads without the placement.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlacementRetirement' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundOrUnauthorized' }
        '409':
          description: |
            `CONFLICT` — the placement is the instance's last live placement, or work is in flight that names it. Switch on
            the problem's `detail`; neither names the request, the fleet nor another instance.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ── designer ──────────────────────────────────────────────────────────────

  /dp/instances/{instanceId}/designer:
    parameters: [{ $ref: '#/components/parameters/InstanceId' }]
    get:
      tags: [designer]
      operationId: getDesigner
      summary: The config-driven designer view model
      description: |
        ⛔ **`I6`: no resolved secret value is ever returned.** Fields marked
        `secretRef` carry the reference and a presence flag, never the value.

        **`OR-96`: `layout` is the canvas layout the operator last saved**, read from the data plane's
        per-instance presentation record. It is not part of any generation: it lives outside
        `config_generation`, its history and its hash, and it never enters `viewModel.rendered`.
        It is `{}` until a layout has been saved. Reading it needs `config.view`.
      x-sm-permission: config.view
      x-sm-scope: instance
      responses:
        '200':
          description: The designer view model.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Designer' }
        '400':
          description: "`BAD_REQUEST` — `{instanceId}` is not a UUID."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundOrUnauthorized' }

  /dp/instances/{instanceId}/config:
    parameters: [{ $ref: '#/components/parameters/InstanceId' }]
    post:
      tags: [designer]
      operationId: stageConfig
      summary: Save and stage a configuration change
      description: |
        Staging writes nothing to the host. Only apply does. **`OR-34`, `OR-33` guard 1:**
        `rendered` is the client's own computed save/diff/hash payload (`FE-D17`); the server
        recomputes the same projection and refuses `422 VALIDATION_FAILED` on a mismatch, naming
        no value. `unchanged` on the response is `true` when the draft equals the current
        generation byte-for-byte (`OR-33` guard 1) — no new generation is written.

        **`OR-96`: a layout-only save is persisted, separately from config history.** Each
        `componentSelection.instances[].layout` (`UI-D20` presentation state) is stored in the data plane's
        per-instance presentation record, **outside** `config_generation`, its history and its hash. The record
        is replaced by the layout this request carries (an instance with no `layout` is not in it). A save that
        changes only layout therefore mints **no generation** and draws no `stateVersion` stamp
        (`unchanged: true`), yet `getDesigner` returns the saved layout; a save that also changes configuration
        mints a generation as before, and layout is in neither that generation nor its hash. A stale
        `baseStateVersion` is refused `409` for a layout-only save too. Authorized by `config.edit`, the same
        verb as any other save — there is no layout verb.
      x-sm-permission: config.edit
      x-sm-scope: instance
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseStateVersion, componentSelection, draftValues, rendered]
              properties:
                baseStateVersion:
                  $ref: '#/components/schemas/StateVersion'
                componentSelection:
                  type: object
                  required: [instances]
                  properties:
                    instances:
                      type: array
                      items:
                        type: object
                        required: [instanceKey, type]
                        properties:
                          instanceKey: { type: string }
                          type: { type: string }
                          layout:
                            type: object
                            description: "UI-D20: presentation state, excluded from `rendered` and the hash. OR-96: persisted in the per-instance presentation record, outside config history."
                            required: [x, y]
                            properties:
                              x: { type: number }
                              y: { type: number }
                draftValues:
                  type: object
                  description: Draft values, namespaced per component instance key.
                  additionalProperties:
                    type: object
                    additionalProperties: true
                rendered:
                  type: array
                  description: The client's own computed payload, checked against the server's projection.
                  items: { $ref: '#/components/schemas/RenderedEntry' }
              additionalProperties: false
      responses:
        '200':
          description: Staged (or, when `unchanged`, left as the current generation).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StagedConfig'
                  - type: object
                    required: [unchanged]
                    properties:
                      unchanged: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundOrUnauthorized' }
        '409':
          description: "`CONFLICT` — a newer `stateVersion` exists. Refetch and re-stage."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: "`VALIDATION_FAILED` — a projection mismatch between the client's `rendered` and the server's own. Never echoes a value."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /dp/instances/{instanceId}/config/history:
    parameters: [{ $ref: '#/components/parameters/InstanceId' }]
    get:
      tags: [designer]
      operationId: getConfigHistory
      summary: Configuration history
      description: "⛔ **`I6`: history is redacted at the same boundary as the designer.**"
      x-sm-permission: config.view
      x-sm-scope: instance
      responses:
        '200':
          description: History entries, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigHistory' }
        '400':
          description: "`BAD_REQUEST` — `{instanceId}` is not a UUID."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundOrUnauthorized' }

  /dp/instances/{instanceId}/config/secrets/{fieldKey}:
    parameters:
      - { $ref: '#/components/parameters/InstanceId' }
      - { $ref: '#/components/parameters/FieldKey' }
    post:
      tags: [designer]
      operationId: setConfigSecret
      summary: Store a secret literal for one designer field
      description: |
        Contracted by ruling `OR-45` (console-integration.md §5.2 row 41) and served.
        **Ratified (Step 7 sitting 2026-09-30, batch 1, point 17):** one call, `200 StagedConfig`
        — the landed `9ec6797` shape — not the earlier two-call (store, then stage) design. See
        [`ENDPOINT-INVENTORY.md`](ENDPOINT-INVENTORY.md) §7.
        ⛔ **`I6`: the literal `value` is written to the secret backend and never
        persisted in config storage, history, or a log; this operation NEVER RETURNS a
        resolved value** — the `200` response is a `StagedConfig`, carrying `stateVersion`
        and `generation` only, not the field's `FieldValue`; refetch the designer to see the
        field's `kind` (`secretRef` with the new reference, or `secretUnset`). Staging writes
        nothing to the host; only apply does.
      x-sm-permission: config.edit
      x-sm-scope: instance
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value, baseStateVersion]
              properties:
                value:
                  type: string
                  format: password
                  writeOnly: true
                  description: The secret literal. Never echoed back, never logged.
                baseStateVersion:
                  $ref: '#/components/schemas/StateVersion'
              additionalProperties: false
      responses:
        '200':
          description: Staged. The field now carries a `secretRef`, never the value.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StagedConfig' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundOrUnauthorized' }
        '409':
          description: A newer `stateVersion` exists. Refetch and re-stage.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            `VALIDATION_FAILED` — the value is rejected (`SECRET_VALUE_REJECTED`), the field key is
            declared by more than one component (`SECRET_FIELD_AMBIGUOUS`), the package cannot be read
            (`PACKAGE_UNAVAILABLE`), or a stage rule refuses it. ⛔ The `detail` names the field and the
            reason and NEVER carries the value (`I6`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /dp/instances/{instanceId}/config/accept-runtime:
    parameters: [{ $ref: '#/components/parameters/InstanceId' }]
    post:
      tags: [designer]
      operationId: acceptRuntimeConfig
      summary: Accept observed runtime drift as the new intended configuration
      description: |
        Contracted by ruling `OR-45` (console-integration.md §5.2 row 42); served by plan 010 T10.4 as ruled by
        `OR-104` (`D-ACCEPT`, [`accept-runtime.md`](../../docs/design/backend/accept-runtime.md)).
        Accepting drift is an OVERRIDE, not a plain edit — both `config.edit` and
        `config.overrideWarning` are required. **Writes nothing to the host.**

        It reads the named placement's own config file back (one bounded read; the request names no path,
        host or command) and stages what it can map as a new generation with `origin accept-runtime`,
        through the same server-side half `stageConfig` runs (`OR-34`): the server re-projects, refuses an
        undeclared key or a blocking validation, and stores its own result.

        - **Keys the package does not declare** are accepted-around, not refused: they are listed by
          **path only** in `notAccepted[]` (capped at 200, `truncated`), and ⚠️ **the next apply removes
          them from the host**, because the file is rebuilt from the generation. SM's own overlay keys are
          listed `sm-owned-overlay`; a host edit of one is not adopted. Only the exact declared kebab
          path is mapped: any other spelling (`maxSize`, `max_size`) is listed `undeclared-key`.
        - ⛔ **`I6`: a secret field's value is never stored.** The draft keeps its current `secretRef`. The
          field is listed `secret-not-read`, and `comparison` says `same` or `differs`: the data plane
          compared the file's value with the stored secret in memory and reports only that. ⚠️ A `differs`
          secret **is reverted by the next apply** (the generation still points at the stored one). The
          value never reaches the gateway, a response, a log or an event.
        - A `yaml`-typed field is never accepted (`yaml-field-not-accepted`); it keeps what it holds.
        - `fileBytesDifferFromRendered` is true when the file read back is not byte-identical to SM's
          rendering of the returned `generation`: the file is not rewritten until that generation is
          applied (a `manual` apply rewrites it in SM's canonical form, with no restart).
        - `unchanged` (OR-33 guard 1) with a non-empty `notAccepted` is a legitimate answer.

        **`placementId` added and required** (ratified, Step 7 sitting 2026-09-30, batch 1,
        point 18): which placement's file is read back. The config of record is per instance, so
        accepting one placement's file changes the instance's desired configuration for every placement.

        **One placement, one instance generation** (`BE-D45`): this operation names one placement but
        mints a new **instance** generation, because configuration is per instance. The instance's other
        placements are not changed and read as behind: the config ladder reports the lowest rung across
        the instance's live placements, so the instance reads as not converged until a fleet applies the
        new generation to them (`submitFleetApply`, one member per placement).

        **Agent placements** (plan 015 T3.3): a placement whose target's transport is `agent` answers `501 AGENT_OPERATION_UNSUPPORTED`: the agent path does not read a host's config file back for acceptance in v1.
      x-sm-permission: config.edit
      x-sm-permission-also: [config.overrideWarning]
      x-sm-scope: instance
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseStateVersion, placementId]
              properties:
                baseStateVersion:
                  $ref: '#/components/schemas/StateVersion'
                placementId:
                  type: string
                  format: uuid
              additionalProperties: false
      responses:
        '200':
          description: The mappable part of the observed runtime is now the desired generation (or, when `unchanged`, was already).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcceptedRuntimeConfig' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundOrUnauthorized' }
        '501':
          description: "`AGENT_OPERATION_UNSUPPORTED` — the placement's target is an agent: this operation is not available on it in v1. Nothing was read or written and no SSH connection was made."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: "`CONFLICT` — a newer `stateVersion` exists. Refetch and re-stage."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            `VALIDATION_FAILED` — the file was read and is refused. The `detail` names the reason and never a
            line of the file: the file uses a construct SM refuses to read (`anchor`, `alias`, `tag`,
            `multi-document`, `duplicate-key`, `not-a-mapping`, `empty`, `not-yaml`, `too-deep`, `too-large`),
            spells one declared path two ways (`ambiguous-key`), is `file-absent` or `file-not-readable` (not a
            regular file, or over the 1 MiB bound), or holds a value the package refuses — then the `detail`
            names the package's own field key and the rule (`max-size (BIND_TYPE)`, `ROUND_TRIP`), never the
            value. Also: the instance has no staged configuration to read the file against.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /dp/instances/{instanceId}/config/restore-runtime:
    parameters: [{ $ref: '#/components/parameters/InstanceId' }]
    post:
      tags: [designer]
      operationId: restoreRuntimeConfig
      summary: Re-assert the desired configuration onto the host, overwriting drift
      description: |
        Contracted by ruling `OR-45` (console-integration.md §5.2 row 43) and served.
        `config.apply` — ⚠️ **it writes to the host**, the opposite direction from
        `acceptRuntimeConfig`: instead of adopting the observed drift, it re-applies SM's
        current desired generation (architecture.md §6.3: "re-apply SM's version" — not the
        `persisted` rung, which on a drifted host is the drift itself) so the host
        converges back to it. Durable the moment it is admitted (`202` before any adapter
        call); progress is observed at `/apply/observe`, exactly as `submitApply`'s is.

        ⚠️ **`placementId` is required** (`BE-D23`, as `submitApply`/`rollbackApply`) — v1
        refuses instance-wide apply.

        **`strategy` added, default `manual`** (ratified, Step 7 sitting 2026-09-30, batch 1,
        point 19): a restore takes effect with the same generic, package-driven strategies as an
        apply (S0-10). `instance.restart` is required in addition to `config.apply` only when
        the selected `strategy` restarts anything. This replaces the landed (`9ec6797`) manual-only shape.

        **`rolling-no-validation` and `restart-all`** (plan 012 T2, `OR-121`) are served: they restart
        with no health gate, so each also needs **`instance.restart.overrideSafety`** (`OPS-Q6` B-1,
        Administrator and Operator), a `403` naming the verb without it. `restart-all` asserts a full
        outage, so it also needs `outageConfirmedBy` (`400` without it; the server records the session
        principal, `OPS-Q7` C-2). **Refusal order** (as the gateway runs it: the interceptor checks the
        primary verb before the body is read): `404`/`403` (`config.apply`) → `400` (body, including the missing
        `restart-all` confirmation) → `422` (`scheduled`: restore-runtime cannot be scheduled) → `403`
        (`instance.restart`, then `instance.restart.overrideSafety`) → `404` (the instance is not active, or the placement
        is not live) → the data plane's refusals (`409`/`422`) — and a refused `restart-all` mints no generation. So a
        caller without `config.apply` is answered `403` whatever the body holds.

        **One placement, one instance generation** (`BE-D45`): this operation names one placement but
        mints a new **instance** generation, because configuration is per instance. The instance's other
        placements are not changed and read as behind: the config ladder reports the lowest rung across
        the instance's live placements, so the instance reads as not converged until a fleet applies the
        new generation to them (`submitFleetApply`, one member per placement).

        **Agent placements** (plan 015 T3.3): a placement whose target's transport is `agent` answers `501 AGENT_OPERATION_UNSUPPORTED`: nothing is admitted.
      x-sm-permission: config.apply
      x-sm-permission-also: [instance.restart, instance.restart.overrideSafety]
      x-sm-scope: instance
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [placementId]
              properties:
                placementId:
                  type: string
                  format: uuid
                strategy:
                  allOf:
                    - $ref: '#/components/schemas/Strategy'
                  default: manual
                outageConfirmedBy:
                  type: string
                  description: |
                    Required when `strategy` is `restart-all` (`400` without it). **The value is ignored**
                    (`OPS-Q7` C-2): any non-blank string confirms the outage, and the server records the
                    **session principal's id** as the confirmation — never this string, which is not stored
                    and not trusted. Ignored for every other strategy.
              additionalProperties: false
      responses:
        '202':
          description: Admitted and durable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplyAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundOrUnauthorized' }
        '501':
          description: "`AGENT_OPERATION_UNSUPPORTED` — the placement's target is an agent: this operation is not available on it in v1. Nothing was read or written and no SSH connection was made."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: "`CONFLICT` — an apply or a stop is already in flight for this scope."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            `VALIDATION_FAILED` — there is no staged generation to restore (`GENERATION_NOT_STAGED`), or `strategy` is
            `scheduled`, which is not a strategy (plan 012 T7, `OR-121`): restore-runtime has no `schedule`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ── apply ─────────────────────────────────────────────────────────────────

  /dp/instances/{instanceId}/apply:
    parameters: [{ $ref: '#/components/parameters/InstanceId' }]
    post:
      tags: [apply]
      operationId: submitApply
      summary: Submit an apply
      description: |
        ⚠️ Requires `instance.restart` **in addition to** `config.apply`
        whenever the selected strategy restarts anything. Under the default
        `manual` strategy the core never restarts, so `config.apply` alone is
        enough.

        **`rolling-no-validation` and `restart-all`** (plan 012 T2, `OR-121`) are served. They restart
        with no health gate, so each **also** needs `instance.restart.overrideSafety` (`OPS-Q6` B-1,
        Administrator and Operator), a `403` naming the verb without it. `restart-all` asserts a full
        outage and needs `outageConfirmedBy` (`400` without it); the server records the **session
        principal's id**, not the string sent (`OPS-Q7` C-2). **Refusal order** (the interceptor checks
        the primary verb before the body is read): `404`/`403` (`config.apply`) → `400` (body, including the missing
        `restart-all` confirmation, and a malformed `schedule`) → `422` (`strategy: scheduled`, see below) → `403`
        (`instance.restart`, then `instance.restart.overrideSafety`) → `404` (the instance is not active, or the placement
        is not live) → the data plane's refusals (`409`/`422`). On a single placement the two behave as follows
        (`BE-D23`): both restart the one container and verify the read-back — they differ from
        `rolling-health-gated` only in having no gate, and from each other only in the confirmation.

        **Scheduling** (plan 012 T7, `OPS-Q9` Sch-2, `OPS-Q10` (c) confirmed by `OR-122` (2); amends `OR-53`/`OR-60` by
        name): add `schedule: {notBefore, notAfter}` and the change is **recorded, not admitted** — the response is `202`
        with a `scheduleId` and **no `applyId`**; nothing is held (no fence, no generation minted) while it waits. When
        `notBefore` passes, the gateway's `ScheduleFirer` **requires the submitter's verbs again** (this operation's
        `config.apply`, plus `instance.restart` / `instance.restart.overrideSafety` as the `strategy` needs), and an
        ordinary apply is admitted with the **submitter** as its actor — a submitter who has since lost a verb or been
        deactivated closes the schedule `REFUSED` (`schedule.authority.revoked`) and nothing runs. `strategy` is the
        strategy that runs when the window opens (one of the four; **the token `scheduled` is `422`**, naming the
        `schedule` field). The window is half-open, `[notBefore, notAfter)`: it never runs outside it, and a schedule
        whose window closed first is `MISSED`. `notBefore` must be in the future and at most
        `sm.dp.apply.schedule.max-lead` (default 7 days, and never more) ahead, and so must `notAfter` (`422`). The
        submitter's verbs are asked **now** too, so a
        mistake is a `403` at submit rather than a refusal at 02:00. Cancel with `cancelApplySchedule`; list with
        `listApplySchedules`.

        **Returns `202` before any adapter call.** The apply is durable the
        moment it is admitted; progress is observed, not awaited.

        ⚠️ **`placementId` is required** (owner ruling 2026-09-29 (S0-10), `OR-53`; `BE-D23`) —
        v1 refuses instance-wide apply (`ApplyExecutor.java:155-156`).
      x-sm-permission: config.apply
      x-sm-permission-also: [instance.restart, instance.restart.overrideSafety]
      x-sm-scope: instance
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [generation, strategy, placementId]
              properties:
                generation:
                  type: integer
                  format: int64
                  minimum: 1
                  description: Required for an apply, and only for an apply.
                strategy:
                  $ref: '#/components/schemas/Strategy'
                placementId:
                  type: string
                  format: uuid
                outageConfirmedBy:
                  type: string
                  description: |
                    Required when `strategy` is `restart-all` (`400` without it). **The value is ignored**
                    (`OPS-Q7` C-2): any non-blank string confirms the outage, and the server records the
                    **session principal's id** as the confirmation — never this string, which is not stored
                    and not trusted. Ignored for every other strategy.
                schedule:
                  $ref: '#/components/schemas/ScheduleWindow'
      responses:
        '202':
          description: |
            Admitted and durable (`ApplyAccepted`, with an `applyId`) — or, when the request carries a `schedule`, recorded
            and durable (`ScheduleAccepted`, with a `scheduleId` and **no `applyId`**: nothing was admitted).
          headers:
            Location:
              description: |
                Where to observe this apply (`observeApply`); for a schedule, the instance's `apply-schedules`
                (`listApplySchedules`).
              schema: { type: string }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApplyAccepted'
                  - $ref: '#/components/schemas/ScheduleAccepted'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundOrUnauthorized' }
        '409':
          description: "`CONFLICT` — an apply is already in flight for this scope."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            `VALIDATION_FAILED` — `generation` was never staged for this instance (plan 010 T6.3); `strategy` is `scheduled`,
            which is not a strategy (give the window as `schedule`); or a `schedule`'s `notBefore` is not in the future or
            its `notBefore` or `notAfter` is further ahead than the installation allows (plan 012 T7). The `detail` names the field and never the value sent.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /dp/instances/{instanceId}/apply/observe:
    parameters: [{ $ref: '#/components/parameters/InstanceId' }]
    get:
      tags: [apply]
      operationId: observeApply
      summary: Observe apply progress and backfill by stateVersion
      description: |
        The authoritative backfill path (`BE-D1`). A client that missed mesh
        notices catches up here by passing `sinceStateVersion`.

        ⚠️ `applyId` selects one request — this is what a browser polls for **stop**
        observation (owner ruling 2026-09-29 (T0.2)): `observe?applyId=` every ~2 s until
        terminal. Items are ascending by `stateVersion`.
      x-sm-permission: config.view
      x-sm-scope: instance
      parameters:
        - name: applyId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: sinceStateVersion
          in: query
          required: false
          description: Strictly newer than this version (`console-integration.md` §6.1).
          schema: { $ref: '#/components/schemas/StateVersion' }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Apply state strictly newer than `sinceStateVersion` (when given), ascending by `stateVersion`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplyObservationList' }
        '400':
          description: "`BAD_REQUEST` — `limit` outside 1..200, a negative `sinceStateVersion`, or an `applyId` / path id that is not a UUID."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundOrUnauthorized' }

  /dp/instances/{instanceId}/apply/rollback:
    parameters: [{ $ref: '#/components/parameters/InstanceId' }]
    post:
      tags: [apply]
      operationId: rollbackApply
      summary: Roll back to a prior generation
      description: |
        **Operator rollback copies forward** (ruling `OR-42`, ⚠️ names `B/D12` 🔒 — for
        architect-group ratification): a new generation takes the CHOSEN PRIOR
        generation's content, then a normal apply runs it with `BE-D22`'s pre-image
        safety net. Rollback never rewinds the generation counter — the only-goes-up
        fence stays, and this rule is the same for `dp-remote` and the agent.

        **The target is named one of two ways** — exactly one of `applyId` or `generation` must be
        given, and they are NOT equivalent:
        - `applyId`: **undo that apply**. The target is the highest eligible generation BELOW
          that apply's generation on this `placementId` (`409` if none). `applyId` must be an apply
          of this `placementId`; one of another placement, or of another instance, is `404`.
        - `generation`: copy that generation forward directly (when no `applyId` is at hand).

        ⚠️ **Eligibility:** the named target must be a generation ACTUALLY WRITTEN to
        this `placementId` — `STAGED`, `APPLIED`, or `SUPERSEDED` after having been staged, or an
        apply an operator resolved `INDETERMINATE_RESOLVED` with outcome `applied` (confirmed on
        the host; ruling `OR-108` (7), extending `OR-42`'s list). Resolved as `not_applied` is not
        a target. A generation the engine never wrote to this placement is not a rollback target and
        is refused `409`.

        **`placementId` is required** (ratified, Step 7 sitting 2026-09-30, batch 1, point 12): a
        rollback is an apply, and v1 refuses instance-wide apply (`BE-D23`) — an absent
        `placementId` would always answer an error, so the landed (`9ec6797`) optional/nullable
        shape is replaced to match `submitApply` (point 10).

        **One placement, one instance generation** (`BE-D45`): this operation names one placement but
        mints a new **instance** generation, because configuration is per instance. The instance's other
        placements are not changed and read as behind: the config ladder reports the lowest rung across
        the instance's live placements, so the instance reads as not converged until a fleet applies the
        new generation to them (`submitFleetApply`, one member per placement).

        **`rolling-no-validation` and `restart-all`** (plan 012 T2, `OR-121`) are served: each also needs
        `instance.restart.overrideSafety` (`OPS-Q6` B-1), and `restart-all` needs `outageConfirmedBy`
        (`OPS-Q7` C-2; the server records the session principal). **A refused rollback mints no
        generation:** the `400` (missing confirmation) and the `403` (a verb) are answered **before**
        the copy-forward, so a refused `restart-all` rollback leaves the instance's generation count
        unchanged. **Refusal order** (the interceptor checks the primary verb before the body is read):
        `404`/`403` (`config.rollback`) → `400` (body, including the missing `restart-all` confirmation and a malformed
        `schedule`) → `422` (`strategy: scheduled`) → `403` (`instance.restart`, then `instance.restart.overrideSafety`) →
        `404` (the instance is not active, or the placement is not live) → the data plane's refusals (`409`/`422`).

        **Scheduling** (plan 012 T7, `OPS-Q9` Sch-2): add `schedule: {notBefore, notAfter}` as for `submitApply` and the
        rollback is **recorded, not run** — `202` with a `scheduleId` and no `applyId`. ⚠️ **The copy-forward happens when the
        window opens, not at submit**: a copy at 14:00 would make old content the instance's desired head twelve hours
        early. At fire the target is resolved again (a generation that stopped being eligible closes the schedule
        `REFUSED`, `schedule.rollback.target-not-eligible`), and the new generation is minted **above whatever was staged
        meanwhile**; the schedule then records the target it resolved and the number it minted. The submitter is asked for
        `config.rollback` (and `instance.restart` / `instance.restart.overrideSafety` as the `strategy` needs) now **and
        again at fire**. A scheduled rollback of a generation that is, by then, behind a newer applied one is refused by the
        monotonicity fence as any apply is (`schedule.generation.superseded`).

        **Agent placements** (plan 015 T3.3): a placement whose target's transport is `agent` answers `501 AGENT_OPERATION_UNSUPPORTED` at admission (the rollback's `restore` step is not available to an agent), so no doomed apply request is admitted and no generation is minted.
      x-sm-permission: config.rollback
      x-sm-permission-also: [instance.restart, instance.restart.overrideSafety]
      x-sm-scope: instance
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Exactly one of `applyId` or `generation` names the rollback target.
              properties:
                applyId:
                  type: string
                  format: uuid
                  description: |
                    Undo that apply: the target is the highest eligible generation BELOW that apply's generation on this `placementId` (409 if none).
                generation:
                  type: integer
                  format: int64
                  minimum: 1
                  description: The prior generation to copy forward directly.
                placementId:
                  type: string
                  format: uuid
                strategy: { $ref: '#/components/schemas/Strategy' }
                outageConfirmedBy:
                  type: string
                  description: |
                    Required when `strategy` is `restart-all` (`400` without it). **The value is ignored**
                    (`OPS-Q7` C-2): any non-blank string confirms the outage, and the server records the
                    **session principal's id** as the confirmation — never this string, which is not stored
                    and not trusted. Ignored for every other strategy.
                schedule:
                  $ref: '#/components/schemas/ScheduleWindow'
              required: [strategy, placementId]
              oneOf:
                - required: [applyId]
                  not: { required: [generation] }
                - required: [generation]
                  not: { required: [applyId] }
              additionalProperties: false
      responses:
        '202':
          description: |
            Rollback admitted (`ApplyAccepted`) — or, when the request carries a `schedule`, recorded for later
            (`ScheduleAccepted`; nothing is copied forward or admitted yet).
          headers:
            Location:
              description: |
                Where to observe this rollback (`observeApply`); for a schedule, the instance's `apply-schedules`
                (`listApplySchedules`).
              schema: { type: string }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApplyAccepted'
                  - $ref: '#/components/schemas/ScheduleAccepted'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundOrUnauthorized' }
        '501':
          description: "`AGENT_OPERATION_UNSUPPORTED` — the placement's target is an agent: this operation is not available on it in v1. Nothing was read or written and no SSH connection was made."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: |
            Not an eligible rollback target for this placement (never written, or not
            `STAGED`/`APPLIED`/`SUPERSEDED`-after-staging/resolved-as-applied), or another apply or a stop is already
            in flight for this scope (refused before anything is copied). ⚠️ A refusal AFTER the copy
            (a race with another admission) can leave an unapplied rollback generation as the
            instance's latest; a retry reuses it (`OR-33` guard 1) rather than minting a second.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            `VALIDATION_FAILED` — `strategy` is `scheduled`, which is not a strategy (give the window as `schedule`); or a
            `schedule`'s `notBefore` is not in the future or its `notBefore` or `notAfter` is further ahead than the
            installation allows (plan 012 T7).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /dp/instances/{instanceId}/stop:
    parameters: [{ $ref: '#/components/parameters/InstanceId' }]
    post:
      tags: [apply]
      operationId: stopInstance
      summary: Stop an instance, or one of its placements
      description: |
        ⛔ **HIGH consequence, audited, idempotent** — catalog row 36,
        assigned to plan 007 Task 6b by ruling `OR-18`. Held by the
        **Administrator and the Operator**: `OR-121` (`OPS-Q11` (a), written as
        `D10` §1.9) gave the Operator `instance.stop`; it was Administrator-only
        before that.

        **Targeting, exactly as the engine executes it** (`BE-D26`): one
        placement, or the whole instance. **An absent `placementId` means
        instance-wide** and is sent to the engine as the nil-UUID sentinel
        `PlacementId.INSTANCE_WIDE`; an instance-wide stop addresses every
        placement of the instance and lands under **one** `applyId`. Two
        placements whose containers share a name are both stopped (`BE-D44`:
        the apply journal records each intent under its own placement).

        ⚠️ **Which placements** (`BE-D46`): the stop addresses every **live**
        placement, read from the placement registry and never from request
        history. A retired placement (`retirePlacement`) is not addressed, so
        retiring one never fails a later instance-wide stop, and a placement
        added by `addPlacement` is addressed by every instance-wide stop that
        **starts running after** it exists. A stop reads the live set once, when
        it starts running, so `addPlacement` is refused `409` while an
        instance-wide request is in flight, rather than being missed by it.

        ⚠️ **Authorized at the OWNING INSTANCE scope** (ruling `OR-16`).
        Placement is an operational child identity, not a grantable level, so
        a binding cannot grant `stop` for one placement only.

        ⛔ **No `generation`, no `strategy`, no `outageConfirmedBy`.** The
        engine's `ApplyCommand` rejects all three on a stop; accepting them
        would be an API that cannot execute.

        **Idempotent:** stopping an already-stopped instance returns `202` and
        still writes one audit line. ⚠️ Failures land *after* admission and
        therefore still return `202`, surfacing as a terminal `STOP_FAILED` on
        the request: `stop.no.known.placement` (instance-wide against an
        instance with no live placement) and a replica that could not be
        stopped. There is no label-collision failure: two placements that
        share a replica label are journalled separately and both stopped.
      x-sm-permission: instance.stop
      x-sm-scope: instance
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                placementId:
                  type: [string, "null"]
                  format: uuid
                  description: Absent or null means instance-wide.
              additionalProperties: false
      responses:
        '202':
          description: |
            Stop admitted and durable. ⚠️ Does not mean the workload stopped —
            observe the request for its terminal state.
          headers:
            Location:
              description: Where to observe this apply (`observeApply`).
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplyAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundOrUnauthorized' }
        '409':
          description: A stop is already in flight for this scope.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /dp/instances/{instanceId}/apply-schedules:
    parameters: [{ $ref: '#/components/parameters/InstanceId' }]
    get:
      tags: [apply]
      operationId: listApplySchedules
      summary: List an instance's scheduled applies and rollbacks
      description: |
        Plan 012 T7 (`OPS-Q9` Sch-2). `config.view` at the instance. The instance's schedules, **newest first**, of every
        state — `PENDING` (waiting for its window), `ADMITTED` (an ordinary apply was admitted: its `applyId` is observed
        at `observeApply`), `CANCELLED`, `MISSED` (its window closed first: SM was down, or a fence stayed busy until
        `notAfter`) and `REFUSED` (refused when it fired, with a closed `reason`; e.g. the submitter had lost a verb).
        History is kept; nothing is deleted.

        **A schedule is created by `submitApply` / `rollbackApply` with a `schedule` field**, not here.

        The list shows **no principal**: not the submitter, not whoever cancelled it, not the outage confirmation. Those
        are the record's audit and stay in the database.
      x-sm-permission: config.view
      x-sm-scope: instance
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: The instance's schedules, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplyScheduleList' }
        '400':
          description: "`BAD_REQUEST` — `limit` outside 1..200, or a path id that is not a UUID."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundOrUnauthorized' }

  /dp/instances/{instanceId}/apply-schedules/{scheduleId}:
    parameters:
      - { $ref: '#/components/parameters/InstanceId' }
      - name: scheduleId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [apply]
      operationId: cancelApplySchedule
      summary: Cancel a pending scheduled apply or rollback
      description: |
        Plan 012 T7 (`OPS-Q9` Sch-2). `config.apply` at the instance — **any holder, not only the submitter**, so a colleague
        can stop a change that was scheduled and whose author has gone off shift. The cancelling principal is the session's
        and is recorded.

        Only a `PENDING` schedule can be cancelled. One that was already admitted is **`409`**: an ordinary apply is then in
        the journal, and stopping it is `stopInstance`, not this (**there is no cancel-on-stage**: staging a newer
        generation does not cancel a schedule — at fire the apply is refused by the monotonicity fence if the placement has
        moved past it). Cancelling is idempotent in outcome and not in status: a second cancel is `409` (`CANCELLED` is not
        `PENDING`).
      x-sm-permission: config.apply
      x-sm-scope: instance
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      responses:
        '200':
          description: "The schedule as it reads now (`state` is `CANCELLED`)."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplySchedule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundOrUnauthorized' }
        '409':
          description: "`CONFLICT` — the schedule is no longer `PENDING`: it was admitted, missed, refused or cancelled already."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ── fleet ─────────────────────────────────────────────────────────────────
  # Transcribed from docs/design/backend/fleet-apply.md §7 (T0.0, point 6; REQ-013, OR-47,
  # OR-57). No new verb — the catalog stays closed at 38. No new ErrorCode beyond point 1's four.

  /dp/fleet-applies:
    post:
      tags: [fleet]
      operationId: submitFleetApply
      summary: Submit one apply across several instances
      description: |
        `x-sm-scope: reach` (`OR-57`): the pre-handler check is `config.apply` held at ≥ 1 grant
        anywhere in the caller's organization (else `403`); the handler then `require`s each
        member at its own instance (fleet-apply.md §2.3) — still one enforcement point, as
        declare's secondary verbs are. `instance.restart` is required in addition, in the
        handler, only when `strategy` restarts anything — and **`instance.restart.overrideSafety`**
        as well for `rolling-no-validation` and `restart-all` (plan 012 T2, `OR-121`, `OPS-Q6` B-1):
        a member refused on any of them is `FORBIDDEN` in `refusedMembers[]`, exactly as for
        `instance.restart` (`OR-65` Q-F5), so a fleet whose caller holds the verb at one instance
        and not another admits one member and refuses the other, and is `403` when every member is
        refused. `restart-all` needs `outageConfirmedBy` (`400` without it); the server records the
        **session principal's id** on the fleet and on each member's request (`OPS-Q7` C-2).

        **Refusal order:** the reach pre-check (`403`) → `400` (body, including the missing `restart-all`
        confirmation) → `422` (`scheduled`: a fleet cannot be scheduled) → the per-member verdicts (`config.apply`, `instance.restart`,
        `instance.restart.overrideSafety`, each at the member's own instance) → `403` for a fleet with refused
        members unless `proceedWithAuthorized` → the data plane's `422`s (the per-member checks, then the
        repeated-instance rule, `fleet.batch.instance.repeated`) → `409` (a placement is already reserved).

        **Fleet safety across one instance's placements** (`OPS-Q8`, `BE-D50`; plan 012 T6): batches are made of
        `members[]` in order — member `k` is in batch `k / batchSize`. For the **rolling** strategies
        (`rolling-health-gated`, `rolling-no-validation`) a batch may hold **at most one placement of any
        instance**: a batch that holds two is refused whole at submit with `422 VALIDATION_FAILED` and the
        detail `member N shares its batch with another placement of its instance (fleet.batch.instance.repeated)`
        — `N` is the member that repeats an instance already in its batch (the first such member, so for
        `[a, a, a]` in one batch `N` is `1`), and nothing is written. A member the caller was
        refused (`refusedMembers[]`) never counts. `restart-all` is exempt (its `outageConfirmedBy` covers the
        multi-placement outage, up to `batchSize` placements of an instance at once) and so is `manual`, which
        restarts nothing. Separately, a **`rolling-no-validation`** fleet waits between batches: the next batch
        opens no earlier than the data plane's settle delay (`sm.dp.fleet.no-validation.settle`, default 30 s,
        `0` disables it) after the **last** member of the current batch reached its terminal time, measured from
        the persisted request timestamps and so unchanged by a restart of the data plane. For a member whose
        request ended `APPLY_INDETERMINATE` and was given up on by the reconciler, which has no terminal time, the
        instant is the moment the reconciler gave up (its persisted `gave_up_at`), so that member holds the wait
        too (`BE-D50` rider, 2026-10-08, W4B-1). The delay is the same
        between every pair of batches, and the last batch lands the fleet without waiting. `rolling-health-gated` waits on its own gate, and `restart-all` and `manual` do not
        wait. So the safe shape for a rolling restart of an instance's placements is `batchSize: 1` (one at a
        time, at least the settle delay apart), or one placement of each instance per batch.

        **Scope of these rules: one fleet.** The repeated-instance rule and the settle delay apply **within one
        fleet** only. A placement is reserved, and an apply scope is held, per placement, so another fleet, or a
        single-placement apply (`submitApply`, `rollbackApply`, `restoreRuntimeConfig`), may restart a **different**
        placement of the same instance while this fleet runs; it is neither refused nor delayed by this fleet. Each
        action still needs its own authorization. Protection per instance across actions would be a new ruling (an
        instance-level reservation), not part of these rules.

        **By default the whole action is refused**, listing the refused members — nothing is
        applied. `proceedWithAuthorized: true` instead admits the authorized members and reports
        the rest (`OR-57`). Never a silent partial action.

        Each member is staged (`OR-34` re-projection) **before** the fleet is submitted — a
        fleet never copies forward inside the submit transaction (Global Constraints: lock
        order).

        **Rolling a generation across an instance's placements** (`BE-D45`): an apply names one
        placement, and there is no instance-wide apply. Two placements of one instance are two
        members of a fleet — `(instanceId, placementA)` and `(instanceId, placementB)` — each its own
        placement-scoped request with its own journal, batched by `batchSize` and `onFailure`
        (`halt-remaining` stops after the first failed batch). Configuration is per instance, so every
        placement receives the same generation; to give different placements different content,
        submit a `manual` fleet per placement (each member's generation is its own staged content,
        and SM does not check that members' generations are "the same change").
      x-sm-permission: config.apply
      x-sm-permission-also: [instance.restart, instance.restart.overrideSafety]
      x-sm-scope: reach
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FleetApplyRequest' }
      responses:
        '202':
          description: Admitted (or, on `proceedWithAuthorized`, partially admitted) and durable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FleetAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: |
            Two cases, both `code: FORBIDDEN` on this schema (**corrected, round-3 review,
            MINOR** — no distinct `FLEET_REFUSED` code exists; the body's `code` field is the
            same `ErrorCode.FORBIDDEN` either way): the reach pre-check (no `refusedMembers` —
            no member was ever evaluated), or the refuse-whole default (fleet-apply.md §3.2;
            ratified Q-F5 (a), with `refusedMembers[]` naming each refused member) —
            never a distinct code for an all-`NOT_FOUND` refusal.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/FleetRefused' }
        '409':
          description: |
            `CONFLICT` — a member's placement is reserved by another `RUNNING` fleet. `detail`
            names the member's ordinal, never another fleet's id.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            `VALIDATION_FAILED` — `strategy` is `scheduled`, which is not a strategy (plan 012 T7, `OR-121`; a scheduled
            fleet is out of scope in v1 — schedule a member's `submitApply` instead), answered **before** any member is
            authorized; or a semantic check failed, on authorized members only (including `fleet.batch.instance.repeated`, the
            rolling-strategy rule above). For the latter, `detail` names the member's ordinal and the failed rule,
            never a value from the body.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /dp/fleet-applies/{fleetId}:
    parameters: [{ $ref: '#/components/parameters/FleetId' }]
    get:
      tags: [fleet]
      operationId: observeFleetApply
      summary: Observe a fleet apply
      description: |
        `x-sm-scope: reach` (`OR-57`): the pre-handler check is `config.view` held at ≥ 1 grant
        anywhere in the caller's organization; members are then filtered by `config.view` at
        each member's own instance (fleet-apply.md §7, ratified Q-F6 (a)) — the filter
        applies to `refused` members too (ratified Q-F8 (a)): a refused member is shown
        only to a viewer who can see its instance. `stateVersion` is the `fleet_action` row's
        own stamp, never the maximum of the members (`OR-55`).
      x-sm-permission: config.view
      x-sm-scope: reach
      responses:
        '200':
          description: The fleet, with members filtered to what the caller can see.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FleetObservation' }
        '400':
          description: "`BAD_REQUEST` — `{fleetId}` is not a UUID."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: |
            The fleet is absent, belongs to another organization, or none of its members is
            visible to the caller (Q-F6). The three are not distinguished.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ── governance ────────────────────────────────────────────────────────────

  /dp/instances/{instanceId}/health:
    parameters: [{ $ref: '#/components/parameters/InstanceId' }]
    get:
      tags: [governance]
      operationId: getHealth
      summary: Instance health
      description: |
        ⚠️ **The S0-11 notify vocabulary, per placement** (owner ruling 2026-09-29 (S0-11),
        `OR-39`, `OR-54`) — the retired REST enum `[HEALTHY, DEGRADED, UNHEALTHY, UNKNOWN]` is
        withdrawn. `OR-39`'s "`UNKNOWN`, not `DOWN`" is now the sub-state `unreachable`. **No
        top-level `state` or `stateVersion`** — `instance.health` is placement-scoped and
        watermarked by `placementId` (`console-integration.md` §6.1's watermark table; `OR-55`:
        composed responses carry per-row versions only). The earlier "top-level = max of the
        items" rule is withdrawn.
      x-sm-permission: health.view
      x-sm-scope: instance
      responses:
        '200':
          description: Health, per placement.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '400':
          description: "`BAD_REQUEST` — `{instanceId}` is not a UUID."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundOrUnauthorized' }

  /dp/instances/{instanceId}/config-ladder:
    parameters: [{ $ref: '#/components/parameters/InstanceId' }]
    get:
      tags: [governance]
      operationId: getConfigLadder
      summary: The configuration-state ladder
      description: |
        Where the instance sits across the five rungs (ruling `OR-37`): *desired* →
        *rendered* → *persisted* → *restart-observed* → *effective-verified*. ⛔ **`I6`:
        values are never returned, only state and hashes computed over references.** Top-level
        `reached` is the lowest rung across live placements; `placements[]` gives each
        placement's own. `configHash` is **keyed** (`OR-32`) — never computed over resolved
        values.
      x-sm-permission: config.view
      x-sm-scope: instance
      responses:
        '200':
          description: The ladder.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigLadder' }
        '400':
          description: "`BAD_REQUEST` — `{instanceId}` is not a UUID."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundOrUnauthorized' }

  /dp/instances/{instanceId}/logs/{component}:
    parameters:
      - { $ref: '#/components/parameters/InstanceId' }
      - { $ref: '#/components/parameters/Component' }
    get:
      tags: [governance]
      operationId: readLogs
      summary: Read logs for one component
      description: |
        Returns a bounded page of the component's log lines: read from the host on demand (SSH placements), or from the
        log the host-local agent collected (agent placements).

        ⚠️ **SM does not redact log lines.** A line is the managed integration's own output (a stack trace
        can carry a connection string), unlike every other SM surface; `logs.read` is the only control, so
        grant it narrowly.

        An unreachable host is `200` with `availability: unavailable`, never an empty page that reads as
        "no logs".

        **Agent placements** (plan 016): a placement whose target's transport is `agent` is served from the log its host-local agent collected, through the same bounded page. An agent that cannot answer (not connected, not collecting, busy, missed deadline) is `200` with `availability: unavailable` and a fixed reason that names no host or container, exactly as an unreachable host is. The log-level operations are still `501 AGENT_OPERATION_UNSUPPORTED` on an agent placement.
      x-sm-permission: logs.read
      x-sm-scope: instance
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
        - name: placementId
          in: query
          description: Required when the instance has more than one live placement.
          schema: { type: string, format: uuid }
        - name: before
          in: query
          schema: { type: string, format: date-time }
        - name: after
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Log lines.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundOrUnauthorized' }
        '501':
          description: "`AGENT_OPERATION_UNSUPPORTED` — the placement's target is an agent: this operation is not available on it in v1. Nothing was read or written and no SSH connection was made."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /dp/instances/{instanceId}/logs/{component}/export:
    parameters:
      - { $ref: '#/components/parameters/InstanceId' }
      - { $ref: '#/components/parameters/Component' }
    get:
      tags: [governance]
      operationId: exportLogs
      summary: Download the collected log of one agent placement
      description: |
        Streams the log the host-local agent collected for one placement as a plain-text download
        (`Content-Disposition: attachment`), oldest first, one line per log line: an RFC 3339 instant, a space, the line's text.
        **Agent placements only**: a placement on an SSH target answers `501 AGENT_OPERATION_UNSUPPORTED` and nothing is read
        (there is no SSH export).

        ⚠️ **SM does not redact log lines.** A line is the managed integration's own output (a stack trace can carry a
        connection string); `logs.read` is the only control, so grant it narrowly. It is the same verb as `readLogs`.

        **Bounded.** The download stops at the data plane's `sm.dp.logs.export-max-bytes` (the size of the **download**: every
        UTF-8 byte written counts, markers included; default 50 MiB, minimum 1024) or `sm.dp.logs.export-deadline` (default 5
        minutes). At most `sm.dp.logs.export-max-concurrent` exports run at once on the data plane and
        `sm.gateway.logs.export-max-threads` on the gateway, which has its own threads, separate from the metrics export's. The
        stream is pulled as the client reads it, so a slow client slows the agent; a client that disconnects cancels the agent's
        request.

        **Refused before the first byte, as a status.** `429 RATE_LIMITED` with `reason: log-export-concurrency` (too many exports
        running, `Retry-After`), `503 SERVICE_UNAVAILABLE` with a fixed `detail` when the agent cannot serve it now (not connected, no
        log support, not collecting, busy, silent, or its connection ended) - the data plane waits up to
        `sm.dp.logs.export-start-timeout` (default 5s) for the agent's first answer so these are known before the response starts -
        `404` for an unknown or foreign instance, component or placement, `400` for an ambiguous placement and `501` for an SSH
        placement.

        **Marker lines** are for what happens after the first byte. Each starts with `# sm-export:` and its text is fixed by SM (it
        never names a host, path, container or secret): `gap <REASON> from <instant> to <instant>` where the collected log has a hole
        (`REASON` is one of `DROPPED_OLDEST`, `COLLECTION_PAUSED`, `CONTAINER_UNREADABLE`, `CAP_REDUCED`, `OVERSIZE`, or `UNKNOWN`);
        `truncated: the size limit was reached`, `truncated: the time limit was reached`, `incomplete: the agent's connection was
        lost` and `incomplete: the export ended unexpectedly`, each followed by `; resume from seq <n>`; and `complete, with gaps` as
        the last line of a finished download that had gaps. **A download that ends cleanly with no marker is complete.** After the first byte, every abnormal end (an
        error in the stream, the gateway's backstop timeout, a shutdown) writes the `incomplete` marker where the response is still writable and
        then **aborts the connection without the chunked terminator**, so the client sees a failed transfer; it never appends an error body. A line longer
        than half the size budget is cut and ends with `[line truncated]`. A resume from
        `seq <n>` may repeat up to one chunk of lines already written. An export that loses its agent sends no final chunk, so it ends at
        the deadline with a marker rather than hanging.

        Once the first byte is sent the status cannot change, which is why everything after that point is a marker line, not an HTTP error.
      x-sm-permission: logs.read
      x-sm-scope: instance
      parameters:
        - name: placementId
          in: query
          description: Required when the instance has more than one live placement.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The log as a download.
          headers:
            Content-Disposition:
              description: '`attachment; filename="logs-<instanceId>.log"`'
              schema: { type: string }
          content:
            text/plain:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundOrUnauthorized' }
        '429':
          description: "`RATE_LIMITED`, `reason: log-export-concurrency` - too many log exports are running (the data plane's cap or the gateway's own threads). Nothing was sent. Carries `Retry-After`."
          headers:
            Retry-After:
              schema: { type: integer, minimum: 1 }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ReasonedProblem' }
        '503':
          description: "`SERVICE_UNAVAILABLE` - the agent cannot serve the export now; `detail` is a fixed reason that names no host or container. Nothing was sent."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '501':
          description: "`AGENT_OPERATION_UNSUPPORTED` — the placement is on an SSH target: only agent placements can be exported. Nothing was read and no SSH connection was made."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /dp/instances/{instanceId}/log-levels/{component}:
    parameters:
      - { $ref: '#/components/parameters/InstanceId' }
      - { $ref: '#/components/parameters/Component' }
    get:
      tags: [governance]
      operationId: getLogLevel
      summary: Read the current log level
      description: |
        **Agent placements** (plan 015 T3.3): a placement whose target's transport is `agent` answers `501 AGENT_OPERATION_UNSUPPORTED`: the agent path reads no logger endpoint in v1.
      x-sm-permission: logs.read
      x-sm-scope: instance
      parameters:
        - name: placementId
          in: query
          description: Required when the instance has more than one live placement.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The level.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogLevel' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundOrUnauthorized' }
        '501':
          description: "`AGENT_OPERATION_UNSUPPORTED` — the placement's target is an agent: this operation is not available on it in v1. Nothing was read or written and no SSH connection was made."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    post:
      tags: [governance]
      operationId: setLogLevel
      summary: Change the log level
      description: |
        High-consequence and audited. **Ruled (`OR-103`, option Rd): every level change is
        configuration, and there is no live write in v1.** `mode: config` stages a new configuration
        generation whose SM-owned overlay sets `logging.level.<logger>` for the package-declared
        logger (never a request field), and admits an ordinary apply of it (`manual`: the file is
        written and nothing restarts), answering `202 ApplyAccepted`; observe it at `/apply/observe`.
        The level takes effect **when the service next restarts**; `getLogLevel` reports it as
        `configuredLevel` beside the running `liveLevel`. The same scope fence as any apply holds:
        `409 CONFLICT` while another apply or restart holds the placement. ⚠️ **A `409` that loses a race leaves
        the change staged** (W2-12): the scope is checked before anything is minted, but an apply admitted in the
        instant between that check and this request's own admission is refused after the new generation was
        committed. That generation is then the instance's latest, so `getLogLevel` reports its `configuredLevel`
        and the next apply of the instance writes it. Re-submit the change (it is answered as unchanged and
        admits the staged generation) once the other apply has finished. A designer edit staged and not yet
        applied is never carried by a level change: it is refused `409 CONFLICT` (`UNAPPLIED_DRAFT_PENDING`, W2-01),
        and needs its own `config.apply`. A package that declares no
        `logs.loggers` has nothing to change: `422 VALIDATION_FAILED`. `mode: live` answers
        `501 NOT_IMPLEMENTED` (the live write is a documented later step, not built), except on a
        direct-HTTP-only placement, where it answers `422 VALIDATION_FAILED` (`OR-43`: configuration
        only). `OR-103` decided against a journaled live-set operation, so there is no fourth
        `ApplyObservation.operation` member and no `V013` for it.

        **One placement, one instance generation** (`BE-D45`): this operation names one placement but
        mints a new **instance** generation, because configuration is per instance. The instance's other
        placements are not changed and read as behind: the config ladder reports the lowest rung across
        the instance's live placements, so the instance reads as not converged until a fleet applies the
        new generation to them (`submitFleetApply`, one member per placement).

        **Agent placements** (plan 015 T3.3): a placement whose target's transport is `agent` answers `501 AGENT_OPERATION_UNSUPPORTED` (no agent applies a log-level generation in v1); nothing is staged.
      x-sm-permission: logs.setLevel
      x-sm-scope: instance
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [placementId, level, mode]
              properties:
                placementId:
                  type: string
                  format: uuid
                level:
                  type: string
                  enum: [TRACE, DEBUG, INFO, WARN, ERROR]
                mode:
                  type: string
                  enum: [live, config]
              additionalProperties: false
      responses:
        '202':
          description: Accepted and durable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplyAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundOrUnauthorized' }
        '409':
          description: "`CONFLICT` — an apply or a stop is already in flight for this scope."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: "`VALIDATION_FAILED` — `mode: live` on a direct-HTTP-only placement (`OR-43`: P2 only); `mode: config` for a package that declares no logger support; or an instance with no staged configuration to carry the level."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '501':
          description: "`NOT_IMPLEMENTED` — `mode: live`, because no live write is built (`OR-103`); or `AGENT_OPERATION_UNSUPPORTED` — the placement's target is an agent (nothing was staged, no SSH connection was made)."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ── monitoring (plan 011 P11-1.2; console-integration.md §5.4 rows 53-66) ────
  #
  # Served by plan 011 P11-7.2 (`ENDPOINT-INVENTORY.md` §1). The wire
  # shapes are the demo's (`DemoMonitoringController`, M-Q23 `OR-78`), which match the frontend's
  # `metricsRepository.ts` and `dashboardRepository.ts`, plus the additions the monitoring rulings make.
  # The prefix `/console/v1` under the `/api` server is the same `/api/console/v1` the frontend's console
  # client calls. These are DP data, not notify entities: no response carries `stateVersion`.

  /console/v1/capabilities:
    get:
      tags: [monitoring]
      operationId: getCapabilities
      summary: What the query API serves, and the collector's health
      description: |
        Row 53. **Authentication only, at install scope** — any authenticated principal of any
        organization reads it, so nothing in it may be one organization's data except the one field
        stated below. The UI hardcodes none of the presets, caps or tiers it renders: it derives them
        from this response (`DM-D10`).

        ⚠️ **Who sees what (`I5`, `OQ-16` (a)).** `collector.state`, `runwayEnd`,
        `unfrozenClosedPartitions` and `disk.state` are install-level health. `collector.reasons` are
        counted over **the caller's organization only** (`Session.organizationId()`). ⛔ **No byte
        figure appears anywhere in this response**: the size of `sm_metrics` and of the database are
        install-wide totals across every tenant, so they are printed only by the operator command
        `MetricsPartitionMain status`, never by the API.
      x-sm-permission: none.authenticationOnly
      x-sm-scope: install
      responses:
        '200':
          description: The capabilities.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Capabilities' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /console/v1/entity-types:
    get:
      tags: [monitoring]
      operationId: listEntityTypes
      summary: The entity types whose instances can be queried
      description: |
        Row 54. `x-sm-scope: reach` (M-Q17, `OR-79`): `metrics.query` held at one or more grants in the
        caller's organization (else `403`), then only the entity types of instances the caller can reach.
      x-sm-permission: metrics.query
      x-sm-scope: reach
      responses:
        '200':
          description: The entity types.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EntityType' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /console/v1/entity-types/{entityType}/instances:
    parameters: [{ $ref: '#/components/parameters/EntityType' }]
    get:
      tags: [monitoring]
      operationId: listMetricInstances
      summary: The instances of one entity type the caller can query
      description: |
        Row 55. **Two verbs** (`console-integration.md` §5.4): `metrics.query` **and** `instance.view`.
        The reach classification carries one verb, so `x-sm-permission` names `metrics.query`, and the
        handler returns the **intersection** of the instances the caller reaches with `metrics.query` and
        with `instance.view` (`x-sm-permission-also`). A caller holding `metrics.query` but not
        `instance.view` sees none. An entity type nobody can see is an empty list, never a `404`.

        There is no paging in v1: `total` is the number of items returned.
      x-sm-permission: metrics.query
      x-sm-permission-also: [instance.view]
      x-sm-scope: reach
      parameters:
        - name: search
          in: query
          description: A case-insensitive substring of the instance label.
          schema: { type: string, maxLength: 128 }
      responses:
        '200':
          description: The instances.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricInstanceList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /console/v1/metrics/catalog:
    get:
      tags: [monitoring]
      operationId: getMetricsCatalog
      summary: The metrics the caller's reachable instances declare, with what is observed
      description: |
        Row 56. Declared metadata (the control plane, from each package version in use) composed with
        what the data plane observes. A bare array, as the demo serves it.

        ⚠️ **A plane that cannot answer is never an empty list that looks like data** (`OR-10`, P11-7.2). The
        control-plane half failing is `503 SERVICE_UNAVAILABLE`. The data-plane half failing leaves each entry's
        observed fields (`lastSeen`, `collector`) absent **and** sets that entry's required
        `observedAvailability` to `unavailable` with a `reason`; a metric nobody has ever scraped has the same
        absent fields with `live`. The array stays bare (the demo's wire shape, M-Q23), so the surface's
        availability travels on each entry rather than beside the list.

        **v1 states (`OR-75`, `OR-92` OQ-24 (b)):** `plottable`, or `unsupported` (a `histogram`, or an
        `http_json` metric that declares no `port`). `needs-typing` and `user-extension` have no v1
        producer: undeclared names are dropped and counted, never offered for typing.

        **`collector` (`OQ-17` (a)):** the reasons counted over the last 24 hours, **per placement serving
        this metric** (not per metric: the counter has no metric column). `undeclared_dropped` is never
        listed on a declared metric.
      x-sm-permission: metrics.query
      x-sm-scope: reach
      parameters:
        - name: entityType
          in: query
          description: Restrict to one entity type.
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: The catalog.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MetricCatalogEntry' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /console/v1/labels/{labelKey}/values:
    parameters: [{ $ref: '#/components/parameters/LabelKey' }]
    get:
      tags: [monitoring]
      operationId: getLabelValues
      summary: The values one label takes
      description: |
        Row 57. The v1 label allowlist is **empty** (discovery default D-10, accepted by `OR-92` OQ-22), so
        every key answers `[]`; a key is still the caller's own organization's data only.
      x-sm-permission: metrics.query
      x-sm-scope: reach
      parameters:
        - name: entityType
          in: query
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: The values, possibly none.
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /console/v1/query/range:
    post:
      tags: [monitoring]
      operationId: queryRange
      summary: One metric over a time range, for one or many instances
      description: |
        Row 58. `POST` rather than `GET`: a multi-select exceeds a sane URL (`DM-D11`). **Exactly one metric
        per request** (`DM-D23`): `metric` is a string, and a list is `400`.

        `x-sm-scope: reach` (M-Q17, `OR-79`): `metrics.query` held at one or more grants in the caller's
        organization (else `403`). The requested `instanceIds` are then **filtered by reach, silently,
        exactly like ids that do not exist**: the response never says an id was refused, and
        `partial.unavailable[]` names only instances the caller may see. **`resolution: raw`** also needs
        `metrics.forceRaw` (`x-sm-permission-also`); without it the request is `403`.

        In v1 the label allowlist is empty (D-10): any `labels` entry or `groupBy` key is `400`.

        **Refusals, by `code`:** `422 SERIES_CAP_EXCEEDED` (counts **rendered** series: `cap`, `projected`,
        `seriesBy`; `DM-D7`), `AGGREGATION_NOT_APPLICABLE` (a `histogram`, or an aggregation the type cannot
        take), `GROUP_BY_REQUIRES_AGGREGATION`, `STAT_REQUIRES_AGGREGATION`, `METRIC_UNTYPED` (no v1 trigger).
        `429 RATE_LIMITED` (`reason: query-rate`, 10 per second per session). `503` when the query API cannot
        answer: the UI degrades, it never blanks the dashboard.
      x-sm-permission: metrics.query
      x-sm-permission-also: [metrics.forceRaw]
      x-sm-scope: reach
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MetricQueryRequest' }
      responses:
        '200':
          description: The series. A bucket with no samples emits no tuple.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricQueryResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/QueryRefused' }
        '429': { $ref: '#/components/responses/MetricsRateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /console/v1/query/instant:
    post:
      tags: [monitoring]
      operationId: queryInstant
      summary: The latest point per series, for single-stat and gauge marks
      description: |
        Row 59. The same body, reach rule, refusals and rate limit as `queryRange`; the response carries the
        latest point of each series. Over more than one instance, `aggregation.acrossInstances: none` is
        `422 STAT_REQUIRES_AGGREGATION` (`DM-D22`). Row 59 carries one verb, `metrics.query`: `resolution` is
        part of the shared body and does not change which verb applies.
      x-sm-permission: metrics.query
      x-sm-scope: reach
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MetricQueryRequest' }
      responses:
        '200':
          description: The latest point per series.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricQueryResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/QueryRefused' }
        '429': { $ref: '#/components/responses/MetricsRateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /console/v1/export/range:
    get:
      tags: [monitoring]
      operationId: exportRange
      summary: Stream one metric's raw samples over a range as CSV
      description: |
        Row 60 (discovery default D-12; `console-integration.md` row 60 is a `GET`, so it can be a same-origin
        navigation download). `metrics.export` is **high-consequence** (an exfiltration channel) and every
        export is audited. Reach-filtered like the queries: ids the caller cannot see are omitted silently.

        The body is streamed, chunked, from a bound `SELECT` with the CSV encoded in the application
        (M-Q18, `OR-79`), never buffered. **Limits (M-Q22):** one export at a time per organization and two
        overall (`429 RATE_LIMITED`, `reason: export-concurrency`), a row limit (`422 EXPORT_TOO_LARGE` with
        `{projectedRows, limit}` before any byte is sent: narrow the range), and a time limit after which the
        stream is cut.
      x-sm-permission: metrics.export
      x-sm-scope: reach
      parameters:
        - name: metric
          in: query
          required: true
          schema: { $ref: '#/components/schemas/MetricName' }
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: instanceId
          in: query
          description: Repeat to select several instances. Absent selects every instance the caller can reach.
          style: form
          explode: true
          schema:
            type: array
            items: { type: string, format: uuid }
      responses:
        '200':
          description: The CSV stream.
          content:
            text/csv:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: "`EXPORT_TOO_LARGE` — carries `{projectedRows, limit}`. Nothing was sent."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ExportTooLargeProblem' }
        '429': { $ref: '#/components/responses/MetricsRateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /console/v1/metrics/catalog/{name}/type:
    parameters: [{ $ref: '#/components/parameters/MetricNamePath' }]
    post:
      tags: [monitoring]
      operationId: declareMetricType
      summary: Type an undeclared metric
      description: |
        Row 61. **A contracted refusal in v1** (M-Q6, `OR-75`): quarantine is deferred, undeclared metric
        names are dropped and counted rather than offered for typing, so this answers
        `501 NOT_IMPLEMENTED` with `reason: metric-declare-deferred` for every caller who holds the verb.
        The verb is `metric.declare` at the organization.
      x-sm-permission: metric.declare
      x-sm-scope: organization
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [metricType, unit]
              properties:
                metricType:
                  type: string
                  enum: [counter, gauge]
                unit: { type: string, minLength: 1, maxLength: 64 }
              additionalProperties: false
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '501':
          description: "`NOT_IMPLEMENTED`, `reason: metric-declare-deferred` (M-Q6, `OR-75`). Never `403`."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ReasonedProblem' }

  /console/v1/dashboards/{dashboardId}:
    parameters: [{ $ref: '#/components/parameters/DashboardId' }]
    get:
      tags: [monitoring]
      operationId: getDashboard
      summary: One instance's shared dashboard
      description: |
        Row 62. A dashboard **is** an instance's (`dashboard_id = 'db_' || instance_id`, M-Q10 `OR-78`), so
        it is authorized at that instance's scope, resolved from the path alone. It exists only for an
        instance the data plane reports active: a malformed id, an unknown id, another organization's id
        and a pending or abandoned instance are all the same `404`.

        The document is the stored shared layer plus the product-default layer **derived on every read**
        from the package version's `defaultChart` metrics that are currently collected (M-Q23, `OQ-7`).
        A default widget is hidden by an override, never deleted.
      x-sm-permission: dashboard.view
      x-sm-scope: instance
      responses:
        '200':
          description: The dashboard.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundOrUnauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /console/v1/dashboards/{dashboardId}/widgets:
    parameters: [{ $ref: '#/components/parameters/DashboardId' }]
    post:
      tags: [monitoring]
      operationId: saveWidget
      summary: Save a shared widget
      description: |
        Row 63. Stores one shared widget on this instance's dashboard and places it at the next free row.
        **One instance per saved widget** (M-Q10): `query.selector.instanceIds` is exactly this dashboard's
        instance, and `query.metric` is one the instance's package version declares. The server assigns the
        `id`; `layer` is `shared`. Unknown fields are preserved on round-trip (`DM-D6`).

        **Optimistic concurrency (required).** Send `X-SM-Dashboard-Revision` with the `revision` the dashboard
        was read at; a stale one is `409 CONFLICT`, and a missing or malformed one is `400`. A write that omitted
        it would silently overwrite a concurrent editor's, so there is no "apply to whatever is current" form.
      x-sm-permission: dashboard.edit
      x-sm-scope: instance
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - { $ref: '#/components/parameters/DashboardRevision' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WidgetSubmission' }
      responses:
        '200':
          description: The stored widget, with its server-assigned `id`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Widget' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundOrUnauthorized' }
        '409':
          description: "`CONFLICT` — the dashboard's `revision` has moved since it was read."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /console/v1/dashboards/{dashboardId}/layout:
    parameters: [{ $ref: '#/components/parameters/DashboardId' }]
    put:
      tags: [monitoring]
      operationId: setDashboardLayout
      summary: Place every widget
      description: |
        Row 64. Replaces the layout: a 12-column grid in which **every widget, product-default ones
        included, is placed exactly once**. Anything else is `400`. Concurrency as `saveWidget`.
      x-sm-permission: dashboard.edit
      x-sm-scope: instance
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - { $ref: '#/components/parameters/DashboardRevision' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [layout]
              properties:
                layout:
                  type: array
                  items: { $ref: '#/components/schemas/WidgetPlacement' }
              additionalProperties: false
      responses:
        '204': { description: Placed. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundOrUnauthorized' }
        '409':
          description: "`CONFLICT` — the dashboard's `revision` has moved since it was read."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /console/v1/dashboards/{dashboardId}/widgets/{widgetId}:
    parameters:
      - { $ref: '#/components/parameters/DashboardId' }
      - { $ref: '#/components/parameters/WidgetId' }
    patch:
      tags: [monitoring]
      operationId: setWidgetHidden
      summary: Hide or show a product-default widget
      description: |
        Row 65. Only a **product-default** widget can be hidden, and hiding stores an override: it is never
        deleted, so a later package can still improve the default and the operator's choice survives it.
        A shared widget, or an unknown widget id, is `404`. Concurrency as `saveWidget`.
      x-sm-permission: dashboard.edit
      x-sm-scope: instance
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - { $ref: '#/components/parameters/DashboardRevision' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hidden]
              properties:
                hidden: { type: boolean }
              additionalProperties: false
      responses:
        '204': { description: Set. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundOrUnauthorized' }
        '409':
          description: "`CONFLICT` — the dashboard's `revision` has moved since it was read."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /console/v1/dashboards/{dashboardId}/reset:
    parameters: [{ $ref: '#/components/parameters/DashboardId' }]
    post:
      tags: [monitoring]
      operationId: resetDashboard
      summary: Restore the product defaults
      description: |
        Row 66. Clears the hide overrides and the default placements, **keeps every shared widget**
        (`OQ-8` (a)), and returns the dashboard as it now renders. Concurrency as `saveWidget`.
      x-sm-permission: dashboard.reset
      x-sm-scope: instance
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
        - { $ref: '#/components/parameters/DashboardRevision' }
      responses:
        '200':
          description: The dashboard after the reset.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundOrUnauthorized' }
        '409':
          description: "`CONFLICT` — the dashboard's `revision` has moved since it was read."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ── agents (plan 015 T4.3; D10 rows 44-47, OR-126 A8, OR-128 (4)) ──────────────────────────────────────────────

  /cp/environments/{environmentId}/agent-enrolments:
    parameters: [{ $ref: '#/components/parameters/EnvironmentId' }]
    post:
      tags: [agents]
      operationId: issueAgentEnrolment
      summary: Issue a one-time enrolment token for a host agent (shown once)
      description: |
        Plan 015 T4.3 (`OR-126` A8, `OR-128` (4)). Requires `agent.enrol` **and** `target.create` at the environment: enrolment
        creates the agent's target (`BE-D71`), so the issuer must hold the right to create one. The environment is the path's;
        no organization or environment appears in the body (`I5`).

        The response carries the token **once** (`readOnly`): it is never returned by `getAgent` or `listAgents`, never logged,
        never audited and stored only as an unkeyed SHA-256 digest of 256 random bits (`OR-128` (9)). `targetName` is checked
        here against the organization's live target names and against the names pending tokens hold, and a taken one is
        `409 CONFLICT` (nothing written); the unique index on the target row remains the backstop at enrolment. The envelope
        (`allowedConfigRoot`, `allowedContainerPrefix`) is fixed by this call and immutable: it becomes the agent target's envelope
        and bounds every placement `OR-27` registers. A structurally malformed body (unparseable, a required field missing, a stray
        property) is `400`; an envelope value that fails its rule (`allowedConfigRoot`, `allowedContainerPrefix`) is `422`, as it is
        for `registerTarget`.

        The token's lifetime is the operator's configuration (`sm.control.agent-gateway.enrolment.token-default-validity`, 24 hours
        unless set, bounded by `token-max-validity`, 30 days unless set; `OR-136` (1)); `expiresAt` says when. The agent's
        **capabilities are fixed by the server** (`apply-config`, `lifecycle`) and are not a body field: an agent issued none would
        refuse every command. `report-only` is not issued (central item `AGW-12` is routed).

        `solutionId` (the **catalog** id, `OR-41`) and `packageVersion` (one of that solution's loaded versions) fix what the
        agent's auto-registered instances are. The entitlement and the instance quota are enforced when those instances register
        (`OR-27`, `OR-40`), not here. The call writes `agent_registration` under the audit operation `AGENT_ENROLMENT_ISSUED`
        with the issuing principal as actor.

        The request is refused `403 INSECURE_TRANSPORT`, before the body is read, unless the connection is secure, a trusted proxy
        reports `https`, or the peer is loopback: the response carries a credential (`OQ-14 (b)`).
      x-sm-permission: agent.enrol
      x-sm-permission-also: [target.create]
      x-sm-scope: environment
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IssueAgentEnrolmentRequest' }
      responses:
        '201':
          description: Issued. The token is in this response and nowhere else, ever.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentEnrolment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: "`FORBIDDEN` (a verb is not held, naming which), `CSRF_REJECTED`, `ORIGIN_REJECTED` or `INSECURE_TRANSPORT` — switch on `code`."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404': { $ref: '#/components/responses/NotFoundOrUnauthorized' }
        '409':
          description: "`CONFLICT` — the target name is taken by a live target or held by another pending token of the organization. Nothing was written."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: "`VALIDATION_FAILED` — an envelope value is outside its grammar (the detail names the field), or `solutionId` or `packageVersion` is not a solution and loaded version of this organization."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /cp/agents:
    get:
      tags: [agents]
      operationId: listAgents
      summary: Enrolled and pending agents visible to the caller
      description: |
        `agent.view`, **`x-sm-scope: reach`** (`OR-51`'s rule, as `listInstances` and `listTargets`): held at ≥ 1 grant anywhere in
        the caller's organization (else `403`), then items filtered by `agent.view` at each agent's own environment. An agent carries no
        `stateVersion` (`OR-38`; see `Agent`). Never returns a token, a digest, a
        certificate or a key. `availability` is `degraded` when the data plane's connection state cannot be read; the
        control-plane facts are still listed.
      x-sm-permission: agent.view
      x-sm-scope: reach
      responses:
        '200':
          description: Agents.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /cp/agents/{agentId}:
    parameters: [{ $ref: '#/components/parameters/AgentId' }]
    get:
      tags: [agents]
      operationId: getAgent
      summary: One agent
      description: |
        `agent.view` at the agent's own scope (`named`, resolved from its registration's environment). `404` when the agent is not
        visible at the caller's scope — absent and out of scope are not distinguished. Never returns the token or any credential
        material.
      x-sm-permission: agent.view
      x-sm-scope: named
      responses:
        '200':
          description: The agent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundOrUnauthorized' }

  /cp/agents/{agentId}/revoke:
    parameters: [{ $ref: '#/components/parameters/AgentId' }]
    post:
      tags: [agents]
      operationId: revokeAgent
      summary: Revoke an agent (sticky)
      description: |
        `agent.revoke` at the agent's own scope. Raises the agent's revocation epoch and marks the registration `revoked`
        (`AGENT_REVOKED`, the principal as actor). The data plane closes the agent's session and refuses its next connection
        within its reconciliation interval (`AGW-D19`, measured 891 ms); revocation is **sticky** — the remedy is a fresh
        enrolment, never an un-revoke. Idempotent: revoking a revoked agent is `200` and changes and audits nothing. A command in
        flight at the moment of revocation is indeterminate (`AGW-D19` item 6): revocation is a security cut-off, not a transaction.
        Revoking does not retire the agent's target: `retireTarget` does that afterwards (`AGENT_STILL_ENROLLED` until then).
        Revoking a **`pending` or `expired`** registration (a token never used) is allowed and **releases its target name** (a
        pending token holds the name; the database index cannot read the clock, so an expired unused token holds it until revoked).
      x-sm-permission: agent.revoke
      x-sm-scope: named
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      responses:
        '200':
          description: Revoked (or already revoked).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundOrUnauthorized' }

  /dp/agents/{agentId}/drain:
    parameters: [{ $ref: '#/components/parameters/AgentId' }]
    post:
      tags: [agents]
      operationId: drainAgent
      summary: Ask one agent to finish its work and reconnect
      description: |
        `agent.drain` at the agent's own scope. Sends the agent's live session a `Drain` (`AGW-D18`): the agent stops taking
        new work, finishes what it holds, answers `DrainComplete` and reconnects after the gateway-assigned `reconnect_after`
        (the gateway's `drain-reconnect-min`). `202`: the request is accepted, not complete. `409 AGENT_NOT_CONNECTED` when nothing was
        sent — the agent has no live session on the gateway, or its session is already draining (a repeated request sends nothing) —
        and nothing is queued. Only the sessions the gateway process holds are reachable (single replica, `AGW-D32`). Draining does not revoke and loses no command: an unfinished
        one is re-notified on the next session. A session that has not answered when the drain window ends is closed. Recorded as
        an `agent_event` (`gateway.drain`); the reason `operator-drain` is carried in the `Drain` notice to the agent and is not stored, so the row does not tell an operator drain from a planned-restart one.
      x-sm-permission: agent.drain
      x-sm-scope: named
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      responses:
        '202':
          description: The drain was sent to the live session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentDrainAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundOrUnauthorized' }
        '409':
          description: "`AGENT_NOT_CONNECTED` — nothing was sent: the agent has no live session here, or is already draining."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

components:

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-SM_SESSION
      description: |
        Durable, revocable, server-side session (ruling `OR-21`):
        `__Host-SM_SESSION`, `HttpOnly`, `SameSite=Strict`, `Path=/`, always
        `Secure`, no `Domain`. The companion `__Host-SM_CSRF` cookie carries the
        same attributes except that it is script-readable, so the console can
        read it from `document.cookie`. ⛔ Every authenticated mutating request
        must also carry the CSRF header `X-SM-CSRF`, whose value comes from the
        `__Host-SM_CSRF` cookie or the login/identity response; a missing or
        foreign-session token is rejected `403 CSRF_REJECTED`. Two session
        cookies in one request are refused `401 UNAUTHENTICATED`.

        **No response is cacheable:** every `/api` response carries
        `Cache-Control: no-store` and `Pragma: no-cache`.

        **Client address** (ruling `OR-20`) is the socket peer, unless that peer
        is listed in `sm.gateway.trusted-proxies`, in which case it is the
        nearest `X-Forwarded-For` entry that is not a trusted proxy. ⛔ With no
        trusted proxies configured, `X-Forwarded-For` is ignored; a non-IP entry
        makes the whole header untrusted. Every address is canonicalised to one
        spelling (so `::1` and `0:0:0:0:0:0:0:1` are the same client). Login is throttled per
        username **and** per client address; both lockouts surface as the same
        `401 AUTHENTICATION_FAILED`.

        **Every state change is audited** (ruling `OR-19`) by a database
        trigger, joined to this response by `X-Correlation-Id`.

        **Evaluation order, on every request:** origin (state-changing methods
        only) → session resolution → must-rotate gate → CSRF → authorization.
        So an unauthenticated mutation from a trusted origin is
        `401 UNAUTHENTICATED` (never a CSRF error that would reveal whether the
        session was valid), one from an untrusted origin is
        `403 ORIGIN_REJECTED`, and a must-rotate session is `428 MUST_ROTATE`.

        **Every response the application produces carries `X-Correlation-Id`**,
        generated by the server; a caller-supplied value is never adopted.
        ⚠️ Requests the servlet container rejects before the application sees
        them (a malformed request line, oversized headers) get the container's
        own response, with neither the header nor the `Problem` shape.

        **`OPTIONS` on a contracted route answers `405 METHOD_NOT_ALLOWED`**
        (the console is same-origin and does not do CORS); on an unknown route
        it is `404 NOT_FOUND`, like any other method.

        **Non-browser clients must send `Origin`** (or `Referer`) on every
        state-changing request, login included, naming a trusted origin.

  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SubOrganizationId:
      name: subOrganizationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SolutionId:
      name: solutionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EnvironmentId:
      name: environmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InstanceId:
      name: instanceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PlacementId:
      name: placementId
      in: path
      required: true
      description: A placement of the instance named in the same path (`OR-2`); never a grant level (`OR-16`).
      schema: { type: string, format: uuid }
    AgentId:
      name: agentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    FleetId:
      name: fleetId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Component:
      name: component
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    FieldKey:
      name: fieldKey
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    TargetId:
      name: targetId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ConnectionId:
      name: connectionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CsrfToken:
      name: X-SM-CSRF
      in: header
      required: true
      description: Session-bound CSRF token returned by login or identity.
      schema: { type: string, minLength: 1 }
    EntityType:
      name: entityType
      in: path
      required: true
      description: A component type of a package version, such as `cache-engine` (an entity type the caller can reach).
      schema: { type: string, minLength: 1, maxLength: 128 }
    LabelKey:
      name: labelKey
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    MetricNamePath:
      name: name
      in: path
      required: true
      schema: { $ref: '#/components/schemas/MetricName' }
    DashboardId:
      name: dashboardId
      in: path
      required: true
      description: |
        `db_` plus the instance id (M-Q10, `OR-78`; P11-2.3's `dashboard_id = 'db_' || instance_id`), so the
        authorizing instance is read from the path alone. A malformed id is `404`, exactly like an unknown one.
      schema:
        type: string
        pattern: '^db_[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    WidgetId:
      name: widgetId
      in: path
      required: true
      description: '`d_` plus 12 hex digits for a product-default widget, `w_` plus 12 for a shared one.'
      schema: { type: string, pattern: '^[dw]_[0-9a-f]{12}$' }
    DashboardRevision:
      name: X-SM-Dashboard-Revision
      in: header
      required: true
      description: |
        The `revision` the dashboard was read at (optimistic concurrency, plan 011 P11-7.1). REQUIRED on every
        dashboard write (W2-07): a stale one is `409 CONFLICT`, a missing or malformed one is `400`. There is no
        last-writer-wins form.
      schema: { type: integer, format: int64, minimum: 0 }

  responses:
    Unauthenticated:
      description: No session, or the session is expired or revoked.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: |
        `FORBIDDEN`, `CSRF_REJECTED` or `ORIGIN_REJECTED` — switch on `code`.
        `FORBIDDEN` means the verb is not held at the resource's scope.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    CsrfRejected:
      description: |
        `CSRF_REJECTED` — the token was missing or not bound to this session —
        or `ORIGIN_REJECTED`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    LoginRefused:
      description: |
        `AUTHENTICATION_FAILED`. ⚠️ Unknown organization, unknown user, wrong
        credential, inactive user and a locked-out subject return
        **byte-identical bodies apart from `correlationId`** — the difference
        must not be observable.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    MustRotate:
      description: |
        `MUST_ROTATE`. The session is valid; only identity, credential rotation
        and logout are available until the credential is rotated.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServiceUnavailable:
      description: "`SERVICE_UNAVAILABLE` — retryable: a dependency did not answer. Not a credential outcome."
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFoundOrUnauthorized:
      description: |
        ⚠️ **Deliberately indistinguishable from "exists but out of your
        scope".** Discriminating the two leaks existence across a scope
        boundary.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    BadRequest:
      description: The request failed validation.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    QueryRefused:
      description: |
        `422`, by `code`: `SERIES_CAP_EXCEEDED` (carries `{cap, projected, seriesBy}`), `AGGREGATION_NOT_APPLICABLE`,
        `GROUP_BY_REQUIRES_AGGREGATION`, `STAT_REQUIRES_AGGREGATION` or `METRIC_UNTYPED`. The `detail` names the
        rule, never a value from the request. A request body the contract's shape forbids (two metric names, an
        undeclared key) is `400`, not one of these.
      content:
        application/problem+json:
          schema:
            anyOf:
              - $ref: '#/components/schemas/SeriesCapExceededProblem'
              - $ref: '#/components/schemas/Problem'
    MetricsRateLimited:
      description: |
        `RATE_LIMITED`, with `reason` `query-rate` (10 per second per session, M-Q22) or `export-concurrency`
        (one export per organization, two overall). Carries `Retry-After`.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ReasonedProblem' }

  schemas:

    StateVersion:
      type: integer
      format: int64
      minimum: 0
      description: |
        The **only** ordering signal (`BE-D4`). Monotonic per entity. A client
        refetches when it sees a higher one and compares nothing else —
        timestamps are not ordering.

    Problem:
      type: object
      description: |
        RFC 9457 problem detail, and the ONE error shape every operation returns.
        ⚠️ **Clients switch on `code`, never on `title`, `detail` or the HTTP
        status alone** — several codes share a status (`CSRF_REJECTED`,
        `ORIGIN_REJECTED` and `FORBIDDEN` are all 403). ⛔ Never carries a
        credential, a credential hash, a session token or a CSRF token.
      required: [type, title, status, code, correlationId]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        code: { $ref: '#/components/schemas/ErrorCode' }
        correlationId:
          type: string
          format: uuid
          description: Equal to the `X-Correlation-Id` response header. Server-generated.
        detail: { type: string }
        instance: { type: string, format: uri-reference }

    ErrorCode:
      type: string
      description: |
        Stable, machine-readable error codes. Adding one is a contract change.
        - `UNAUTHENTICATED` (401) — no session, or it is expired or revoked.
        - `AUTHENTICATION_FAILED` (401) — login refused. ⚠️ Unknown user,
          wrong credential, inactive user and a locked-out subject are
          **deliberately indistinguishable**.
        - `MUST_ROTATE` (428) — authenticated, but the credential must be
          rotated first. ⚠️ Not 403: the grant is fine, the credential is
          provisional.
        - `CSRF_REJECTED` (403) — a mutation's `X-SM-CSRF` is missing or is
          not bound to this session.
        - `ORIGIN_REJECTED` (403) — a state-changing request from an origin
          outside `sm.gateway.trusted-origins`.
        - `FORBIDDEN` (403) — the verb is not held at the resource's scope.
        - `NOT_FOUND` (404) — absent, or outside every scope the caller holds;
          the two are not distinguished.
        - `BAD_REQUEST` (400) — the request failed validation.
        - `CREDENTIAL_ROTATION_REFUSED` (400) — the rotation was refused; the
          reasons are not distinguished.
        - `METHOD_NOT_ALLOWED` (405).
        - `RATE_LIMITED` (429) — the caller's own address has exceeded the
          pre-authentication rate gate on login or credential rotation
          (`OR-24`). ⚠️ It reveals only the caller's request rate, never any
          account's state; retry after `Retry-After` seconds. On the metrics routes it
          is the per-session query rate or the export concurrency limit, and the body's
          `reason` (`query-rate`, `export-concurrency`) says which.
        - `SERVICE_UNAVAILABLE` (503) — retryable; a dependency did not answer
          (credential verification capacity is exhausted; a host's config file
          could not be read). ⛔ Never a credential outcome.
        - `INTERNAL_ERROR` (500) — includes infrastructure failures. ⛔ A
          database failure during login is this, never `AUTHENTICATION_FAILED`.
        - `CONFLICT` (409) — a stale `baseStateVersion` or dashboard `revision`, an
          admission conflict (another apply already in flight for this scope), a
          placement collision, or a hierarchy name that another node already has
          (compared without regard to case, `OR-123`: a sibling's for a sub-organization
          or an environment, any organization's for an organization).
        - `VALIDATION_FAILED` (422) — a package gate, a projection mismatch, an
          undeclared key, a blocking validation, or an envelope refusal. The
          `detail` names the failed rule, never a value from the request.
        - `ENTITLEMENT_REFUSED` (409) — not entitled, the tenant's quota is
          exhausted, or a limit is set below the number of instances already
          declared. ⚠️ Not 403: §5.6 rule 3 makes 403 mean "the verb is not
          held at the resource's scope", and this is a different refusal.
        - `NOT_IMPLEMENTED` (501) — either no approved verb exists for the
          requested behaviour (§5.6 rule 5), or a verb is approved but this
          build does not yet implement it (e.g. `setLogLevel`'s `mode: live`,
          which no v1 build offers — `ENDPOINT-INVENTORY.md` §3). ⛔ Never 403 — that
          would tell the caller to ask an administrator for something no
          administrator can grant, or can grant but hasn't been built yet.
        - `SERIES_CAP_EXCEEDED` (422) — the query would render more series than the
          cap (`DM-D7`). Carries `{cap, projected, seriesBy}`.
        - `AGGREGATION_NOT_APPLICABLE` (422) — the aggregation cannot be applied to
          the metric's type (a histogram, or an average of a counter's climb).
        - `GROUP_BY_REQUIRES_AGGREGATION` (422) — `groupBy` without an aggregation
          across instances is ambiguous, so it is refused rather than interpreted.
        - `STAT_REQUIRES_AGGREGATION` (422) — a `single-stat` or `gauge` mark over
          more than one instance with no aggregation (`DM-D22`).
        - `METRIC_UNTYPED` (422) — the metric has no declared type. No v1 trigger:
          undeclared names are dropped and counted (M-Q6). A query for a metric that none of the requested instances
          declares or has a series for is therefore a `200` with an empty `series` and every authorized instance listed
          in `partial.unavailable` as `not-collecting` (W3-07).
        - `EXPORT_TOO_LARGE` (422) — the projected export exceeds the row limit.
          Carries `{projectedRows, limit}`; nothing was sent.
        - `PACKAGE_VERSION_MISMATCH` (409) — the package version's content differs
          from the one recorded when it was loaded (a digest mismatch fails closed).
        - `METRICS_PORT_CONFLICT` (409) — a declare's `placement.metricsPorts` maps
          two source ports to one host port.
        - `CREDENTIAL_INVALID` (422) — the private key of a registration does not open as an
          UNENCRYPTED SSH private key (plan 013 T1.4). The parser's own message is dropped: it can
          quote key text.
        - `HOST_KEY_NOT_OFFERED` (422) — the pinned host key is not one the host offered on a fresh
          scan; a pin is only ever a key the host itself presents (`BE-D55`).
        - `TARGET_ADDRESS_REFUSED` (422) — the host resolves to an address the data plane may not
          connect to (loopback, link-local, unspecified, multicast, or outside the operator's
          allow-list; D-REG section 7.3). Names neither the host nor the address.
        - `INSECURE_TRANSPORT` (403) — a request that carries a private key or a credential did not
          arrive over a secure channel, a trusted proxy's HTTPS, or loopback, and was refused
          BEFORE its body was read (OQ-14 (b)).
        - `CONNECTION_TEST_FAILED` (422) — `testBeforeSave: true` ran the connectivity test and it failed
          (`createConnection`/`updateConnection`, `BE-D66`). The broker's or host's own rejection reason is
          in `detail`; nothing was written either way. Secret-typed attributes are stripped from the
          request echo (`I6`).
        - `AGENT_OPERATION_UNSUPPORTED` (501) — the operation is not available on an agent placement in v1
          (logs, log level, read-config / accept-runtime, restore, rollback). Nothing was read or written and no SSH
          connection was made. Distinct from `NOT_IMPLEMENTED`, which says no approved verb exists or the build lacks
          it (plan 015 T3.3).
        - `TARGET_TRANSPORT_UNSUPPORTED` (409) — the operation addresses an SSH connection record
          (`editTargetConnection`, `rotateTargetCredential`, `testTargetConnection`) and the target's transport is
          `agent`. Nothing was read or written and no connection was made (plan 015 T3.5).
        - `AGENT_STILL_ENROLLED` (409) — `retireTarget` on an agent target whose agent has not been revoked (T3.5).
        - `TARGET_IS_AGENT_MANAGED` (409) — `addPlacement`, or a declare naming an agent target: placements on an agent
          target come only from `OR-27` discovery in v1 (T3.5).
        - `AGENT_NOT_CONNECTED` (409) — `drainAgent`: the agent has no live session (plan 015 T4.3; declared with the
          other agent codes so the enum moves once).
      enum: [UNAUTHENTICATED, AUTHENTICATION_FAILED, MUST_ROTATE, CSRF_REJECTED,
             ORIGIN_REJECTED, FORBIDDEN, NOT_FOUND, BAD_REQUEST,
             CREDENTIAL_ROTATION_REFUSED, METHOD_NOT_ALLOWED, RATE_LIMITED,
             SERVICE_UNAVAILABLE, INTERNAL_ERROR, CONFLICT, VALIDATION_FAILED,
             ENTITLEMENT_REFUSED, NOT_IMPLEMENTED, SERIES_CAP_EXCEEDED,
             AGGREGATION_NOT_APPLICABLE, GROUP_BY_REQUIRES_AGGREGATION,
             STAT_REQUIRES_AGGREGATION, METRIC_UNTYPED, EXPORT_TOO_LARGE,
             PACKAGE_VERSION_MISMATCH, METRICS_PORT_CONFLICT, CREDENTIAL_INVALID,
             HOST_KEY_NOT_OFFERED, TARGET_ADDRESS_REFUSED, INSECURE_TRANSPORT,
             CONNECTION_TEST_FAILED,
             AGENT_OPERATION_UNSUPPORTED, TARGET_TRANSPORT_UNSUPPORTED, AGENT_STILL_ENROLLED,
             TARGET_IS_AGENT_MANAGED, AGENT_NOT_CONNECTED]

    Availability:
      type: object
      description: |
        Per-surface liveness. ⚠️ **A degraded surface is declared, never
        silently empty** — the console must render the reason rather than an
        empty state. Polling is a declared degraded mode (`BE-D6`, `OR-3`),
        not the architecture.
      required: [state]
      properties:
        state:
          type: string
          enum: [live, degraded, unavailable]
        mode:
          type: string
          enum: [events, polling]
          description: How this surface is currently being kept fresh.
        reason:
          type: string
          description: Required when `state` is not `live`.
        since:
          type: string
          format: date-time

    Versioned:
      type: object
      required: [stateVersion]
      properties:
        stateVersion: { $ref: '#/components/schemas/StateVersion' }
        availability: { $ref: '#/components/schemas/Availability' }

    AvailabilityOnly:
      type: object
      description: |
        The `Versioned` envelope minus `stateVersion` (ruling `OR-38`), for responses that
        are not themselves a single notify entity, exactly as `Identity` already carries no
        `stateVersion` watermark. **Updated (round-3 review, MINOR — was stale, naming only
        four):** used by `LogPage`, `LogLevel`, `ScopeNodeList` and `TargetList` (the original
        four — no per-item version applies), and also by `SolutionList`, `InstanceList`,
        `HomeSummary`, `HomeAttention` and `ApplyObservationList` (§6.1's collection rule,
        `OR-55`: a collection carries versions **per item**, never one version for the whole
        collection) and by `Health` (a notify entity, but watermarked **per placement** — OR-39,
        OR-55 — so no single top-level version describes it either). They may still declare
        `availability` — a non-entity response can still be degraded.
      properties:
        availability: { $ref: '#/components/schemas/Availability' }

    ApplyAccepted:
      allOf:
        - $ref: '#/components/schemas/Versioned'
        - type: object
          required: [applyId]
          properties:
            applyId: { type: string, format: uuid }

    ScheduleWindow:
      type: object
      description: |
        The window a scheduled apply or rollback may be admitted in (plan 012 T7, `OPS-Q9` Sch-2): **half-open**,
        `[notBefore, notAfter)`. It never runs outside it. Both are RFC 3339 `date-time` **with an offset** (`Z` or
        `+05:30`); a date alone, a number, a local time or a year outside 0000–9999 is `400`, and so is any other key.
        `notAfter` must be after `notBefore` (`400`). `notBefore` must be in the future, and **both** `notBefore` and
        `notAfter` at most `sm.dp.apply.schedule.max-lead` ahead (`422`) — default 7 days, and **7 days is a ceiling**
        (`OR-122` (2), "at most 7 days ahead"): configuration may only lower it. The longer the lead, the staler the
        authority a schedule runs under, and it is re-checked at fire regardless; bounding `notAfter` too means a schedule
        cannot fire weeks late after an outage instead of being `MISSED`. There is no repeat: a recurring change is a
        series of schedules.
      required: [notBefore, notAfter]
      properties:
        notBefore: { type: string, format: date-time }
        notAfter: { type: string, format: date-time }
      additionalProperties: false

    ScheduleAccepted:
      type: object
      description: |
        A schedule was recorded (`submitApply` / `rollbackApply` with a `schedule`): durable, and **nothing admitted** — no
        `applyId` exists until the window opens. `scheduleId` is what `cancelApplySchedule` takes and what
        `listApplySchedules` shows.
      required: [stateVersion, scheduleId]
      properties:
        stateVersion: { $ref: '#/components/schemas/StateVersion' }
        scheduleId: { type: string, format: uuid }

    ApplySchedule:
      type: object
      description: |
        One scheduled apply or rollback. Optional properties are **omitted** when they do not apply. Carries no principal
        and no outage confirmation (the record's audit, not every viewer's).
      required: [scheduleId, placementId, operation, strategy, notBefore, notAfter, requestedAt, state, stateVersion]
      properties:
        scheduleId: { type: string, format: uuid }
        placementId: { type: string, format: uuid }
        operation: { type: string, enum: [apply, rollback] }
        generation:
          type: integer
          format: int64
          minimum: 1
          description: A scheduled apply's generation.
        rollbackApplyId:
          type: string
          format: uuid
          description: A scheduled rollback's target by apply ("undo this apply"), resolved at fire.
        rollbackGeneration:
          type: integer
          format: int64
          minimum: 1
          description: A scheduled rollback's target by generation.
        strategy:
          type: string
          enum: [manual, rolling-health-gated, restart-all, rolling-no-validation]
          description: The strategy that runs when the window opens; never `scheduled`.
        notBefore: { type: string, format: date-time }
        notAfter: { type: string, format: date-time }
        requestedAt: { type: string, format: date-time }
        state:
          type: string
          enum: [PENDING, ADMITTED, CANCELLED, MISSED, REFUSED]
          description: |
            `PENDING` is the only state with a future; the other four are terminal and never change. `ADMITTED` is the only
            state that ever ran anything.
        applyId:
          type: string
          format: uuid
          description: "`ADMITTED` only: the ordinary apply admitted at fire; observe it at `observeApply`."
        targetGeneration:
          type: integer
          format: int64
          minimum: 1
          description: "A rollback's target as resolved AT FIRE (`ADMITTED` only)."
        admittedGeneration:
          type: integer
          format: int64
          minimum: 1
          description: "`ADMITTED` only: the generation the admitted apply carries — for a rollback, the new copy-forward number."
        reason:
          type: string
          description: |
            `MISSED` and `REFUSED` only — a CLOSED classifier, never free text and never an id or a value:
            `schedule.window.missed`, `schedule.authority.revoked` (the submitter lost a verb or was deactivated),
            `schedule.target.gone`, `schedule.generation.superseded` (a generation at or above this one reached the
            placement meanwhile), `schedule.generation.not-staged`, `schedule.rollback.target-not-eligible`.
          enum:
            - schedule.window.missed
            - schedule.authority.revoked
            - schedule.target.gone
            - schedule.generation.superseded
            - schedule.generation.not-staged
            - schedule.rollback.target-not-eligible
        resolvedAt:
          type: string
          format: date-time
          description: When it left `PENDING`. Absent while pending.
        stateVersion: { $ref: '#/components/schemas/StateVersion' }

    ApplyScheduleList:
      type: object
      description: "§6.1: collections carry versions per item, never one version for the collection."
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApplySchedule' }

    Identity:
      type: object
      description: Authentication state is not a notify entity and has no stateVersion watermark.
      required: [principalId, username, source, mustRotate, permissions, organizations, csrfToken]
      properties:
        principalId: { type: string, format: uuid }
        username: { type: string }
        source:
          type: string
          enum: [local, idp]
        mustRotate:
          type: boolean
          description: While true, only identity, logout and credential rotation are authorized.
        csrfToken: { type: string }
        permissions:
          type: array
          description: |
            The caller's effective permissions, each with the scopes it is
            held at. ⚠️ The console uses this to render, never to decide —
            the server decides.
          items:
            type: object
            required: [permission, scopes]
            properties:
              permission: { type: string }
              scopes:
                type: array
                items: { $ref: '#/components/schemas/ScopePath' }
        organizations:
          type: array
          description: |
            The organizations and sub-organizations the caller can see, so the
            console can render the hierarchy at sign-in without further calls
            (ruling `OR-116`). ⚠️ **Exactly the same binding-derived visibility
            rule as `listOrganizations` and `listSubOrganizations`** — the
            server computes it through the same service, so this field never
            holds more than those two lists would return, and the two always
            agree. **Empty (`[]`)** when the caller has no bindings.

            ⚠️ **Empty while `mustRotate` is true**: the hierarchy lists answer
            `428` until the credential is rotated, and this field is populated
            only when they would answer. The identity itself is still answered;
            call `getIdentity` again after `rotateOwnCredential` to receive the
            hierarchy. Environments are not included — read them with
            `listEnvironments`. The console uses this to render, never to decide.
          items: { $ref: '#/components/schemas/VisibleOrganization' }

    VisibleOrganization:
      type: object
      description: |
        One visible organization with the sub-organizations visible beneath it
        (ruling `OR-116`). `id` and `name` carry the same values the hierarchy
        lists return for the same nodes. `name` is the display name stored with the
        node (ruling `OR-120`); it has the same shape as `ScopeNode.name`.
      required: [id, name, subOrganizations]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 100 }
        subOrganizations:
          type: array
          description: |
            Ordered by `name` compared byte-wise (the database's `C` collation,
            so the order does not depend on a locale), then by `id`.
          items: { $ref: '#/components/schemas/ScopeNode' }

    ScopePath:
      type: object
      description: |
        A position in the **five-level** grant hierarchy (ruling `OR-16`):
        Organization → Sub-organization → Environment → Solution → Instance.
        ⛔ **There is no placement component** — a placement-targeted operation
        authorizes through its owning instance.
      properties:
        organizationId: { type: string, format: uuid }
        subOrganizationId: { type: string, format: uuid }
        environmentId: { type: string, format: uuid }
        solutionId: { type: string, format: uuid }
        instanceId: { type: string, format: uuid }

    ScopeNode:
      type: object
      description: |
        A visible hierarchy node. `id` is the immutable surrogate key; `name` is
        its display name (ruling `OR-120`). The stored name is 1-100 characters
        with no control characters and not blank (a database constraint of
        `sm_control` `V015`, not a part of the ruling). Names are unique among
        siblings, and organizations across the install, compared by PostgreSQL
        `lower()` under the database's locale; not trimmed, not
        Unicode-normalised (`OR-123`, unique indexes in `V015`). A node that existed before `V015`, including
        the install organization, carries its id's text until it is renamed.
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 100 }

    ScopeNodeList:
      description: |
        `items` are ordered by `name` compared byte-wise (the database's `C`
        collation, so the order does not depend on a locale), then by `id`.
        Under that order ACME-Sub-1 precedes ACME-Sub-2 and Dev precedes Prod
        precedes UAT.
      allOf:
        - $ref: '#/components/schemas/AvailabilityOnly'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/ScopeNode' }

    NodeNameRequest:
      type: object
      description: |
        The new display name of a sub-organization, an environment or an organization. 1-100 characters once surrounding
        whitespace is stripped, not blank, no control character. No organization is named here: it is the session's (`I5`).
        Uniqueness is not a property of the request but of the tree: see the operations' `409`.
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
      additionalProperties: false

    SetEntitlementRequest:
      type: object
      required: [maxInstances]
      properties:
        maxInstances:
          type: integer
          minimum: 1
          maximum: 1000000
          description: |
            1 to 1 000 000: the table's `CHECK (max_instances > 0)` and the service's range. An entitlement is lowered,
            never removed, so `0` is not a value.
      additionalProperties: false

    Entitlement:
      type: object
      description: |
        How many instances of one solution the session's organization may declare, and how many it has declared and not
        retired. Carries no organization and no principal (who set it is audit, not shown to every `solution.view` holder).
      required: [solution, maxInstances, declaredInstances, setAt]
      properties:
        solution: { type: string }
        maxInstances: { type: integer, minimum: 1 }
        declaredInstances: { type: integer, minimum: 0, description: Instances not retired by undeclare. }
        setAt: { type: string, format: date-time }
      additionalProperties: false

    EntitlementList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Entitlement' } }
      additionalProperties: false

    PackageVersionId:
      description: |
        Mirrors `solution-package.schema.json`'s `$defs/packageVersionId` exactly, so the
        vocabulary keeps one canonical home (`UI-D14`) — an integer id is never `0` or negative,
        and a string id is never empty.
      oneOf:
        - type: integer
          minimum: 1
        - type: string
          minLength: 1

    LoadPackageResult:
      allOf:
        - $ref: '#/components/schemas/Versioned'
        - type: object
          required: [solutionId, packageVersion, signature]
          properties:
            solutionId:
              type: string
              format: uuid
              description: The catalog row's own id (`OR-41`) — never the package's declared `solution` string.
            packageVersion:
              description: |
                The loaded document's own `packageVersion` array (`solution-package.schema.json`
                §`packageVersion`) — the ordered, non-empty set of package schema versions this
                one document serves. Not a single selected version; `declareInstance` picks one
                member of this array as `declaredPackageVersion`.
              type: array
              minItems: 1
              uniqueItems: true
              items: { $ref: '#/components/schemas/PackageVersionId' }
            signature:
              type: string
              enum: [unsigned]
              description: v1 loads no signed packages. A closed placeholder, not a decision to sign later.

    Solution:
      type: object
      required: [solutionId, solution, name, packageVersions, latestPackageVersion, signature, stateVersion]
      properties:
        solutionId:
          type: string
          format: uuid
          description: The catalog row's own id (`OR-41`) — the id every other operation names as `solutionId`.
        solution:
          type: string
          description: The package's own declared `solution` string, distinct from the catalog id above.
        name: { type: string }
        packageVersions:
          type: array
          description: Every packageVersionId loaded for this solution, across every load.
          items: { $ref: '#/components/schemas/PackageVersionId' }
        latestPackageVersion:
          allOf:
            - $ref: '#/components/schemas/PackageVersionId'
          description: The most recently loaded member of `packageVersions`.
        signature:
          type: string
          enum: [unsigned]
        stateVersion: { $ref: '#/components/schemas/StateVersion' }

    SolutionList:
      allOf:
        - $ref: '#/components/schemas/AvailabilityOnly'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Solution' }

    SolutionPackageDocument:
      allOf:
        - $ref: '#/components/schemas/Versioned'
        - type: object
          required: [solutionId, packageVersion, package]
          properties:
            solutionId:
              type: string
              format: uuid
              description: The catalog row's own id (`OR-41`) — echoes the path.
            packageVersion:
              allOf:
                - $ref: '#/components/schemas/PackageVersionId'
              description: The single version this response resolved to — the request's own, or the latest when omitted.
            package:
              description: The raw document, conforming to `contracts/solution-package.schema.json`, exactly as loaded.
              type: object
              additionalProperties: true

    Target:
      type: object
      required: [targetId, name, kind, transport, ownershipScope]
      properties:
        targetId: { type: string, format: uuid }
        name: { type: string }
        kind:
          type: string
          description: |
            The MI runtime SM manages, as distinct from `transport` below (ratified, Step 7
            sitting 2026-09-30, batch 2, Q-C3 (a)).
          enum: [docker, systemd, kubernetes, vm]
        connectionId:
          type: string
          format: uuid
          readOnly: true
          description: Parent remote-server Connection. Present for target-managed deployments.
        runtime:
          type: string
          enum: [docker, systemd]
          description: Runtime adapter selected for this target.
        runtimeSettingsJson:
          type: string
          readOnly: true
          description: Non-secret runtime settings. Never contains SSH credentials.
        transport:
          type: string
          readOnly: true
          description: |
            How SM reaches this target. A legacy target uses `ssh-docker`, a linked deployment target uses `ssh`, and an
            enrolled host-agent target uses `agent`. Read-only — set once at registration or agent enrolment.
          enum: [ssh-docker, ssh, agent]
        ownershipScope:
          allOf:
            - $ref: '#/components/schemas/ScopePath'
          readOnly: true
          description: |
            Read-only. The scope `target.view`/`target.use` are filtered/checked against
            (`SM-D23`) — not the ownership tree a bound resource sits in.
        allowedConfigRoot:
          type: string
          readOnly: true
          description: |
            Read-only. Fixed at registration (T2.7) and immutable afterwards; a declare body may
            name a `configDirectory` only inside this envelope (Global Constraints, B2).
        allowedContainerPrefix:
          type: string
          readOnly: true
          description: |
            Read-only. Fixed at registration (T2.7) and immutable afterwards; a declare body may
            name a `containerName` only inside this envelope (Global Constraints, B2).
        retiredAt:
          type: string
          format: date-time
          readOnly: true
          description: Present only on a retired target (`retireTarget`'s answer); absent on every live target, and no list carries a retired one.

    TargetList:
      allOf:
        - $ref: '#/components/schemas/AvailabilityOnly'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Target' }

    User:
      type: object
      description: ⛔ Never carries a credential or a credential hash.
      required: [id, username, source, status, mustRotate, createdAt]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        source: { type: string, enum: [local] }
        status: { type: string, enum: [active, deactivated] }
        mustRotate: { type: boolean }
        createdAt: { type: string, format: date-time }
      additionalProperties: false

    UserList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/User' } }
      additionalProperties: false

    CreateUserRequest:
      type: object
      required: [username, initialCredential]
      properties:
        username: { type: string, minLength: 1, maxLength: 64 }
        initialCredential: { type: string, format: password, writeOnly: true, minLength: 12, maxLength: 1024 }
      additionalProperties: false

    Role:
      type: object
      required: [id, name, permissions]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, enum: [Administrator, Operator, Viewer] }
        permissions: { type: array, items: { type: string } }
      additionalProperties: false

    RoleList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Role' } }
      additionalProperties: false

    Assignment:
      type: object
      required: [assignmentId, principalId, roleId, scope]
      properties:
        assignmentId: { type: string, format: uuid }
        principalId: { type: string, format: uuid }
        roleId: { type: string, format: uuid }
        scope: { $ref: '#/components/schemas/ScopePath' }
      additionalProperties: false

    AssignmentList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Assignment' } }
      additionalProperties: false

    GrantAssignmentRequest:
      type: object
      required: [principalId, roleId, scope]
      properties:
        principalId: { type: string, format: uuid }
        roleId: { type: string, format: uuid }
        scope: { $ref: '#/components/schemas/ScopeRef' }
      additionalProperties: false

    ScopeRef:
      type: object
      description: |
        A scope named in a REQUEST body (an `ownershipScope`, a granted `scope`). It is `ScopePath` without
        `organizationId`: check 14 (`I5`) refuses an `organizationId` property anywhere in a request body, because the
        organization is the session's, never the client's. Send the DEEPEST id; the server derives the levels above it
        from the tree and refuses (`404`) an id outside the session's organization. An empty object is the
        organization itself. Ids that are sent together must agree. The same `ScopePath` is what responses return.
      properties:
        subOrganizationId: { type: string, format: uuid }
        environmentId: { type: string, format: uuid }
        solutionId: { type: string, format: uuid, description: Only with `environmentId` (a solution scope is an environment's solution). }
        instanceId: { type: string, format: uuid }
      additionalProperties: false

    HostKeyScanRequest:
      type: object
      required: [host, ownershipScope]
      properties:
        host: { type: string, minLength: 1, maxLength: 254, pattern: '^[A-Za-z0-9]([A-Za-z0-9.-]{0,252}[A-Za-z0-9])?$' }
        port: { type: integer, minimum: 1, maximum: 65535, default: 22 }
        ownershipScope: { $ref: '#/components/schemas/ScopeRef' }
      additionalProperties: false

    HostKeyScan:
      type: object
      required: [host, port, offered]
      properties:
        host: { type: string }
        port: { type: integer }
        offered:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/OfferedHostKey' }
      additionalProperties: false

    OfferedHostKey:
      type: object
      required: [fingerprint, algorithm]
      properties:
        fingerprint: { type: string, pattern: '^SHA256:[A-Za-z0-9+/]{20,86}={0,2}$' }
        algorithm: { type: string, description: 'The host KEY TYPE, as T1.2 reports it: for example `ssh-ed25519`, `ecdsa-sha2-nistp256`, `ssh-rsa` (not a signature algorithm such as `rsa-sha2-512`).' }
      additionalProperties: false

    TargetConnectionSpec:
      type: object
      description: |
        The connection fields of a registration. `allowedConfigRoot` and `allowedContainerPrefix` are the envelope
        (`B2`): an absolute directory below `/` with no `..`, and a container-name prefix; immutable once registered.
      required: [host, sshUser, hostKeyFingerprint, allowedConfigRoot, allowedContainerPrefix]
      properties:
        host: { type: string, pattern: '^[A-Za-z0-9]([A-Za-z0-9.-]{0,252}[A-Za-z0-9])?$' }
        port: { type: integer, minimum: 1, maximum: 65535, default: 22 }
        sshUser: { type: string, pattern: '^[A-Za-z_][A-Za-z0-9_-]{0,31}$' }
        hostKeyFingerprint: { type: string, pattern: '^SHA256:[A-Za-z0-9+/]{20,86}={0,2}$' }
        allowedConfigRoot: { type: string, pattern: '^/([A-Za-z0-9._-]+/)*[A-Za-z0-9._-]+$' }
        allowedContainerPrefix: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$' }
      additionalProperties: false

    RegisterTargetRequest:
      type: object
      description: |
        ⛔ `I6`: `privateKey` is write-only. The request's `toString` is redacted in the gateway and unknown properties
        are refused. No `organizationId` (`I5`): the organization is the session's.
      required: [name, kind, transport, ownershipScope]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        kind: { type: string, enum: [docker, systemd] }
        transport: { type: string, enum: [ssh-docker, ssh] }
        ownershipScope: { $ref: '#/components/schemas/ScopeRef' }
        connection: { $ref: '#/components/schemas/TargetConnectionSpec' }
        connectionId:
          type: string
          format: uuid
          description: Existing remote-server Connection to reuse. Mutually exclusive with connection/privateKey.
        runtime:
          type: string
          enum: [docker, systemd]
        configRoot:
          type: string
          pattern: '^/([A-Za-z0-9._-]+/)*[A-Za-z0-9._-]+$'
        containerPrefix:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$'
        serviceNamePattern:
          type: string
          minLength: 1
          maxLength: 128
        privateKey:
          type: string
          format: password
          writeOnly: true
          maxLength: 16384
          description: The key file's text (OpenSSH or PEM), UNENCRYPTED. Never echoed, logged, audited or hashed.
      additionalProperties: false

    SshDockerTargetConnection:
      type: object
      description: |
        The connection record of an `ssh-docker` target (plan 015 T3.5 renamed this from `TargetConnection`; unchanged).
        ⛔ No field, in any response, carries private-key material, its `credential_ref`, or a hash of the private key.
      required: [targetId, transport, host, port, sshUser, hostKeyFingerprint, offeredHostKeys, allowedConfigRoot, allowedContainerPrefix, credential]
      properties:
        targetId: { type: string, format: uuid }
        transport: { type: string, enum: [ssh-docker] }
        host: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        sshUser: { type: string }
        hostKeyFingerprint: { type: string, pattern: '^SHA256:[A-Za-z0-9+/]{20,86}={0,2}$', description: The pin. }
        offeredHostKeys:
          type: array
          items: { type: string }
          description: Every host-key fingerprint recorded for the host (`OR-89`), the pin included.
        allowedConfigRoot: { type: string, readOnly: true }
        allowedContainerPrefix: { type: string, readOnly: true }
        credential: { $ref: '#/components/schemas/CredentialSummary' }
      additionalProperties: false

    AgentTargetConnection:
      type: object
      description: |
        The connection record of an `agent` target (plan 015 T3.5): it names the agent and the envelope and nothing else. An agent
        target has no address, user, pin or credential, and none of those can be added (`BE-D68`'s shape CHECK).
      required: [targetId, transport, agentId, allowedConfigRoot, allowedContainerPrefix]
      properties:
        targetId: { type: string, format: uuid }
        transport: { type: string, enum: [agent] }
        agentId: { type: string, format: uuid }
        allowedConfigRoot: { type: string, readOnly: true }
        allowedContainerPrefix: { type: string, readOnly: true }
      additionalProperties: false

    TargetConnection:
      description: |
        A target's connection record, discriminated on `transport` (plan 015 T3.5). `getTargetConnection` answers the variant of
        the target it is asked about; `editTargetConnection` and `registerTarget` answer only the `ssh-docker` variant (an agent
        target cannot be registered or edited).
        ⛔ No variant carries private-key material, its `credential_ref`, or a hash of the private key.
      oneOf:
        - $ref: '#/components/schemas/SshDockerTargetConnection'
        - $ref: '#/components/schemas/AgentTargetConnection'
      discriminator:
        propertyName: transport
        mapping:
          ssh-docker: '#/components/schemas/SshDockerTargetConnection'
          agent: '#/components/schemas/AgentTargetConnection'

    IssueAgentEnrolmentRequest:
      type: object
      description: |
        No `organizationId` and no `environmentId` (`I5`; check 14): both are the session's and the path's. The grammars are
        `registerTarget`'s (`TargetConnectionSpec`, `RegisterTargetRequest.name`), so an agent target's envelope cannot be wider
        than a registered one's.
      required: [targetName, allowedConfigRoot, allowedContainerPrefix, solutionId, packageVersion]
      properties:
        targetName: { type: string, minLength: 1, maxLength: 100 }
        allowedConfigRoot: { type: string, pattern: '^/([A-Za-z0-9._-]+/)*[A-Za-z0-9._-]+$' }
        allowedContainerPrefix: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$' }
        solutionId:
          type: string
          format: uuid
          description: The **catalog** id (`OR-41`) of the solution the agent's auto-registered instances belong to.
        packageVersion:
          allOf:
            - $ref: '#/components/schemas/PackageVersionId'
          description: One member of that solution's own `packageVersions`.
      additionalProperties: false

    AgentEnrolment:
      type: object
      description: |
        What `issueAgentEnrolment` answers, once. `enrollmentToken` is `readOnly` and appears in no other response, log, audit
        row or metric (`I6`). The agent presents it with a CSR over the gateway's `Enroll` RPC (`x-sm-enrollment-token` metadata).
      required: [agentId, enrollmentToken, expiresAt, environmentId, targetName, allowedConfigRoot, allowedContainerPrefix, solutionId, packageVersion]
      properties:
        agentId: { type: string, format: uuid }
        enrollmentToken: { type: string, format: password, readOnly: true, description: Shown once. Single use. }
        expiresAt: { type: string, format: date-time }
        environmentId: { type: string, format: uuid }
        targetName: { type: string }
        allowedConfigRoot: { type: string }
        allowedContainerPrefix: { type: string }
        solutionId: { type: string, format: uuid }
        packageVersion: { $ref: '#/components/schemas/PackageVersionId' }
      additionalProperties: false

    AgentSession:
      type: object
      description: |
        Omitted from `Agent` until the agent has connected once. A fact the data plane holds, never a promise. (`draining` is not a
        state here: a drain is a gateway-process transient with no stored source.)
      required: [state, lastSeenAt]
      properties:
        state: { type: string, enum: [connected, disconnected] }
        lastSeenAt: { type: string, format: date-time }
        agentVersion: { type: string }
        leaseExpiresAt: { type: string, format: date-time, description: Only while a lease is active. }
      additionalProperties: false

    Agent:
      type: object
      description: |
        Carries no token, digest, thumbprint, certificate or key. `status`: `pending` — a token was issued and has not been
        used; `expired` — it lapsed unused; `active` — enrolled; `revoked` — sticky. **No `stateVersion`** (`OR-38`, as `Target`): an
        agent is not a notify entity, and its `session` and `expired` change with the clock and the connection, not with a versioned
        write, so a client reads it again rather than comparing a version. `availability` may be present (a non-entity response can
        still be degraded).
      required: [agentId, environmentId, targetName, status, allowedConfigRoot, allowedContainerPrefix, solutionId, packageVersion, capabilities, createdAt]
      properties:
        availability: { $ref: '#/components/schemas/Availability' }
        agentId: { type: string, format: uuid }
        environmentId: { type: string, format: uuid }
        targetId: { type: string, format: uuid, description: Present once the agent has enrolled (its target exists). }
        targetName: { type: string }
        status: { type: string, enum: [pending, expired, active, revoked] }
        allowedConfigRoot: { type: string, readOnly: true }
        allowedContainerPrefix: { type: string, readOnly: true }
        solutionId: { type: string, format: uuid }
        packageVersion: { $ref: '#/components/schemas/PackageVersionId' }
        capabilities:
          type: array
          items: { type: string, enum: [apply-config, lifecycle, report-only] }
        session: { $ref: '#/components/schemas/AgentSession' }
        createdAt: { type: string, format: date-time }
        enrolledAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time }

    AgentList:
      allOf:
        - $ref: '#/components/schemas/AvailabilityOnly'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Agent' }

    AgentDrainAccepted:
      type: object
      required: [agentId, requestedAt]
      properties:
        agentId: { type: string, format: uuid }
        requestedAt: { type: string, format: date-time }
      additionalProperties: false

    CredentialSummary:
      type: object
      required: [present]
      properties:
        present: { type: boolean }
        publicKeyFingerprint:
          type: string
          description: |
            The SHA-256 fingerprint of the stored key's PUBLIC half (what `ssh-keygen -l` prints for the `.pub`), so the
            user can compare it with `authorized_keys`. Absent for a key registered before it was recorded.
        setAt: { type: string, format: date-time }
      additionalProperties: false

    TargetDetail:
      description: A `Target` and its `ssh-docker` connection record. Only `registerTarget` returns it, and it can create only an `ssh-docker` target.
      allOf:
        - { $ref: '#/components/schemas/Target' }
        - type: object
          properties:
            connection: { $ref: '#/components/schemas/SshDockerTargetConnection' }

    EditTargetConnectionRequest:
      type: object
      description: |
        The fields `editTargetConnection` may change; at least one is required. `allowedConfigRoot` and
        `allowedContainerPrefix` (the envelope, immutable, `OR-52`), a private key, an organization and a target id are not
        properties, and a body that names one is refused (`400`). No `organizationId` (`I5`).
      minProperties: 1
      properties:
        host: { type: string, minLength: 1, maxLength: 254, pattern: '^[A-Za-z0-9]([A-Za-z0-9.-]{0,252}[A-Za-z0-9])?$' }
        port: { type: integer, minimum: 1, maximum: 65535 }
        sshUser: { type: string, pattern: '^[A-Za-z_][A-Za-z0-9_-]{0,31}$' }
        hostKeyFingerprint: { type: string, pattern: '^SHA256:[A-Za-z0-9+/]{20,86}={0,2}$' }
      additionalProperties: false

    UpdateDeploymentTargetRequest:
      type: object
      description: |
        Non-secret metadata for a linked deployment target. `connectionId` and `runtime` must equal the existing target
        values; runtime-specific fields are mutually exclusive. No organization id, SSH host, private key or credential
        is accepted.
      required: [name, connectionId, runtime, configRoot]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        connectionId: { type: string, format: uuid }
        runtime: { type: string, enum: [docker, systemd] }
        configRoot: { type: string, minLength: 1, pattern: '^/.*$' }
        containerPrefix: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$' }
        serviceNamePattern: { type: string, minLength: 1, maxLength: 128 }
      additionalProperties: false

    RotateTargetCredentialRequest:
      type: object
      description: |
        ⛔ `I6`: `privateKey` is write-only. The request's `toString` is redacted in the gateway and unknown properties are
        refused.
      required: [privateKey]
      properties:
        privateKey:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 16384
          description: The key file's text (OpenSSH or PEM), UNENCRYPTED. Never echoed, logged, audited or hashed.
      additionalProperties: false

    RotatedCredential:
      type: object
      required: [credential]
      properties:
        credential: { $ref: '#/components/schemas/CredentialSummary' }
      additionalProperties: false

    TargetConnectionDocker:
      type: object
      required: [available]
      properties:
        available: { type: boolean, description: "`docker version` ran and answered (exit status 0 with a plain version)." }
        serverVersion: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._+~-]{0,63}$', description: The daemon's version; only when it answered. }
      additionalProperties: false

    TargetConnectionTest:
      type: object
      description: |
        One flag per step of `testTargetConnection`. The steps are cumulative: `authenticated` implies `hostKeyPinned`, and
        `docker.available` implies `authenticated`. Every failure is a result, never an error.
      required: [hostKeyPinned, authenticated, docker, checkedAt]
      properties:
        hostKeyPinned: { type: boolean, description: "The host presented the pinned host key. The pin may be the fingerprint of any host key the host offers (Ed25519, ECDSA or RSA); the connection finds which. False also when the host was not reached, so a false result does not confirm a different key was seen." }
        authenticated: { type: boolean, description: The stored key was accepted. }
        docker: { $ref: '#/components/schemas/TargetConnectionDocker' }
        checkedAt: { type: string, format: date-time }
      additionalProperties: false

    # ── connections (plan 013 T1, `BE-D66`, `OR-130`) ───────────────────────────

    ConnectionTypeAttribute:
      type: object
      description: |
        Mirrors `contracts/connection-types/descriptor.schema.json`'s `attribute` `$def` exactly, field
        for field — this is a structural mirror, not a reshaping, so that `contracts/connection-types/*.json`
        serves verbatim: `remote-server.json` already uses `discriminator` and `when` on its
        `authMethod`/`password`/`privateKey`/`passphrase` attributes, so both are load-bearing, not
        theoretical.
      required: [key, type]
      properties:
        key: { type: string, pattern: '^[a-zA-Z][a-zA-Z0-9]*$' }
        type: { type: string, enum: [string, int, bool, enum, duration, secret] }
        options:
          type: array
          items: { type: [string, number, boolean] }
        default: { type: [string, number, boolean, 'null'] }
        required: { type: boolean }
        secret:
          type: boolean
          description: "⛔ `I6`: true if and only if `type: secret`."
        discriminator:
          type: boolean
          description: Marks the attribute that selects which `when`-gated attributes apply (e.g. `remote-server.json`'s `authMethod`).
        when:
          type: object
          description: |
            Present only when this attribute applies conditionally, keyed by the discriminator
            attribute's key. Matches `remote-server.json`'s `{"authMethod": "basic"}` shape.
          additionalProperties: { type: [string, number, boolean] }
        min: { type: number }
        max: { type: number }
        pattern: { type: string }
        ui:
          type: object
          description: Nested exactly as the real descriptor schema nests it — never flattened onto the attribute.
          properties:
            label: { type: string }
            helperText: { type: string }
            order: { type: integer }
            listColumn: { type: boolean }
          additionalProperties: false
      additionalProperties: false

    ConnectionType:
      type: object
      description: |
        A connection type descriptor, SM-owned and never package-supplied (`UI-D27`) — served
        verbatim from `contracts/connection-types/*.json`.
      required: [connectionType, label, descriptorVersion, attributes]
      properties:
        connectionType: { type: string, enum: [solace-broker, remote-server] }
        label: { type: string, minLength: 1 }
        descriptorVersion: { type: integer, minimum: 1 }
        attributes:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ConnectionTypeAttribute' }
      additionalProperties: false

    Connection:
      type: object
      description: |
        ⛔ `I6`: `attributes` never carries a secret-typed value — a secret attribute is present
        here only as `{ "set": true }`-style redaction at the gateway (the exact redacted shape is
        the server's; a client never receives the value it wrote).
      required: [connectionId, name, connectionType, ownershipScope, attributes, active, usedByCount]
      properties:
        connectionId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 100 }
        connectionType: { type: string, enum: [solace-broker, remote-server], readOnly: true }
        ownershipScope:
          allOf:
            - $ref: '#/components/schemas/ScopePath'
          readOnly: true
          description: Read-only. The scope `connection.view`/`connection.edit` are filtered/checked against.
        attributes:
          type: object
          description: Non-secret attributes at their current values; secret attributes are redacted (`I6`).
          additionalProperties: true
        active: { type: boolean, description: "False after `deactivateConnection`." }
        usedByCount:
          type: integer
          minimum: 0
          description: How many live records reference this connection. `deleteConnection` refuses (`409`) while this is greater than zero.
        createdAt: { type: string, format: date-time, readOnly: true }
        updatedAt: { type: string, format: date-time, readOnly: true }
      additionalProperties: false

    ConnectionList:
      allOf:
        - $ref: '#/components/schemas/AvailabilityOnly'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Connection' }

    CreateConnectionRequest:
      type: object
      description: |
        No `organizationId` (`I5`): the organization is the session's. `testBeforeSave: true` runs the
        connectivity test before anything is written (`BE-D66`); a failed test writes nothing (`422
        CONNECTION_TEST_FAILED`).
      required: [name, connectionType, ownershipScope, attributes]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        connectionType: { type: string, enum: [solace-broker, remote-server] }
        ownershipScope: { $ref: '#/components/schemas/ScopeRef' }
        attributes:
          type: object
          description: Keyed by the connection type's descriptor attributes; secret-typed values are write-only, never echoed (`I6`).
          additionalProperties: true
        testBeforeSave:
          type: boolean
          default: false
          description: The single flag backing both "Save" and "Test & Save" — there is no separate test-then-save round trip.
      additionalProperties: false

    UpdateConnectionRequest:
      type: object
      description: |
        The fields `updateConnection` may change; at least one is required. `connectionType`, an organization
        and a connection id are not properties, and a body that names one is refused (`400`). No
        `organizationId` (`I5`). `testBeforeSave: true` tests the merged attributes before writing (`BE-D66`);
        a failed test writes nothing (`422 CONNECTION_TEST_FAILED`).
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        attributes:
          type: object
          description: Merged new-over-existing; secret-typed values are write-only, never echoed (`I6`).
          additionalProperties: true
        testBeforeSave:
          type: boolean
          default: false
          description: The single flag backing both "Save" and "Test & Save" — there is no separate test-then-save round trip.
      additionalProperties: false

    Acquisition:
      type: object
      description: |
        How the DP acquires an instance's health and metrics — **chosen per instance by the
        operator at declare** (owner rulings M-Q2 and M-Q2b, 2026-09-29), persisted at instance
        level, and followed by both the health poller and the metrics collector (one setting,
        one path). There is **no automatic fallback** between the two modes. **It carries no
        host** (`OR-82`, 2026-10-05): the address is never browser-supplied.

        - `direct-http` — the DP reaches the **target's registered address** (fixed by the
          operator command that registered the target) at the placement's host-side
          `healthPort` and the package-declared health path, directly over HTTP. Offered first.
          A re-target uses the new target's address automatically. Accepted residual (M-Q2): a
          Cache's port also serves its unauthenticated `POST /api/cache`, so the runbook tells
          operators to restrict it to the DP's source address.
        - `via-ssh` — the DP runs a curl against the host's loopback over the target's SSH
          session.
        - `agent` — an enrolled host agent reports health and metrics itself (plan 015 T4.3; `AcquisitionMode.AGENT`).
          **Never chosen by an operator**: it is the mode of an instance the agent registered from discovery (`OR-27`), so it
          appears in an `Instance` read, and a declare naming it is `422 VALIDATION_FAILED`. The DP polls nothing for it.

        The closed vocabulary lives here, in one schema, referenced by the declare body and by
        `Instance` — never copied (`UI-D14`'s principle; `validate-openapi.py` check 16).
      required: [mode]
      properties:
        mode:
          type: string
          enum: [direct-http, via-ssh, agent]
      additionalProperties: false

    DeploymentMode:
      type: string
      description: |
        How an instance is deployed (integration plan 014), chosen per instance at declare and
        persisted at instance level. `dp-remote` — the DP acts on the host over a remote-server
        Connection (or, for instances declared before plan 014, a Target). `host-local` (an agent on
        the runtime host) and `federated` (an agent-managed external runtime) are **reserved**: refused
        at declare until their agent contracts land.
      enum: [dp-remote, host-local, federated]
      default: dp-remote

    Instance:
      allOf:
        - $ref: '#/components/schemas/Versioned'
        - type: object
          required: [instanceId, name, solutionId, environmentId, declaredPackageVersion, acquisition]
          properties:
            instanceId: { type: string, format: uuid }
            name: { type: string }
            solutionId:
              type: string
              format: uuid
              description: The **catalog** id (`OR-41`).
            environmentId: { type: string, format: uuid }
            declaredPackageVersion:
              allOf:
                - $ref: '#/components/schemas/PackageVersionId'
              description: One member of the solution's own `packageVersions`.
            role:
              type: string
              minLength: 1
              description: Package-defined instance role, when applicable.
            acquisition:
              allOf:
                - $ref: '#/components/schemas/Acquisition'
              description: |
                The instance's acquisition mode, chosen at declare (M-Q2) and persisted at
                instance level (M-Q2b) — one setting for health polling and metrics. **Mode
                only: no host or address is returned** (`OR-82`; in `direct-http` the DP polls
                the target's registered address). Read-only here: changing it is a future operation.
            placements:
              type: array
              description: |
                Operational children of this instance. ⚠️ Present in the API by
                design (`OR-2`); ⛔ **not a grant level** (`OR-16`).
              items:
                type: object
                required: [placementId, containerName, probeStrength]
                description: |
                  Exactly one of `targetId` (a legacy Target) and `connectionId` (a remote-server
                  Connection, integration plan 014) is present.
                properties:
                  placementId: { type: string, format: uuid }
                  targetId: { type: string, format: uuid }
                  connectionId: { type: string, format: uuid }
                  containerName: { type: string }
                  probeStrength:
                    type: string
                    description: |
                      The placement's copy of the package's **declared** health-probe strength
                      (`T0.1a`) — a declaration, never a proof (point 26). Mirrors
                      `solution-package.schema.json`'s
                      `$defs/health/properties/probe/properties/strength` enum plus `none`,
                      pinned by `validate-openapi.py` check 15.
                    enum: [readiness, liveness, none]

    PlacementRetirement:
      type: object
      required: [placementId, workload, instance]
      description: |
        What `retirePlacement` answers: the placement that was retired, what became of its workload, and the instance as it
        reads now.
      properties:
        placementId: { type: string, format: uuid }
        workload:
          type: string
          enum: [left-running]
          description: |
            Always `left-running`: retirement writes no host, so the container keeps running, now unmanaged by SM
            (`BE-D53`).
        instance:
          allOf:
            - $ref: '#/components/schemas/Instance'
          description: The instance after the retirement — its remaining live placements and a fresh `stateVersion`.
    InstanceRetirement:
      allOf:
        - $ref: '#/components/schemas/Versioned'
        - type: object
          required: [instanceId, retiredAt, workload, placements]
          description: |
            What `undeclareInstance` answers (`BE-D49`): which instance was released, when, what became of its workload, and
            each placement with the last health state SM had persisted. `stateVersion` is the instance's own stamp after the
            data plane's final write (`OR-35`). Carries no host, no container name and no reference.
          properties:
            instanceId: { type: string, format: uuid }
            retiredAt:
              type: string
              format: date-time
              description: When the data plane finished the undeclare (the record's `completed_at`).
            workload:
              type: string
              enum: [left-running]
              description: |
                Always `left-running`: undeclare writes no host, so the container keeps running, now unmanaged by SM
                (`BE-D49`). The only value, as `?workload=leave-running` is the only value the request takes.
            placements:
              type: array
              description: The placements that were live at the time, in id order.
              items:
                type: object
                required: [placementId, lastHealth]
                properties:
                  placementId: { type: string, format: uuid }
                  lastHealth:
                    type: [string, 'null']
                    description: |
                      The health state the poller had last persisted for the placement (`getHealth`'s `state` vocabulary), or
                      `null` when it was never probed.
                    enum: [GREEN, RED, RESTART_EXPECTED, INACTIVE_REPLICA, NOT_APPLICABLE,
                           unreachable, not_exposed, missing, bootstrap, null]
    InstanceList:
      allOf:
        - $ref: '#/components/schemas/AvailabilityOnly'
        - type: object
          description: |
            §6.1's collection rule (`OR-55`): each `Instance` item carries its own
            `stateVersion` (it is `Versioned`); the collection itself carries none.
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Instance' }

    HomeSummary:
      allOf:
        - $ref: '#/components/schemas/AvailabilityOnly'
        - type: object
          description: |
            `solutions` is every catalog solution, exactly as `listSolutions` returns it
            (`x-sm-scope: reach`, ruling `OR-51`: `solution.view` held at ≥ 1 grant anywhere in
            the caller's organization gates the whole response — else `403` — not a per-row
            filter). No top-level `stateVersion` — an aggregate belonging to no single
            entity (ruling `OR-38`); each solution row carries its own (`OR-55`: composed
            responses carry per-row versions only, never one version for the whole collection).
            **Corrected (round-3 review, MAJOR):** a catalog solution row has no scope path of
            its own, so `instanceCount` and `byHealth` are *not* filtered "at the row's scope" —
            each is a count over that solution's instances, evaluated **per instance** at that
            instance's own scope path; `instanceCount` may be `0` for a solution with no instance
            the caller can see. See `instanceCount`/`byHealth` below and
            [`ENDPOINT-INVENTORY.md`](ENDPOINT-INVENTORY.md) §7.
          required: [solutions]
          properties:
            solutions:
              type: array
              items:
                type: object
                required: [solutionId, name, instanceCount, stateVersion]
                properties:
                  solutionId: { type: string, format: uuid }
                  name: { type: string }
                  instanceCount:
                    type: integer
                    minimum: 0
                    description: |
                      Count of this solution's instances filtered *per instance* by
                      `instance.view` at each instance's own scope path (downward reach, as
                      `listInstances`, point 9) — never the row's own scope, which a catalog
                      row does not have (Q-C1(b), MAJOR-corrected).
                  byHealth:
                    type: object
                    description: |
                      Instance count per health state. Vocabulary: the S0-11 notify vocabulary
                      (ruling `OR-39`/`OR-54`) — the full nine-value set `Health.placements[]`
                      uses (five rollup keys plus the four `NOTFOUND` sub-states), **widened**
                      from `StatusView.healthRollup`'s five (round-3 review, MINOR) so an
                      instance whose only signal is `unreachable` still lands in a bucket
                      instead of having none defined; disclosed as a widening in
                      [`ENDPOINT-INVENTORY.md`](ENDPOINT-INVENTORY.md)
                      §7. Filter: counted **per instance** (not per placement) at that instance's
                      own scope path, among only the instances where `health.view` is *also* held
                      there (ratified, Step 7 sitting 2026-09-30, batch 2, Q-C1 (b) as corrected — this
                      operation does not itself require `health.view`). An instance outside `health.view`'s
                      reach still counts toward `instanceCount` but contributes to no `byHealth`
                      bucket; a solution none of whose visible instances clear `health.view`
                      carries no `byHealth` key at all, never a zeroed one.

                      **Per-instance rollup** (ratified, Step 7 sitting 2026-09-30, batch 2,
                      Q-C1-rollup): an
                      instance's `Health.placements[]` can disagree (v1's `active_standby`
                      topology routinely does — one placement `GREEN`, the other
                      `INACTIVE_REPLICA`), so each instance is counted into one bucket by
                      `project.ts`'s `healthRollupOf` **literally**, raised from replica to
                      placement scope and extended only by inserting the four `NOTFOUND`
                      sub-states: `NOT_APPLICABLE` when no probe is declared; otherwise the first
                      match of — any `RED` → `RED`; any `missing` → `missing`; any `unreachable`
                      → `unreachable`; any `not_exposed` → `not_exposed`; any `RESTART_EXPECTED`
                      → `RESTART_EXPECTED`; any `bootstrap` → `bootstrap`; **every** placement
                      `INACTIVE_REPLICA` → `INACTIVE_REPLICA`; else `GREEN`. So a healthy
                      `active_standby` pair (`GREEN` + `INACTIVE_REPLICA`) counts `GREEN`, exactly
                      as `healthRollupOf` rolls it up. The order of the inserted sub-states is the
                      ruling's own (tone: `err` before `warn` before `info`,
                      [`STATE-VOCABULARY.md`](../../docs/design/frontend/reference/STATE-VOCABULARY.md)
                      §2). Recorded in [`ENDPOINT-INVENTORY.md`](ENDPOINT-INVENTORY.md) §7.
                    propertyNames:
                      enum: [GREEN, RED, RESTART_EXPECTED, INACTIVE_REPLICA, NOT_APPLICABLE,
                             unreachable, not_exposed, missing, bootstrap]
                    additionalProperties:
                      type: integer
                      minimum: 0
                  stateVersion:
                    $ref: '#/components/schemas/StateVersion'
                    description: |
                      Versions this row's IDENTITY only (the catalog entry: `solutionId`, `name`), as `listSolutions`'s
                      row does. It does NOT change when `instanceCount` or `byHealth` change, because those are counts
                      over other entities' state (instances and placement health), filtered to the caller. A client must
                      therefore never use it to decide that the counts are unchanged: the console re-reads the summary
                      whole (ruling `OR-108` (3)).

    HomeAttention:
      allOf:
        - $ref: '#/components/schemas/AvailabilityOnly'
        - type: object
          description: |
            Instances needing attention, filtered to the caller's scopes (`x-sm-scope: reach`,
            ruling `OR-51`). A filtered collection, not itself an entity — no top-level
            `stateVersion` (ruling `OR-38`); each item carries its own (§6.1's collection rule;
            ratified, Step 7 sitting 2026-09-30, batch 1, point 16 — replacing the landed
            no-version description).
          required: [items]
          properties:
            items:
              type: array
              items:
                type: object
                description: |
                  Each `reason` is filtered by the verb that guards its source (ratified, Step 7
                  sitting 2026-09-30, batch 2, Q-C2 (a)): `health` → `health.view`; `apply-indeterminate` and
                  `config-diverged` → `config.view`.
                required: [instanceId, reason, stateVersion]
                properties:
                  instanceId: { type: string, format: uuid }
                  placementId: { type: string, format: uuid }
                  reason:
                    type: string
                    enum: [health, apply-indeterminate, config-diverged]
                  state:
                    type: string
                    description: |
                      Present when `reason` is `health` — the S0-11 notify vocabulary (ruling
                      `OR-39`), never the retired REST enum.
                    enum: [GREEN, RED, RESTART_EXPECTED, INACTIVE_REPLICA, NOT_APPLICABLE,
                           unreachable, not_exposed, missing, bootstrap]
                  stateVersion: { $ref: '#/components/schemas/StateVersion' }

    Designer:
      allOf:
        - $ref: '#/components/schemas/Versioned'
        - type: object
          description: |
            `OR-34`: the Java `project()` port's output, wrapped with the entity envelope and
            the generation it was projected from.
          required: [viewModel, layout]
          properties:
            generation:
              type: [integer, "null"]
              format: int64
              description: Null before any generation exists for this instance.
            role:
              type: string
              minLength: 1
              description: Persisted package-defined instance role, when applicable.
            viewModel: { $ref: '#/components/schemas/ViewModel' }
            layout:
              type: object
              description: |
                `OR-96`: the canvas layout last saved, instance key to position, from the data plane's per-instance
                presentation record. Outside `config_generation`, its history and its hash; never in `viewModel`.
                `{}` when none was saved.
              additionalProperties:
                type: object
                required: [x, y]
                additionalProperties: false
                properties:
                  x: { type: number }
                  y: { type: number }

    ViewModel:
      type: object
      description: |
        The config-driven designer view model (`UI-D15`), transcribed from
        `contracts/view-models/src/types.ts:246-258` and the types it references (`OR-34`).
        `validate-openapi.py` check (ii) validates every `contracts/view-models/fixtures/viewmodel/*.json`
        fixture's `expected` object against this schema, so the two cannot drift.
      required: [engineVersion, solution, packageVersion, components, rendered, excluded, metrics, status, diagnostics]
      additionalProperties: false
      properties:
        engineVersion:
          type: integer
          description: Bumped when projection semantics change, so a silent behavioural drift is detectable.
        solution: { type: string }
        packageVersion:
          oneOf:
            - $ref: '#/components/schemas/PackageVersionId'
            - type: "null"
          description: Mirrors `types.ts`'s `PackageVersionId | null` exactly (`OR-34`).
        components:
          type: array
          items: { $ref: '#/components/schemas/ComponentView' }
        rendered:
          type: array
          description: "FE-D17: the save/diff/hash payload. Emitted, never re-derived by consumers."
          items: { $ref: '#/components/schemas/RenderedEntry' }
        excluded:
          type: array
          items: { $ref: '#/components/schemas/ExcludedEntry' }
        metrics:
          type: array
          items: { $ref: '#/components/schemas/MetricView' }
        status: { $ref: '#/components/schemas/StatusView' }
        diagnostics:
          type: array
          items: { $ref: '#/components/schemas/Diagnostic' }

    ComponentView:
      type: object
      required: [instanceKey, type, sections]
      additionalProperties: false
      properties:
        instanceKey: { type: string }
        type: { type: string }
        role:
          type: string
          minLength: 1
          description: Optional package-defined component role.
        sections:
          type: array
          items: { $ref: '#/components/schemas/SectionView' }

    SectionView:
      type: object
      required: [title, order, fields, actions, allVisibleFieldsAdvanced]
      additionalProperties: false
      properties:
        title: { type: string }
        order: { type: integer }
        fields:
          type: array
          items: { $ref: '#/components/schemas/FieldView' }
        actions:
          type: array
          items: { $ref: '#/components/schemas/ActionView' }
        allVisibleFieldsAdvanced:
          type: boolean
          description: True when every visible field in the section is `advanced` — the section collapses by default.

    FieldValue:
      description: |
        ⛔ `I6`: no arm of this union may carry a resolved secret — `secretRef` carries only the
        reference.
      oneOf:
        - type: object
          required: [kind, value, source]
          properties:
            kind: { type: string, enum: [value] }
            value: {}
            source: { type: string, enum: [draft, default] }
          additionalProperties: false
        - type: object
          required: [kind]
          properties:
            kind: { type: string, enum: [unset] }
          additionalProperties: false
        - type: object
          required: [kind, ref]
          properties:
            kind: { type: string, enum: [secretRef] }
            ref: { type: string }
          additionalProperties: false
        - type: object
          required: [kind]
          properties:
            kind: { type: string, enum: [secretUnset] }
          additionalProperties: false

    Validation:
      type: object
      required: [severity, code, message]
      additionalProperties: false
      properties:
        severity: { type: string, enum: [block, warn] }
        code: { type: string }
        message: { type: string }

    FieldView:
      type: object
      required: [key, renderedPath, controlKind, value, visible, enabled, virtual, advanced,
                 masked, discriminator, validations, hiddenBy]
      additionalProperties: false
      properties:
        key: { type: string }
        renderedPath:
          type: [string, "null"]
          description: Null when the field is `virtual` — it reaches no config file (`UI-D24`).
        controlKind:
          type: string
          enum: [text, number, switch, select, duration, string-list, key-value, table,
                 yaml-editor, secret]
        value: { $ref: '#/components/schemas/FieldValue' }
        options:
          type: array
          items:
            type: [string, number, boolean]
        visible: { type: boolean }
        enabled: { type: boolean }
        virtual: { type: boolean }
        advanced: { type: boolean }
        masked: { type: boolean }
        discriminator: { type: boolean }
        label: { type: string }
        helperText: { type: string }
        validations:
          type: array
          items: { $ref: '#/components/schemas/Validation' }
        hiddenBy:
          type: array
          description: Predicate keys that evaluated false. Empty when visible.
          items: { type: string }

    ActionView:
      type: object
      required: [key, kind, enabled, visible, inputs]
      additionalProperties: false
      properties:
        key: { type: string }
        kind: { type: string, enum: [test-connection, manage-catalog-entry] }
        enabled: { type: boolean }
        visible: { type: boolean }
        inputs:
          type: array
          items: { type: string }
        label: { type: string }

    RenderedEntry:
      type: object
      required: [instanceKey, renderedPath, value]
      additionalProperties: false
      properties:
        instanceKey: { type: string }
        renderedPath: { type: string }
        value: {}

    ExcludedEntry:
      type: object
      required: [instanceKey, key, reason]
      additionalProperties: false
      properties:
        instanceKey: { type: string }
        key: { type: string }
        reason:
          type: string
          enum: [hidden, virtual, action, orphan]

    MetricView:
      type: object
      required: [instanceKey, name, metricType, unit, collectionState]
      additionalProperties: false
      properties:
        instanceKey: { type: string }
        name: { type: string }
        metricType: { type: string, enum: [counter, gauge, histogram] }
        unit: { type: string }
        collectionState:
          type: string
          enum: [collectable, not-applicable, pending-config-change]

    ViewModelConfigState:
      type: object
      description: |
        `SM-D22` / architecture.md §6.1 — the five states carried separately, never collapsed.
      additionalProperties: false
      properties:
        desired: { type: string }
        rendered: { type: string }
        persisted: { type: string }
        restartObserved: { type: string }
        effectiveVerified: { type: string }

    StatusView:
      type: object
      required: [version, config, replicas, healthRollup, healthAvailability]
      additionalProperties: false
      properties:
        version:
          type: object
          required: [state, editingBlocked]
          additionalProperties: false
          properties:
            state:
              type: string
              enum: [OK, VERSION_DRIFT, VERSION_UNKNOWN, VERSION_UNVERIFIED]
            declared: { type: string }
            observed: { type: string }
            editingBlocked: { type: boolean }
            reason: { type: string }
        config: { $ref: '#/components/schemas/ViewModelConfigState' }
        replicas:
          type: array
          items:
            type: object
            required: [id, health]
            additionalProperties: false
            properties:
              id: { type: string }
              health:
                type: string
                enum: [GREEN, RED, RESTART_EXPECTED, INACTIVE_REPLICA]
        healthRollup:
          type: string
          enum: [GREEN, RED, RESTART_EXPECTED, INACTIVE_REPLICA, NOT_APPLICABLE]
        healthAvailability:
          type: string
          enum: [declared, not-declared]

    Diagnostic:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code: { type: string }
        message: { type: string }
        instanceKey: { type: string }
        key: { type: string }

    StagedConfig:
      allOf:
        - $ref: '#/components/schemas/Versioned'
        - type: object
          required: [generation]
          properties:
            generation: { type: integer, format: int64 }

    AcceptedRuntimeConfig:
      allOf:
        - $ref: '#/components/schemas/StagedConfig'
        - type: object
          description: |
            `acceptRuntimeConfig`'s 200 (`OR-104`). ⛔ Nothing here is a value: `notAccepted` lists PATHS and closed
            reasons, and a secret field carries at most `same`/`differs`.
          required: [unchanged, placementId, fileBytesDifferFromRendered, truncated, notAccepted]
          properties:
            unchanged: { type: boolean }
            placementId: { type: string, format: uuid }
            fileBytesDifferFromRendered: { type: boolean }
            truncated:
              type: boolean
              description: "`notAccepted` was cut at its 200-item bound."
            notAccepted:
              type: array
              maxItems: 200
              items:
                type: object
                required: [path, reason]
                properties:
                  path:
                    type: string
                    maxLength: 256
                    description: The dotted path as the file spells it. Never a value.
                  fieldKey:
                    type: string
                    description: The package's own field key, when the path is a declared field.
                  reason:
                    type: string
                    enum: [secret-not-read, undeclared-key, sm-owned-overlay, inactive-field, yaml-field-not-accepted]
                  comparison:
                    type: string
                    enum: [same, differs]
                    description: |
                      Only with `secret-not-read`, and only when the comparison could be made: whether the file's value
                      equals the stored secret. ⚠️ `differs` is reverted by the next apply.
                additionalProperties: false

    ConfigHistory:
      allOf:
        - $ref: '#/components/schemas/Versioned'
        - type: object
          required: [entries]
          properties:
            entries:
              type: array
              items:
                type: object
                required: [generation, at, by]
                properties:
                  generation: { type: integer, format: int64 }
                  at: { type: string, format: date-time }
                  by: { type: string }
                  configHash:
                    type: string
                    description: Computed over references, never over resolved values (`I6`).

    Strategy:
      type: string
      description: |
        **All five engine tokens** (ratified, Step 7 sitting 2026-09-30, batch 1 — the enum is
        widened; `Strategy.java` defines all five, so none is invented). **Four are selectable**
        (plan 012 T2, `OR-121`): `manual`, `rolling-health-gated`, and — each needing
        `instance.restart.overrideSafety` in addition to `instance.restart` (`OPS-Q6` B-1) —
        `rolling-no-validation` and `restart-all` (which also needs `outageConfirmedBy`, `OPS-Q7`
        C-2). `scheduled` is **not a strategy anyone selects** (plan 012 T7, `OPS-Q9` Sch-2; `OR-121`
        names `OR-53` and `OR-60`): a schedule is a **window** on `submitApply` / `rollbackApply`
        (`schedule: {notBefore, notAfter}`) that runs one of the four strategies when it opens. The token
        stays in this enum so that an old client's request is told what to do instead — `422`, naming the
        `schedule` field — rather than a generic `400`, and it puts one unselectable value into generated
        frontend types. See [`ENDPOINT-INVENTORY.md`](ENDPOINT-INVENTORY.md) §7.

        The server reads the value as a string first, so `scheduled` answers `422`, never `403` — it is
        offered no picker entry, not refused a grant nobody can hold.

        **Restart strategies are generic and package-driven** (owner ruling 2026-09-29 (S0-10)):
        under `rolling-health-gated`, SM restarts and gates on the **package-declared** health
        probe (`T0.1a`), and the response and observation state which strength the gate proved
        (point 26) — never a branch on the solution. After the restart SM reads the config file
        back and verifies it with the keyed config hash (`OR-32`; ladder `persisted` →
        `restart-observed`). `outageConfirmedBy` is required for `restart-all` (open item 15,
        answered by declaration, `I1`, never by MI development); the server records the session
        principal as the confirmation, never the value sent (`OPS-Q7` C-2).

        **Fails closed with no SM-executed probe** (ratified, Step 7 sitting 2026-09-30,
        batch 3, Q-G1 (a)): under `rolling-health-gated`, if the
        package declares no probe SM executes in v1 — none declared, or only
        `broker-heartbeat`, which v1 does not run — the engine refuses **before any write**,
        landing `FAILED_NO_EFFECT` with classifier `strategy.health.signal.absent`
        (`ApplyExecutor.java:557`). It never falls back to `docker inspect`'s own signal to
        pass the gate with no declared strength to report (row 26).
      enum: [manual, rolling-health-gated, restart-all, rolling-no-validation, scheduled]

    ApplyObservation:
      allOf:
        - $ref: '#/components/schemas/Versioned'
        - type: object
          required: [applyId, state, operation, terminal]
          properties:
            applyId: { type: string, format: uuid }
            operation:
              type: string
              description: The engine's `Operation`, verbatim — `op_known`'s closed set.
              enum: [apply, restart, stop]
            placementId:
              type: [string, "null"]
              format: uuid
              description: Absent or null means instance-wide.
            generation:
              type: [integer, "null"]
              format: int64
              description: Null for a `stop` (no generation).
            requestedAt: { type: string, format: date-time }
            state:
              type: string
              description: |
                The engine's `RequestState`, verbatim (ruling `OR-36`) — all twelve values,
                unchanged from `dp-core`'s `RequestState` enum and the `state_known` /
                `state_fits_operation` CHECKs in `V002__apply_request.sql`. `REQUESTED`,
                `RUNNING` and `APPLY_INDETERMINATE` are the three open states; everything
                else is terminal.
              enum: [REQUESTED, RUNNING, STAGED, APPLIED, FAILED_NO_EFFECT,
                     FAILED_ROLLED_BACK, CONFIG_DIVERGED, SUPERSEDED,
                     APPLY_INDETERMINATE, INDETERMINATE_RESOLVED, STOPPED, STOP_FAILED]
            terminal:
              type: boolean
              description: "`RequestState.isTerminal()` — the complement of the three open states."
            reconcileReason:
              type: string
              description: |
                Present only while the request stays `APPLY_INDETERMINATE` after the
                reconciler gave up (`OR-59`; `apply_request.reconcile_class`, V011). A
                classifier token, never file content (`I6`) — e.g. `reconcile.foreign.content`,
                `reconcile.exhausted`.
            steps:
              type: array
              items:
                type: object
                required: [step, outcome]
                properties:
                  step: { type: string }
                  placementId:
                    type: string
                    format: uuid
                    description: |
                      The placement this step addressed — the step's **own** placement (`BE-D44`). For a
                      placement-scoped request it is the request's placement; for an instance-wide stop each
                      `STOP` step names the placement it stopped (the live placements, `BE-D46`).
                  outcome: { type: string }
                  reason:
                    type: string
                    description: Present on failure — e.g. `stop.no.known.placement`.
                  gateProved:
                    type: string
                    description: |
                      Present only on a `rolling-health-gated` restart step whose gate passed on
                      the package-declared probe SM executed (point 26, `T0.1a`) — never
                      derived from the declaration alone. Absent whenever the `Strategy`
                      schema's fail-closed rule fired instead (ratified Q-G1 (a) — no
                      SM-executed probe means the step never reached a gate to prove). ⛔
                      Mirrors `solution-package.schema.json`'s
                      `$defs/health/properties/probe/properties/strength` enum, pinned by
                      `validate-openapi.py` check 15 (`T0.1a`).
                    enum: [readiness, liveness]
                  changedPaths:
                    type: array
                    maxItems: 50
                    items: { type: string, maxLength: 255, pattern: '^[A-Za-z0-9._:/@+-]+$' }
                    description: |
                      Present only on the step that found the retained pre-apply copy of the host's config file
                      changed since it was retained (`rollback-assess`, or `rollback` when the change appeared
                      between the two; reason `rollback.preimage.altered`, `OR-102`, `OR-108` (1)): the **declared,
                      non-secret** dotted paths whose content differs, sorted, at most 50. **Paths only — never a
                      value, and never a secret-flagged path** (`I6`); a difference anywhere else in the file is
                      reported only as `otherContentChanged`. Persisted with the attempt, so it is read from the
                      journal like every other step field.
                  changedPathsTruncated:
                    type: boolean
                    description: |
                      Present with `changedPaths`. `true` when more declared paths differ than the fifty listed,
                      so a cut list is never presented as the whole.
                  otherContentChanged:
                    type: boolean
                    description: |
                      Present with `changedPaths`. `true` when the file also differs somewhere that is not a
                      listed declared path (a secret-flagged path, an undeclared key, a comment, whitespace, or a
                      file that no longer parses). The change is reported, never described.

    ApplyObservationList:
      allOf:
        - $ref: '#/components/schemas/AvailabilityOnly'
        - type: object
          description: |
            §6.1: collections carry versions per item, never one version for the collection.
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/ApplyObservation' }

    Health:
      allOf:
        - $ref: '#/components/schemas/AvailabilityOnly'
        - type: object
          description: |
            No top-level `state` or `stateVersion` (ruling `OR-39`, `OR-55`) — placement-scoped
            and watermarked per placement.
          required: [placements]
          properties:
            placements:
              type: array
              items:
                type: object
                required: [placementId, state, checkedAt, stateVersion]
                properties:
                  placementId: { type: string, format: uuid }
                  state:
                    type: string
                    description: |
                      The S0-11 notify vocabulary (ruling `OR-39`): the SCREAMING rollup keys
                      plus the four NOTFOUND sub-states as distinct values, per
                      `contracts/events/notify-events.schema.json`'s `instance.health` payload.
                      `unreachable` is `OR-39`'s "`UNKNOWN`, not `DOWN`".
                    enum: [GREEN, RED, RESTART_EXPECTED, INACTIVE_REPLICA, NOT_APPLICABLE,
                           unreachable, not_exposed, missing, bootstrap]
                  checkedAt: { type: string, format: date-time }
                  stateVersion: { $ref: '#/components/schemas/StateVersion' }

    ConfigLadder:
      allOf:
        - $ref: '#/components/schemas/Versioned'
        - type: object
          required: [rungs, reached]
          properties:
            rungs:
              type: array
              description: |
                The five rungs, everywhere (ruling `OR-37`): `desired` → `rendered` →
                `persisted` → `restart-observed` → `effective-verified`. The same five
                states, in this order, appear in
                `contracts/events/notify-events.schema.json`'s `instance.config-state`
                `reached` enum. `contracts/view-models/src/types.ts`'s `ConfigState` holds
                the identical five states as camelCase keys on a keyed object
                (`restartObserved`, `effectiveVerified`, …) rather than this array-of-rung
                shape — the two spellings map to each other, they are not the same literal
                strings. The **SM agent reports the identical vocabulary** for `host-local`
                instances, so a client renders one ladder regardless of `dp-remote` or
                agent origin.
              items:
                type: object
                required: [rung, present]
                properties:
                  rung:
                    type: string
                    enum: [desired, rendered, persisted, restart-observed, effective-verified]
                  present: { type: boolean }
                  generation: { type: integer, format: int64 }
                  configHash:
                    type: string
                    description: Keyed (`OR-32`) — never computed over resolved values.
            reached:
              type: string
              description: The lowest rung across live placements.
              enum: [desired, rendered, persisted, restart-observed, effective-verified]
            placements:
              type: array
              items:
                type: object
                required: [placementId, reached]
                properties:
                  placementId: { type: string, format: uuid }
                  reached:
                    type: string
                    enum: [desired, rendered, persisted, restart-observed, effective-verified]

    LogLevel:
      allOf:
        - $ref: '#/components/schemas/AvailabilityOnly'
        - type: object
          required: [component, placementId, runtimeOverride]
          properties:
            component: { type: string }
            placementId: { type: string, format: uuid }
            liveLevel:
              type: string
              enum: [TRACE, DEBUG, INFO, WARN, ERROR]
            configuredLevel:
              type: string
              enum: [TRACE, DEBUG, INFO, WARN, ERROR]
            runtimeOverride:
              type: boolean
              description: True when `liveLevel` was set live and has not been reconciled into config.

    LogPage:
      allOf:
        - $ref: '#/components/schemas/AvailabilityOnly'
        - type: object
          required: [lines]
          properties:
            lines:
              type: array
              items:
                type: object
                required: [at, message]
                properties:
                  at: { type: string, format: date-time }
                  level: { type: string }
                  message: { type: string }

    # ── fleet (fleet-apply.md §7; REQ-013, OR-47, OR-57) ─────────────────────
    # Q-F4, Q-F5, Q-F6 and Q-F8 (fleet-apply.md §10) were ruled at the T0.1 Step 7 sitting,
    # 2026-09-30, batch 4 — each as the design's option (a). Q-F7: there is no fleet cancel or
    # halt operation in v1 (a known gap, not an omission).

    FleetApplyRequest:
      type: object
      required: [solutionId, members, strategy]
      properties:
        solutionId:
          type: string
          format: uuid
          description: The **catalog** id (`OR-41`).
        members:
          type: array
          minItems: 1
          maxItems: 100
          description: |
            Ratified Q-F4 (`100`): bounds the per-request
            `require` calls (up to two per member). Ordered — `ordinal` in the response is this
            array's index.
          items:
            type: object
            required: [instanceId, placementId, generation]
            properties:
              instanceId: { type: string, format: uuid }
              placementId:
                type: string
                format: uuid
                description: Required — v1 refuses instance-wide apply (`BE-D23`, `OR-53`).
              generation: { type: integer, format: int64, minimum: 1 }
        strategy:
          allOf:
            - $ref: '#/components/schemas/Strategy'
          description: "`scheduled` answers `422` (a fleet cannot be scheduled); `rolling-no-validation` and `restart-all` are served and need `instance.restart.overrideSafety` at each member."
        outageConfirmedBy:
          type: string
          description: |
            Required when `strategy` is `restart-all` (`400` without it). **The value is ignored**
            (`OPS-Q7` C-2): any non-blank string confirms the outage, and the server records the
            **session principal's id** as the confirmation — never this string, which is not stored
            and not trusted. Ignored for every other strategy.

        batchSize:
          type: integer
          minimum: 1
          default: 1
          description: |
            Ratified Q-F4 (`1`) — the most conservative rollout.
        onFailure:
          type: string
          enum: [continue, halt-remaining]
          default: halt-remaining
          description: |
            Ratified Q-F4 (`halt-remaining`) — a failure stops the
            rollout visibly rather than continuing.
        proceedWithAuthorized:
          type: boolean
          default: false
          description: "`OR-57`: applies the authorized members and reports the rest, instead of refusing the whole action."
      additionalProperties: false

    FleetMember:
      type: object
      description: |
        `applyId` is present exactly when `disposition` is `admitted` — before that the
        pre-minted id is a reservation that names no `apply_request`, and for `skipped` or
        `not_admitted` it never will, so this never shows an id `observeApply` would answer
        `404` for. `requestState`/`requestStateVersion` are present on the same condition.
      required: [ordinal, instanceId, placementId, generation, disposition]
      properties:
        ordinal: { type: integer, minimum: 0 }
        batch: { type: integer, minimum: 0 }
        instanceId: { type: string, format: uuid }
        placementId: { type: string, format: uuid }
        generation: { type: integer, format: int64 }
        disposition:
          type: string
          enum: [refused, pending, admitted, not_admitted, skipped]
        applyId: { type: string, format: uuid }
        settled:
          type: string
          enum: [succeeded, failed]
        refusalCode: { $ref: '#/components/schemas/ErrorCode' }
        admissionRefusal: { type: string }
        requestState:
          type: string
          enum: [REQUESTED, RUNNING, STAGED, APPLIED, FAILED_NO_EFFECT,
                 FAILED_ROLLED_BACK, CONFIG_DIVERGED, SUPERSEDED,
                 APPLY_INDETERMINATE, INDETERMINATE_RESOLVED, STOPPED, STOP_FAILED]
        requestStateVersion: { $ref: '#/components/schemas/StateVersion' }

    FleetAccepted:
      allOf:
        - $ref: '#/components/schemas/Versioned'
        - type: object
          required: [fleetId, state, members]
          properties:
            fleetId: { type: string, format: uuid }
            state:
              type: string
              description: |
                The `fleet_action` row's own state (fleet-apply.md §5.2's CHECK constraint).
                **Enumerated (round-3 review, MINOR — was untyped):** always `RUNNING` on
                admission; a fleet observed later at `observeFleetApply` may already have moved
                on to a terminal value.
              enum: [RUNNING, SUCCEEDED, COMPLETED_WITH_FAILURES, HALTED]
            members:
              type: array
              items: { $ref: '#/components/schemas/FleetMember' }

    FleetRefused:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          description: |
            `refusedMembers` is absent on the reach pre-check refusal (no member was ever
            evaluated) and present on the refuse-whole default (fleet-apply.md §3.2; Q-F5
            ratified (a)) — both answer `403` against this same schema.
          properties:
            refusedMembers:
              type: array
              items:
                type: object
                required: [ordinal, instanceId, placementId, code]
                properties:
                  ordinal: { type: integer, minimum: 0 }
                  instanceId: { type: string, format: uuid }
                  placementId: { type: string, format: uuid }
                  code:
                    type: string
                    enum: [FORBIDDEN, NOT_FOUND]

    FleetObservation:
      allOf:
        - $ref: '#/components/schemas/Versioned'
        - type: object
          description: |
            `stateVersion` is the `fleet_action` row's own stamp — an entity version, never the
            maximum of the members (`OR-55`).
          required: [fleetId, solutionId, state, strategy, batchSize, onFailure, currentBatch,
                     requestedAt, members, availability]
          properties:
            fleetId: { type: string, format: uuid }
            solutionId: { type: string, format: uuid }
            state:
              type: string
              description: |
                The `fleet_action` row's own state (fleet-apply.md §5.2's CHECK constraint).
                **Enumerated (round-3 review, MINOR — was untyped.)** `RUNNING` while
                `currentBatch` is still advancing; `terminalAt` is set exactly when this leaves
                `RUNNING` (fleet-apply.md §5.2).
              enum: [RUNNING, SUCCEEDED, COMPLETED_WITH_FAILURES, HALTED]
            strategy: { $ref: '#/components/schemas/Strategy' }
            batchSize: { type: integer, minimum: 1 }
            onFailure:
              type: string
              enum: [continue, halt-remaining]
            currentBatch: { type: integer, minimum: 0 }
            requestedAt: { type: string, format: date-time }
            terminalAt: { type: string, format: date-time }
            members:
              type: array
              description: |
                Filtered by `config.view` at each member's own instance (Q-F6); the filter
                applies to `refused` members too (Q-F8). Both ratified, option (a).
              items: { $ref: '#/components/schemas/FleetMember' }

    # ── monitoring (plan 011 P11-1.2) ─────────────────────────────────────────

    ReasonedProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          description: |
            A `Problem` that also says **why**, for the refusals whose `code` alone does not (RFC 9457 extension
            member). Known reasons: `metric-declare-deferred` (`NOT_IMPLEMENTED`, M-Q6), `query-rate` and
            `export-concurrency` (`RATE_LIMITED`, M-Q22), `log-export-concurrency` (`RATE_LIMITED`, `exportLogs`, plan 016).
          required: [reason]
          properties:
            reason: { type: string, pattern: '^[a-z][a-z-]{0,63}$' }

    SeriesCapExceededProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          description: |
            `SERIES_CAP_EXCEEDED`. The cap counts **rendered** series, not instances (`DM-D7`; M-Q24 (10): 10 per
            chart). `projected` is what the request would have rendered.
          required: [cap, projected, seriesBy]
          properties:
            cap: { type: integer, minimum: 1 }
            projected: { type: integer, minimum: 1 }
            seriesBy: { $ref: '#/components/schemas/SeriesBy' }

    ExportTooLargeProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          description: |
            `EXPORT_TOO_LARGE` (M-Q22 (4)): the projected row count exceeds the limit, so nothing was streamed.
            Narrow the range.
          required: [projectedRows, limit]
          properties:
            projectedRows: { type: integer, format: int64, minimum: 0 }
            limit: { type: integer, format: int64, minimum: 1 }

    MetricName:
      type: string
      description: A metric name, as the series table's CHECK spells it.
      pattern: '^[a-z][a-z0-9_.]{0,127}$'

    SeriesBy:
      type: string
      enum: [instance, replica]

    Capabilities:
      type: object
      description: |
        What the query API serves (`DM-D10`). Presets, caps and tiers are derived from this; nothing downstream
        hardcodes one. ⛔ No byte figure anywhere (`OQ-16` (a), `I5`): see `getCapabilities`.
      required: [queryVersion, tiers, maxRange, maxSeriesPerWidget, maxPointsPerSeries, marks, aggregations,
                 features, collector]
      properties:
        queryVersion: { type: integer, enum: [1] }
        tiers:
          type: array
          items:
            type: object
            required: [name, retention, minBucketSeconds]
            properties:
              name: { type: string, minLength: 1, maxLength: 32 }
              retention:
                type: [string, 'null']
                description: An ISO-8601 duration, or `null` for unlimited (the daily tier).
              minBucketSeconds: { type: integer, minimum: 1 }
            additionalProperties: false
        maxRange:
          type: string
          description: An ISO-8601 duration, the longest range any tier can serve.
        maxSeriesPerWidget:
          type: integer
          minimum: 1
          description: '**Rendered** series, not instances (`DM-D7`).'
        maxPointsPerSeries: { type: integer, minimum: 1 }
        marks:
          type: array
          items: { type: string, enum: [line, gauge, single-stat] }
        aggregations:
          type: array
          items: { type: string, enum: [sum, avg, min, max] }
        features:
          type: object
          required: [forceRaw, streamingExport, pngExport]
          properties:
            forceRaw: { type: boolean }
            streamingExport: { type: boolean }
            pngExport: { type: boolean }
          additionalProperties: false
        collector:
          type: object
          description: |
            M-Q21 (`OR-79`) and M-Q19 (`OR-76`). **Scope of each field (`I5`):** `state`, `runwayEnd`,
            `unfrozenClosedPartitions` and `disk.state` are install-level health. `reasons` are counted over the last
            24 hours for **the caller's organization only**.
          required: [state, unfrozenClosedPartitions, reasons]
          properties:
            state:
              type: string
              enum: [live, degraded, unknown]
              description: |
                `degraded` when the data plane reports less than a month of partition runway or a critical disk (a
                measured fact). `unknown` when it has measured neither or only part of them: `runwayEnd` or `disk` is
                absent (OR-112 (6), W4-05). `live` only when both are present and the data plane reports no
                degradation. The UI shows `unknown` as "not measured yet", never as healthy.
            runwayEnd:
              type: string
              format: date
              description: |
                The last day for which raw partitions already exist (UTC). **Absent** before the data plane's first
                partition keep: there is no measurement to report, and none is invented.
            unfrozenClosedPartitions:
              type: integer
              minimum: 0
              description: |
                Attached raw partitions whose upper bound is at or before now (UTC) and that have no row in the
                freeze log. A closed month nobody has frozen (`OQ-10` (a)).
            reasons:
              type: array
              items:
                type: object
                required: [reason, last24h]
                properties:
                  reason: { $ref: '#/components/schemas/CollectorReason' }
                  last24h: { type: integer, format: int64, minimum: 0 }
                additionalProperties: false
            disk:
              type: object
              description: |
                The disk-usage alarm (M-Q19, `OQ-16` (a)): `sm_metrics` and database size against an operator-set
                budget. **Visible only: it never stops ingest.** `unconfigured` when no budget is set, which is
                shown and never read as `ok`. **Absent** when a budget is set and no measurement has succeeded yet
                (OR-112 (6), W4-05): then `collector.state` is `unknown` unless the data plane already reports
                `degraded`.
              required: [state]
              properties:
                state: { type: string, enum: [ok, warning, critical, unconfigured] }
              additionalProperties: false
          additionalProperties: false
      additionalProperties: false

    CollectorReason:
      type: string
      description: M-Q21's closed reason list, plus `out_of_order` (`OQ-12`), `ambiguous_placement` (`OQ-15`) and `clock_skew`
        (an agent's samples refused while its measured clock offset exceeds the window; `OR-134`, `sm_metrics` V004).
      enum: [scrape_failed, parse_failed, cap_rejected, undeclared_dropped, decrease_without_restart,
             runway_degraded, deadline_missed, buffer_dropped, out_of_order, ambiguous_placement, clock_skew]

    EntityType:
      type: object
      required: [id, label]
      properties:
        id: { type: string, minLength: 1, maxLength: 128 }
        label: { type: string }
      additionalProperties: false

    MetricInstance:
      type: object
      required: [id, label, replicaCount]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        replicaCount:
          type: integer
          minimum: 1
          description: "The instance's live placements: the multiplier of the series cap under `seriesBy: replica`."
      additionalProperties: false

    MetricInstanceList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MetricInstance' }
        total: { type: integer, minimum: 0 }
      additionalProperties: false

    MetricCatalogEntry:
      type: object
      description: |
        One metric a reachable instance's package version declares. `lastSeen` is epoch **milliseconds**, as the
        demo and the frontend carry it (`dynamic-metrics` §5.5's example shows an ISO string; the consumers do not).
      required: [name, metricType, unit, layer, state, labelKeys, durability, onUnavailable, observedAvailability]
      properties:
        name: { $ref: '#/components/schemas/MetricName' }
        metricType: { type: string, enum: [counter, gauge, histogram] }
        unit: { type: string, minLength: 1, maxLength: 64 }
        layer:
          type: string
          enum: [package-baseline]
          description: '`user-extension` has no v1 producer: per-instance overrides are out of v1 (M-Q5).'
        state:
          type: string
          enum: [plottable, unsupported]
          description: |
            `unsupported` is a `histogram` (M-Q6) or an `http_json` metric that declares no `port` (`OQ-24` (b)),
            and `unsupportedReason` says which. `needs-typing` and `type-suspect` have no v1 producer.
        unsupportedReason:
          type: string
          enum: [histogram, no-port-declared]
          description: Present exactly when `state` is `unsupported`.
        lastSeen:
          type: integer
          format: int64
          minimum: 0
          description: |
            Epoch milliseconds of the newest sample in the caller's reach. Absent, never zero, when none is known:
            with `observedAvailability.state` `live` it means the metric was never observed; with `unavailable` it
            means the data plane could not say.
        observedAvailability:
          allOf:
            - $ref: '#/components/schemas/Availability'
          description: |
            W2-06, P11-7.2: whether the data plane's half of this entry (`lastSeen`, `collector`) could be read.
            `live` when it was, however empty the answer. `unavailable` (with a `reason`) when the plane did not
            answer: the observed fields are then unknown, not zero, and a console renders "monitoring unavailable",
            never "no data yet". Absent observed fields are legal with `live` only as "never observed".
        labelKeys:
          type: array
          items: { type: string }
          description: Always empty in v1 (the label allowlist is empty, D-10).
        durability: { type: string, enum: [durable, best-effort] }
        onUnavailable:
          type: string
          enum: [degrade, error]
          description: |
            The package's declared value (`OQ-13` (a)). In v1 both give a gap and a `scrape_failed` count; the
            distinction is routed.
        restartDetection:
          type: string
          enum: [declared, docker, inferred]
          description: How a counter's resets are detected (M-Q9). Present for a counter.
        collector:
          type: object
          description: |
            `OQ-17` (a): the reasons counted over the last 24 hours **per placement serving this metric**. It is not
            per metric: the counter has no metric column. `undeclared_dropped` is never listed here, only in
            capabilities.
          required: [scope, reasons]
          properties:
            scope: { type: string, enum: [placements-serving-this-metric] }
            reasons:
              type: array
              items:
                type: object
                required: [reason, last24h]
                properties:
                  reason:
                    type: string
                    enum: [scrape_failed, parse_failed, cap_rejected, decrease_without_restart, runway_degraded,
                           deadline_missed, buffer_dropped, out_of_order, ambiguous_placement, clock_skew]
                  last24h: { type: integer, format: int64, minimum: 0 }
                additionalProperties: false
          additionalProperties: false
      additionalProperties: false

    MetricSelector:
      type: object
      required: [entityType, instanceIds, labels]
      properties:
        entityType: { type: string, minLength: 1, maxLength: 128 }
        instanceIds:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
          description: |
            Reach-filtered by the server, silently (M-Q17): an id the caller cannot see is omitted exactly like one
            that does not exist. Never the tenant: that is the session's (`I5`).
        labels:
          type: object
          additionalProperties: { type: string }
          description: Must be empty in v1 (the label allowlist is empty, D-10); a key is `400`.
      additionalProperties: false

    MetricAggregation:
      type: object
      required: [acrossReplicas, acrossInstances]
      properties:
        acrossReplicas: { type: string, enum: [auto, none, sum, avg, min, max] }
        acrossInstances: { type: string, enum: [none, sum, avg, min, max] }
      additionalProperties: false

    MetricQueryRequest:
      type: object
      description: |
        Exactly one metric (`DM-D23`). No free bucket size: `resolution` is `auto` or `raw` (`SM-D31`). The order is
        fixed: replicas, then instances, then `groupBy`, which composes only after instance aggregation.
      required: [queryVersion, metric, selector, range, resolution, seriesBy, aggregation]
      properties:
        queryVersion: { type: integer, enum: [1] }
        metric: { $ref: '#/components/schemas/MetricName' }
        selector: { $ref: '#/components/schemas/MetricSelector' }
        range:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
          additionalProperties: false
        resolution: { type: string, enum: [auto, raw] }
        seriesBy: { $ref: '#/components/schemas/SeriesBy' }
        aggregation: { $ref: '#/components/schemas/MetricAggregation' }
        groupBy:
          type: array
          items: { type: string, minLength: 1, maxLength: 128 }
          description: Must be empty or absent in v1 (D-10); a key is `400`.
      additionalProperties: false

    MetricPoint:
      type: array
      description: |
        `[timestamp, value, sampleCount, expectedCount]`. The last two let the chart show coverage rather than a
        confident line. A bucket with no samples has **no tuple**, never a `null` (`UI-D8`).
      prefixItems:
        - { type: string, format: date-time }
        - { type: number }
        - { type: integer, minimum: 0 }
        - { type: integer, minimum: 0 }
      minItems: 4
      maxItems: 4
      items: false

    MetricQueryResult:
      type: object
      required: [queryVersion, metric, render, resolution, coverage, gapThresholdSeconds, series, partial]
      properties:
        queryVersion: { type: integer, enum: [1] }
        metric:
          type: object
          required: [name, metricType, unit]
          properties:
            name: { $ref: '#/components/schemas/MetricName' }
            metricType: { type: string, enum: [counter, gauge] }
            unit: { type: string }
          additionalProperties: false
        render:
          type: object
          description: "Server-decided from the metric's type (`SM-D31`): a counter is never shipped as a raw climb."
          required: [transform]
          properties:
            transform: { type: string, enum: [none, rate, delta] }
            rateSeconds: { type: integer, minimum: 1 }
          additionalProperties: false
        resolution:
          type: object
          required: [requested, served, bucketSeconds]
          properties:
            requested: { type: string, enum: [auto, raw] }
            served: { type: string, enum: [raw, hourly, daily] }
            bucketSeconds: { type: integer, minimum: 1 }
          additionalProperties: false
        coverage:
          type: object
          required: [requestedFrom, servedFrom, truncatedByRetention]
          properties:
            requestedFrom: { type: string, format: date-time }
            servedFrom: { type: string, format: date-time }
            truncatedByRetention: { type: boolean }
            provisionalFrom:
              type: string
              format: date-time
              description: |
                Set when the right edge of a rollup-tier range is stitched from raw samples that have not rolled up
                yet (discovery default D-6): everything from here on is provisional.
          additionalProperties: false
        gapThresholdSeconds:
          type: integer
          minimum: 1
          description: |
            Server-declared, so the Java rollup and the chart cannot disagree about where a line breaks (`UI-D8`):
            2 times the served tier's interval or bucket width.
        series:
          type: array
          items:
            type: object
            required: [seriesRef, label, replicaComposition, state, points, gaps]
            properties:
              seriesRef:
                type: object
                required: [instanceId, placementId, sourceKey]
                properties:
                  instanceId:
                    type: [string, 'null']
                    format: uuid
                    description: |
                      The instance this line belongs to. An across-instances aggregate line (`acrossInstances` other than
                      `none`) belongs to no single instance and carries **no instance id**: `null`, with a null
                      `placementId` and `sourceKey` too (OR-112 (6), W4-06). It was the nil UUID
                      (`00000000-…`, W3-09) so that the field stayed a uuid; a fixed UUID that names no instance is a
                      value a renderer could mistake for one. A renderer keys an aggregate line on the absence, never
                      on a value.
                  placementId: { type: [string, 'null'], format: uuid }
                  sourceKey: { type: [string, 'null'] }
                additionalProperties: false
              label: { type: string }
              replicaComposition:
                type: object
                required: [total, inactive]
                properties:
                  total: { type: integer, minimum: 0 }
                  inactive: { type: integer, minimum: 0 }
                additionalProperties: false
              state:
                type: string
                enum: [ok, inactive-replica, pending-config-change, type-suspect, unverified-durability]
              points:
                type: array
                items: { $ref: '#/components/schemas/MetricPoint' }
              gaps:
                type: array
                items:
                  type: object
                  required: [from, to, reason]
                  properties:
                    from: { type: string, format: date-time }
                    to: { type: string, format: date-time }
                    reason: { type: string, description: 'For example `no-samples`.' }
                  additionalProperties: false
            additionalProperties: false
        partial:
          type: object
          description: |
            M-Q17: lists only instances the caller may see that have no data in range (`not-collecting`) or whose
            collector is degraded (`collector-degraded`). An instance the caller cannot see is never named.
          required: [degraded, unavailable]
          properties:
            degraded: { type: boolean }
            unavailable:
              type: array
              items:
                type: object
                required: [instanceId, label, reason]
                properties:
                  instanceId: { type: string, format: uuid }
                  label: { type: string }
                  reason: { type: string, enum: [not-collecting, collector-degraded] }
                additionalProperties: false
          additionalProperties: false
      additionalProperties: false

    WidgetBody:
      type: object
      description: |
        A widget document (`dynamic-metrics` §7, `DM-D6`): fully serializable, one metric, one `mark`. **Unknown
        fields are preserved on round-trip**, so an older console never destroys a newer one's widget by saving it
        back; that is why this schema is open.
      required: [schemaVersion, title, mark, query, options, axes, legend, series, thresholds, refresh]
      properties:
        schemaVersion: { type: integer, minimum: 1 }
        title: { type: string, minLength: 1, maxLength: 120 }
        mark:
          type: string
          enum: [line, gauge, single-stat]
          description: The only visualization axis (`SM-D31`, `UI-D14`).
        options: { type: object }
        query:
          type: object
          description: One metric, and (M-Q10) exactly this dashboard's one instance in `selector.instanceIds`.
          required: [metric, selector]
          properties:
            metric: { $ref: '#/components/schemas/MetricName' }
            selector: { $ref: '#/components/schemas/MetricSelector' }
            seriesBy: { $ref: '#/components/schemas/SeriesBy' }
            aggregation: { $ref: '#/components/schemas/MetricAggregation' }
            groupBy:
              type: array
              items: { type: string }
        range: { type: object }
        resolution: { type: string, enum: [auto, raw] }
        axes: { type: object }
        legend: { type: object }
        series: { type: object }
        thresholds: { type: array, items: { type: object } }
        refresh: { type: object }

    WidgetSubmission:
      allOf:
        - $ref: '#/components/schemas/WidgetBody'
        - type: object
          required: [layer]
          properties:
            layer:
              type: string
              enum: [shared]
              description: A saved widget is `shared`; the server assigns `id` and ignores any one sent.

    Widget:
      allOf:
        - $ref: '#/components/schemas/WidgetBody'
        - type: object
          required: [id, layer]
          properties:
            id: { type: string, pattern: '^[dw]_[0-9a-f]{12}$' }
            layer:
              type: string
              enum: [product-default, shared]
              description: |
                `product-default` is derived from the package on every read and replaced wholesale on an upgrade;
                `shared` is an operator's save and is never touched by one.
            hidden:
              type: boolean
              description: A hidden `product-default`. Never set on a `shared` widget.

    WidgetPlacement:
      type: object
      description: One cell of the 12-column grid. `order` is the keyboard and screen-reader traversal, independent of position.
      required: [widgetId, x, y, w, h, order]
      properties:
        widgetId: { type: string, pattern: '^[dw]_[0-9a-f]{12}$' }
        x: { type: integer, minimum: 0, maximum: 11 }
        y: { type: integer, minimum: 0, maximum: 10000 }
        w: { type: integer, minimum: 1, maximum: 12 }
        h: { type: integer, minimum: 1, maximum: 20 }
        order: { type: integer, minimum: 0 }
      additionalProperties: false

    Dashboard:
      type: object
      description: |
        One instance's shared dashboard (M-Q23, `OR-78`). `revision` is the optimistic-concurrency token a write may
        present in `X-SM-Dashboard-Revision` (required on every write); `0` while nothing is stored yet.
      required: [id, schemaVersion, revision, widgets, layout, range, refresh]
      properties:
        id: { type: string, pattern: '^db_[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$' }
        schemaVersion: { type: integer, minimum: 1 }
        revision: { type: integer, format: int64, minimum: 0 }
        widgets:
          type: array
          items: { $ref: '#/components/schemas/Widget' }
        layout:
          type: array
          items: { $ref: '#/components/schemas/WidgetPlacement' }
        range:
          type: object
          required: [preset]
          properties:
            preset: { type: string }
        refresh:
          type: object
          required: [intervalSeconds]
          properties:
            intervalSeconds: { type: [integer, 'null'], minimum: 1 }
