asyncapi: 3.0.0
info: { title: SM mesh events, version: 1.0.0, description: "Topics per design §4; payloads per the JSON Schemas in this folder. v1 in the topic is load-bearing (BE-D4)." }
channels:
  instanceNotify:
    address: sm/v1/{organization}/notify/instance/{instanceId}/{aspect}
    # `quarantine` is in this enum because `metrics.quarantine` derives
    # sm/v1/<organization>/notify/instance/<instanceId>/quarantine (design §3 event catalog +
    # fixtures/expected-topics.json). BE-D4's taxonomy block does not list it — flagged.
    parameters: { organization: {}, instanceId: {}, aspect: { enum: [health, config-state, version, quarantine] } }
    messages: { notify: { payload: { $ref: ./notify-events.schema.json } } }
  rolloutNotify:
    address: sm/v1/{organization}/notify/instance/{instanceId}/rollout/{applyId}
    parameters: { organization: {}, instanceId: {}, applyId: {} }
    messages: { notify: { payload: { $ref: ./notify-events.schema.json } } }
  applyOutcomeNotify:
    # OR-4 / OR-46, placement-scoped notice on the GATED topic shape (owner ruling 2026-09-29 (T0.2)).
    # Stop outcomes are not published here: stops are REST-observed (README, "Stops are REST-observed").
    address: sm/v1/{organization}/notify/instance/{instanceId}/apply-outcome/{applyId}
    parameters: { organization: {}, instanceId: {}, applyId: {} }
    messages: { notify: { payload: { $ref: ./notify-events.schema.json } } }
  catalogNotify:
    address: sm/v1/{organization}/notify/catalog/package
    parameters: { organization: {} }
    messages: { notify: { payload: { $ref: ./notify-events.schema.json } } }
  stream:
    address: sm/v1/{organization}/stream/{grantId}/{seriesKey}
    parameters: { organization: {}, grantId: {}, seriesKey: {} }
    messages: { point: { payload: { type: object, description: "normalized point + series identity; schema lands with BE-D6 phase 2" } } }
